om outras áreas poderia enriquecer o trabalho?","emd",2,"Diga uma área que poderia enriquecer o trabalho e o que ela traria."],[865,"Interdisciplinaridade","Como explicaria sua abordagem a especialistas de outra área?","emd",2,"Explique a abordagem sem o jargão da sua área, focando no que você queria saber e como descobriu."],[869,"Interdisciplinaridade","Que conceito de outra área poderia ajudar na discussão?","md",3,"Cite um conceito de outra área que ajudaria a interpretar os resultados e diga como."],[873,"Interdisciplinaridade","Que cuidado adotaria ao incorporar uma perspectiva externa?","md",3,"Diga o cuidado de usar o conceito no sentido original e de não forçar a sua aplicação."],[877,"Interdisciplinaridade","Como identifica possibilidades de colaboração intelectual?","md",2,"Diga com quem ou com que grupo uma colaboração faria sentido e o que cada lado ganharia."],[881,"Alternativas","Que outro caminho poderia levar ao mesmo objetivo?","emd",2,"Cite outro caminho possível e compare com o seu em vantagens e limitações."],[885,"Alternativas","Como compararia duas abordagens plausíveis?","md",3,"Mostre os critérios de comparação, como adequação à pergunta, custo, precisão e viabilidade, e aplique-os."],[889,"Alternativas","Que alternativa descartou e por quê?","temd",2,"Diga uma alternativa que você descartou e o motivo, com franqueza."],[893,"Alternativas","Que escolha seria diferente sob outras condições?","md",3,"Diga em que condição você faria outra escolha, como mais tempo, mais dados ou outro contexto."],[897,"Alternativas","Como decidiria entre soluções igualmente defensáveis?","md",3,"Mostre um critério de desempate, como a pergunta, a simplicidade ou a viabilidade, e explique."],[901,"Questões futuras","Que pergunta permanece em aberto?","temd",1,"Aponte uma pergunta que o trabalho deixou em aberto e por que ela é importante."],[905,"Questões futuras","Que aspecto merece aprofundamento futuro?","temd",2,"Diga o que mereceria ser aprofundado e como você faria isso."],[909,"Questões futuras","Como daria continuidade ao trabalho?","temd",2,"Descreva o próximo passo concreto se você continuasse a pesquisa."],[913,"Questões futuras","Que questão nova surgiu da elaboração do trabalho?","emd",2,"Conte uma pergunta nova que surgiu durante o trabalho e o que a provocou."],[917,"Questões futuras","Qual seria a prioridade de uma próxima etapa?","emd",2,"Diga a prioridade e o motivo dela, ligado aos resultados que você obteve."],[921,"Conclusões","Que conclusão pode ou espera sustentar?","temd",2,"Diga a conclusão principal em uma frase e a evidência que a sustenta."],[925,"Conclusões","Como relaciona as conclusões pretendidas ou apresentadas aos objetivos?","temd",2,"Mostre que cada conclusão responde a um objetivo. Se um objetivo ficou sem conclusão, explique o motivo."],[929,"Conclusões","Que conclusão exigiria maior cautela?","emd",3,"Aponte a conclusão mais ousada e diga por que ela pede cautela."],[933,"Conclusões","O que não seria legítimo concluir a partir do trabalho?","md",3,"Diga o que alguém poderia concluir de forma errada a partir do seu trabalho, e por que isso não é legítimo."],[937,"Conclusões","Como evita introduzir nas conclusões afirmações não fundamentadas?","emd",2,"Mostre que cada conclusão tem base em um resultado do trabalho e que você não acrescentou nada sem evidência."],[941,"Defesa oral","Como responderia a uma contestação da relevância do trabalho?","emd",3,"Responda com o problema, com quem é afetado e com o que o trabalho entrega, de forma calma e com dados."],[945,"Defesa oral","Que ponto explicaria primeiro diante de uma dúvida da banca?","temd",2,"Diga o que você explicaria primeiro: normalmente a pergunta e o resultado principal."],[949,"Defesa oral","Como defenderia uma escolha que a banca considera inadequada?","md",3,"Mostre o motivo da escolha, reconheça a crítica e diga o que mudaria se a banca tiver razão. Firmeza e abertura juntas."],[953,"Defesa oral","Que pergunta gostaria de receber sobre seu trabalho?","temd",1,"Escolha um ponto forte que você gostaria de mostrar e prepare uma resposta curta e segura."],[957,"Defesa oral","Como reconheceria uma questão para a qual ainda não tem resposta?","temd",2,"Diga com tranquilidade que ainda não tem a resposta, explique o que já sabe e como buscaria o restante."],[961,"Revisão","Que alteração teria maior impacto positivo no trabalho?","emd",2,"Aponte uma alteração e o ganho que ela traria ao trabalho."],[965,"Revisão","Como priorizaria sugestões de revisão conflitantes?","md",3,"Diga como decidiria, pela pergunta central e pela evidência, e que conversaria com o orientador."],[969,"Revisão","Que parte do trabalho manteria mesmo após críticas?","temd",2,"Diga a parte que você manteria e por que ela é sólida."],[973,"Revisão","Como avaliaria a pertinência de uma sugestão de mudança?","emd",2,"Explique que avaliaria se a sugestão melhora a resposta à pergunta e se é viável."],[977,"Revisão","Que aspecto revisaria antes de divulgar o trabalho?","temd",2,"Cite o que revisaria antes de publicar, como texto, figuras, dados e referências."],[981,"Visão global","Como conecta o tema, o propósito e a abordagem em uma explicação única?","emd",2,"Una tema, propósito e abordagem em duas frases que formem uma história só."],[985,"Visão global","Qual é a ideia que dá unidade ao trabalho?","emd",2,"Diga a ideia central que liga todas as partes do trabalho."],[989,"Visão global","O que torna o trabalho academicamente defensável?","md",3,"Mostre o que torna o trabalho defensável: pergunta clara, método adequado, evidência e conclusões coerentes."],[993,"Visão global","Que aspecto mais representa sua identidade intelectual neste trabalho?","md",3,"Diga o que o trabalho mostra sobre o seu jeito de pesquisar e pensar."],[997,"Visão global","Como avaliaria o trabalho em seu conjunto?","temd",2,"Faça uma avaliação equilibrada, com um ponto forte, um ponto a melhorar e a contribuição."]];
const EST = [[2101,"ANOVA e testes post hoc","Se sua ANOVA apresentou um resultado significativo, por que isso não permite afirmar imediatamente que todos os grupos são diferentes entre si?","temd",2,"A ANOVA testa se ao menos uma média difere das outras. Para saber quais grupos diferem, você precisa de comparações posteriores ou contrastes."],[2102,"ANOVA e testes post hoc","Considerando os objetivos da pesquisa, por que você escolheu uma ANOVA em vez de realizar vários testes t entre os grupos?","temd",2,"Vários testes t aumentam a chance de achar diferença por acaso. A ANOVA testa todos os grupos de uma vez, com uma única taxa de erro."],[2103,"ANOVA e testes post hoc","Caso as variâncias dos grupos sejam diferentes, como isso afetaria a validade da ANOVA e que alternativa você consideraria?","emd",2,"Variâncias diferentes, sobretudo com grupos de tamanhos desiguais, distorcem o valor de p. Cite alternativas como a ANOVA de Welch ou um modelo que estime variâncias separadas."],[2104,"ANOVA e testes post hoc","Se os grupos apresentarem tamanhos amostrais muito diferentes, quais cuidados adicionais você teria na interpretação da ANOVA?","emd",2,"Com grupos desiguais, a ANOVA fica mais sensível a variâncias diferentes e o poder cai nos grupos pequenos. Mostre os tamanhos e as variâncias de cada grupo."],[2105,"ANOVA e testes post hoc","Em uma ANOVA com dois fatores, como interpretaria uma interação significativa mesmo quando os efeitos principais não são significativos?","emd",3,"A interação indica que o efeito de um fator depende do nível do outro. Os efeitos podem se anular na média e por isso os principais não aparecem. Mostre o gráfico de interação."],[2106,"ANOVA e testes post hoc","Se a interação entre dois fatores for significativa, em que condições seria inadequado interpretar isoladamente suas médias marginais?","emd",3,"Quando há interação, a média marginal mistura efeitos que mudam de direção ou tamanho. Interprete os efeitos simples, ou seja, um fator dentro de cada nível do outro."],[2107,"ANOVA e testes post hoc","Como você explicaria a razão F da ANOVA e sua relação com a variabilidade dentro e entre os grupos?","temd",2,"F é a razão entre a variação entre grupos e a variação dentro dos grupos. Quanto maior, mais as médias diferem em relação ao ruído."],[2108,"ANOVA e testes post hoc","Por que um valor de F elevado não significa necessariamente que a diferença entre grupos tenha grande importância prática?","temd",2,"F alto pode vir de amostras grandes ou pouca variação, mesmo com diferença pequena. Mostre o tamanho do efeito, como eta quadrado ou a diferença em unidades originais."],[2109,"ANOVA e testes post hoc","Como você determinaria quais comparações pós-ANOVA são relevantes para os objetivos, evitando testar diferenças sem interesse científico?","emd",2,"Defina antes as comparações que respondem aos objetivos. Testar tudo aumenta o risco de achar diferenças sem sentido científico."],[2110,"ANOVA e testes post hoc","Por que você escolheria Tukey em vez de Dunnett caso desejasse comparar todos os tratamentos entre si?","temd",2,"Tukey compara todos os pares de tratamentos. Dunnett compara cada tratamento só com o controle. Escolha pela pergunta."],[2111,"ANOVA e testes post hoc","Se o objetivo fosse comparar cada tratamento exclusivamente com um controle, que procedimento de comparação múltipla seria mais adequado?","temd",2,"O teste de Dunnett é feito para comparar cada tratamento com um único controle, com menos testes e mais poder."],[2112,"ANOVA e testes post hoc","Em que situação você utilizaria contrastes planejados em vez de comparações exploratórias realizadas após observar os resultados?","emd",3,"Contrastes planejados são definidos antes de ver os dados e respondem a hipóteses. Comparações feitas depois de olhar os dados são exploratórias e pedem correção."],[2113,"ANOVA e testes post hoc","Como a correção para múltiplas comparações modifica a interpretação das diferenças entre grupos?","temd",2,"A correção torna cada comparação mais exigente para controlar o erro do conjunto. Algumas diferenças deixam de ser significativas, e você deve dizer isso."],[2114,"ANOVA e testes post hoc","Se dois grupos compartilham uma letra em um gráfico de Tukey, é correto afirmar que suas médias são iguais? Justifique.","temd",3,"Não. Letras iguais indicam que não houve evidência de diferença, e não que as médias são iguais. Ausência de evidência não é evidência de igualdade."],[2115,"ANOVA e testes post hoc","Como você apresentaria a magnitude das diferenças detectadas pela ANOVA além dos valores de p?","temd",2,"Mostre as diferenças entre médias com intervalos de confiança e um tamanho de efeito. O valor de p sozinho não diz o tamanho da diferença."],[2116,"ANOVA e testes post hoc","O que uma ANOVA não significativa permite concluir quando os intervalos de confiança das diferenças são muito amplos?","emd",3,"Intervalos amplos indicam pouca precisão. O resultado é inconclusivo: não houve evidência de diferença, mas também não se pode afirmar que ela não existe."],[2117,"ANOVA e testes post hoc","Como distinguiria uma ANOVA de uma via de uma ANOVA fatorial considerando a estrutura do seu delineamento?","te",1,"A ANOVA de uma via tem um fator. A fatorial tem dois ou mais fatores cruzados e permite testar interação. Diga qual é o seu desenho."],[2118,"ANOVA e testes post hoc","Se as mesmas unidades forem avaliadas em três ocasiões, por que uma ANOVA convencional de grupos independentes seria inadequada?","temd",2,"As medidas da mesma unidade são correlacionadas. Tratá-las como independentes subestima o erro. Use medidas repetidas ou modelo misto."],[2119,"ANOVA e testes post hoc","Em uma ANOVA de medidas repetidas, o que representa a esfericidade e quais alternativas existem quando ela não é atendida?","emd",3,"Esfericidade é a igualdade das variâncias das diferenças entre ocasiões. Se falhar, use as correções de Greenhouse-Geisser ou Huynh-Feldt, ou um modelo misto."],[2120,"ANOVA e testes post hoc","Como você incorporaria um fator de blocos ao modelo caso as unidades experimentais apresentassem heterogeneidade conhecida?","emd",2,"Inclua o bloco como fator no modelo. Ele retira do erro a variação conhecida entre unidades e aumenta a precisão."],[2121,"ANOVA e testes post hoc","Se houver uma covariável quantitativa importante, como justificaria utilizar ANCOVA em vez de simplesmente comparar médias?","emd",3,"A ANCOVA ajusta as médias pela covariável e reduz a variação não explicada. Isso aumenta a precisão e corrige diferenças iniciais entre grupos."],[2122,"ANOVA e testes post hoc","Na ANCOVA, como avaliaria se a relação entre a covariável e a resposta é semelhante nos diferentes grupos?","md",3,"Teste a interação entre covariável e grupo. Se as inclinações forem diferentes, a ANCOVA clássica não se aplica e você precisa modelar a interação."],[2123,"ANOVA e testes post hoc","Se a ANOVA fatorial tiver células vazias, que dificuldades surgem para estimar efeitos e interações?","md",3,"Sem observações em algumas combinações, certas interações não podem ser estimadas. Diga quais efeitos ficam sem estimativa e como reorganizou o modelo."],[2124,"ANOVA e testes post hoc","Como a escolha entre somas de quadrados dos tipos I, II e III pode alterar as conclusões de uma ANOVA desbalanceada?","md",3,"O tipo I depende da ordem dos termos. O II testa cada efeito principal ajustado pelos outros, sem interação. O III testa na presença de todos os termos. Em dados desbalanceados os resultados mudam."],[2125,"ANOVA e testes post hoc","Se a análise dos resíduos revelar assimetria acentuada, que aspectos do delineamento e da distribuição avaliaria antes de substituir a ANOVA?","emd",3,"Veja se a assimetria vem de outliers, da natureza da variável, como contagens ou proporções, ou de grupos misturados. Às vezes o modelo adequado é um GLM, e não uma transformação."],[2126,"ANOVA e testes post hoc","Por que aplicar uma transformação aos dados pode alterar a pergunta científica respondida pela comparação entre médias?","md",3,"Após transformar, você compara médias na nova escala. A média do logaritmo, por exemplo, corresponde à média geométrica. Diga o que isso significa para a sua pergunta."],[2127,"ANOVA e testes post hoc","Como você diferenciaria a variabilidade residual de uma fonte de variação sistemática não incluída na ANOVA?","md",3,"Procure padrões nos resíduos por data, local, operador ou lote. Padrões indicam uma fonte de variação que falta no modelo."],[2128,"ANOVA e testes post hoc","Se uma diferença entre tratamentos desaparecer após incluir um bloco, como interpretaria essa mudança?","emd",3,"A diferença pode ter vindo da variação entre blocos e não dos tratamentos. Explique o que isso revela sobre o desenho."],[2129,"ANOVA e testes post hoc","Como você avaliaria se uma observação influente está determinando a significância global da ANOVA?","emd",2,"Refaça a análise sem a observação e compare. Use distância de Cook. Se a conclusão muda por um ponto, diga isso."],[2130,"ANOVA e testes post hoc","Se a banca solicitasse que você reformulasse sua ANOVA como regressão linear com fatores categóricos, como demonstraria a equivalência entre as abordagens?","md",3,"A ANOVA é uma regressão com variáveis indicadoras para os grupos. Os testes F coincidem. Mostre os coeficientes como diferenças em relação à referência."],[2131,"Regressão linear simples e múltipla","Como justificaria a utilização de uma regressão linear quando o mecanismo que relaciona suas variáveis ainda não é completamente conhecido?","temd",2,"A regressão descreve a associação e permite previsão sem conhecer o mecanismo. Deixe claro que você não afirma causa."],[2132,"Regressão linear simples e múltipla","Como interpretaria o coeficiente angular considerando as unidades de medida da variável resposta e da explicativa?","te",1,"O coeficiente angular é quanto a resposta muda, na unidade dela, a cada unidade a mais da variável explicativa. Diga o seu valor com as unidades."],[2133,"Regressão linear simples e múltipla","Se o intercepto corresponder a uma condição impossível no contexto da pesquisa, que interpretação seria adequada?","temd",2,"O intercepto é o valor previsto quando a explicativa é zero. Se zero não faz sentido, ele é só um parâmetro de ajuste. Centralizar a variável ajuda."],[2134,"Regressão linear simples e múltipla","Por que um coeficiente de determinação elevado não garante que o modelo represente corretamente o fenômeno estudado?","temd",2,"R² alto não garante que a forma do modelo esteja certa nem que os pressupostos sejam atendidos. Mostre os resíduos e o sentido do modelo."],[2135,"Regressão linear simples e múltipla","Como interpretaria um coeficiente significativo em uma regressão com baixo R² e elevada variabilidade residual?","temd",2,"O coeficiente indica uma tendência real, mas o modelo explica pouco da variação. Há outros fatores importantes, e previsões individuais serão imprecisas."],[2136,"Regressão linear simples e múltipla","Se uma variável apresentar associação positiva isoladamente e negativa no modelo múltiplo, quais mecanismos investigaria?","md",3,"A mudança de sinal indica confundimento ou supressão por outra variável correlacionada. Mostre as correlações entre as explicativas."],[2137,"Regressão linear simples e múltipla","Como você explicaria o significado de manter as demais variáveis constantes ao interpretar um coeficiente de regressão múltipla?","emd",2,"O coeficiente é o efeito de uma variável quando as outras do modelo não mudam. Isso nem sempre é realista se as variáveis andam juntas."],[2138,"Regressão linear simples e múltipla","Como avaliaria se a inclusão de uma variável adicional melhora a explicação do fenômeno ou apenas aumenta a complexidade do modelo?","emd",2,"Compare os modelos por AIC, teste de razão de verossimilhança ou validação, e não só pelo R², que sempre aumenta."],[2139,"Regressão linear simples e múltipla","Em que situação o R² ajustado seria mais informativo que o R² convencional e quais limitações ambos apresentam?","temd",2,"O R² ajustado penaliza o número de variáveis. Os dois descrevem a variação explicada, mas não dizem se o modelo está correto."],[2140,"Regressão linear simples e múltipla","Como distinguiria uma observação com resíduo elevado de uma observação com alta alavancagem?","emd",2,"Resíduo alto é um ponto longe da reta. Alavancagem alta é um ponto com valores extremos nas explicativas, que pode puxar a reta."],[2141,"Regressão linear simples e múltipla","Se a remoção de um único ponto alterar a direção da relação estimada, como comunicaria a fragilidade da conclusão?","emd",3,"Diga com franqueza que a conclusão depende desse ponto, mostre as duas análises e discuta se o ponto é válido."],[2142,"Regressão linear simples e múltipla","Como interpretaria um padrão em forma de funil no gráfico de resíduos versus valores ajustados?","temd",2,"O funil indica variância que aumenta com o valor ajustado. Considere transformação, um modelo com outra distribuição ou erros robustos."],[2143,"Regressão linear simples e múltipla","Se os resíduos apresentarem curvatura sistemática, que hipóteses sobre a especificação do modelo você investigaria?","emd",2,"A curvatura indica relação não linear ou falta de uma variável. Teste termos quadráticos, splines ou outras variáveis."],[2144,"Regressão linear simples e múltipla","Em que circunstâncias erros-padrão robustos seriam úteis e quais problemas eles não corrigem?","md",3,"Erros robustos corrigem a inferência para variância desigual. Eles não corrigem viés por modelo mal especificado nem dependência entre observações."],[2145,"Regressão linear simples e múltipla","Como a multicolinearidade afeta a precisão dos coeficientes e a interpretação individual das variáveis explicativas?","emd",2,"A multicolinearidade aumenta os erros-padrão e torna os coeficientes instáveis. O modelo pode prever bem, mas fica difícil separar o efeito de cada variável."],[2146,"Regressão linear simples e múltipla","Se duas variáveis explicativas forem fortemente correlacionadas, que critérios utilizaria para decidir se mantém ambas no modelo?","emd",3,"Decida pela pergunta: se as duas medem a mesma coisa, use uma ou combine em um índice. Mostre o fator de inflação da variância."],[2147,"Regressão linear simples e múltipla","Como interpretaria uma interação entre uma variável categórica e uma variável contínua em uma regressão?","emd",3,"A interação mostra que a inclinação da variável contínua muda entre categorias. Interprete uma inclinação para cada categoria."],[2148,"Regressão linear simples e múltipla","Por que a inclusão de uma interação pode modificar a interpretação dos efeitos principais do modelo?","emd",3,"Com interação, o efeito principal passa a ser o efeito quando a outra variável vale zero ou está na referência."],[2149,"Regressão linear simples e múltipla","Como a centralização de uma variável explicativa pode facilitar a interpretação de modelos com interações?","md",3,"Centralizar faz o zero corresponder à média. O efeito principal passa a ser o efeito na média da outra variável, o que é mais interpretável."],[2150,"Regressão linear simples e múltipla","Qual a diferença entre um intervalo de confiança para a resposta média e um intervalo de predição para uma nova observação?","emd",2,"O intervalo da média é mais estreito e mostra a incerteza da média prevista. O de predição inclui a variação de uma nova observação individual."],[2151,"Regressão linear simples e múltipla","Se você extrapolar a regressão para além dos valores observados, quais pressupostos adicionais estarão sendo assumidos?","temd",2,"Você assume que a relação continua igual fora da faixa observada, o que não foi testado. Evite extrapolar ou avise sobre o risco."],[2152,"Regressão linear simples e múltipla","Como um erro de medição na variável explicativa pode afetar a estimativa do coeficiente angular?","md",3,"O erro na explicativa tende a atenuar o coeficiente em direção a zero. Considere modelos de erro nas variáveis se o erro for grande."],[2153,"Regressão linear simples e múltipla","Por que ajustar uma regressão aos valores médios de cada grupo pode produzir conclusões diferentes das obtidas com dados individuais?","emd",3,"As médias escondem a variação dentro dos grupos e podem inverter a relação. É a falácia ecológica. Use os dados individuais quando possível."],[2154,"Regressão linear simples e múltipla","Como investigaria se uma associação observada decorre de causalidade reversa?","md",3,"Considere se a resposta pode causar a explicativa. Use dados temporais, variáveis defasadas ou o desenho para dar a direção."],[2155,"Regressão linear simples e múltipla","Quando a inclusão de uma variável de controle pode introduzir viés em vez de eliminá-lo?","md",3,"Controlar um mediador remove parte do efeito que você quer medir. Controlar um colisor cria associação falsa. Use um diagrama causal."],[2156,"Regressão linear simples e múltipla","Como interpretaria o coeficiente de uma variável categórica com três níveis em um modelo que utiliza uma categoria de referência?","temd",2,"Cada coeficiente é a diferença média entre aquele nível e a categoria de referência. Diga qual é a referência."],[2157,"Regressão linear simples e múltipla","Se a resposta for transformada em logaritmo, como interpretaria os coeficientes e obteria previsões na escala original?","emd",3,"Com resposta em logaritmo, o coeficiente indica mudança percentual aproximada. Para voltar à escala original, a média exige correção, e não só aplicar a exponencial."],[2158,"Regressão linear simples e múltipla","Como avaliaria a estabilidade dos coeficientes de regressão diante de diferentes subconjuntos dos dados?","md",3,"Reajuste o modelo em subamostras, por bootstrap ou validação cruzada, e mostre se os coeficientes se mantêm."],[2159,"Regressão linear simples e múltipla","Que consequências teria impor um intercepto igual a zero sem justificativa teórica ou experimental?","md",3,"Forçar o intercepto a zero distorce a inclinação e o R² se a relação real não passa pela origem. Justifique por teoria ou mostre o teste."],[2160,"Regressão linear simples e múltipla","Se a regressão for utilizada para previsão e não para inferência causal, como isso modificaria seus critérios de avaliação do modelo?","md",3,"Para previsão importam o erro em dados novos e a validação. Para inferência causal importam o desenho, o confundimento e a interpretação dos coeficientes."],[2161,"Estatística descritiva e gráficos","Se a média e a mediana dos seus dados forem muito diferentes, o que isso sugere e como escolheria a medida que apresentaria?","te",1,"Média e mediana diferentes indicam assimetria ou valores extremos. Nesse caso a mediana com o intervalo interquartil descreve melhor o centro."],[2162,"Estatística descritiva e gráficos","Como você explicaria a diferença entre variabilidade das observações e incerteza na estimativa da média?","temd",2,"O desvio-padrão descreve a dispersão das observações. O erro-padrão descreve a incerteza da média estimada e diminui com a amostra."],[2163,"Estatística descritiva e gráficos","Se dois grupos tiverem a mesma média, mas desvios-padrão muito diferentes, que aspectos importantes do fenômeno seriam ocultados pela média?","te",1,"A média esconde a dispersão. Grupos com a mesma média podem ter comportamentos muito diferentes. Mostre medidas de dispersão e a distribuição."],[2164,"Estatística descritiva e gráficos","Em que situação o coeficiente de variação seria inadequado para comparar a variabilidade de duas variáveis?","temd",2,"O coeficiente de variação é inadequado quando a média é perto de zero ou a escala não tem zero absoluto, como temperatura em Celsius."],[2165,"Estatística descritiva e gráficos","Como escolheria entre amplitude, intervalo interquartil e desvio-padrão para descrever dados assimétricos?","te",1,"Em dados assimétricos, prefira o intervalo interquartil. A amplitude é sensível a extremos, e o desvio-padrão supõe simetria."],[2166,"Estatística descritiva e gráficos","Se seus dados apresentarem uma distribuição bimodal, por que uma única medida de tendência central poderia ser enganosa?","te",2,"Dois picos indicam provavelmente dois grupos misturados. A média pode cair entre eles, onde quase não há dados. Investigue os grupos."],[2167,"Estatística descritiva e gráficos","Como avaliaria se os limites de classes de um histograma estão ocultando características relevantes da distribuição?","temd",2,"Teste diferentes larguras de classe ou use gráfico de densidade. Classes mal escolhidas escondem picos ou criam falsos."],[2168,"Estatística descritiva e gráficos","Qual informação um boxplot fornece que não pode ser obtida diretamente de um gráfico de barras com médias?","te",1,"O boxplot mostra mediana, quartis, dispersão e valores extremos. A barra mostra só a média e esconde a distribuição."],[2169,"Estatística descritiva e gráficos","Por que pontos situados além dos limites convencionais de um boxplot não devem ser automaticamente considerados erros?","te",1,"Esses pontos podem ser valores reais e informativos. Investigue a origem antes de excluir, e só exclua erros comprovados."],[2170,"Estatística descritiva e gráficos","Se as barras de erro de dois grupos se sobrepõem, por que isso não basta para concluir que não existe diferença estatística?","temd",2,"Barras sobrepostas podem existir com diferença significativa, sobretudo quando representam desvio-padrão. Faça o teste adequado ou mostre o intervalo da diferença."],[2171,"Estatística descritiva e gráficos","Como você decidiria se as barras de erro deveriam representar desvio-padrão, erro-padrão ou intervalo de confiança?","temd",2,"Desvio-padrão para descrever a variação, erro-padrão para a precisão da média e intervalo de confiança para inferência. Diga sempre qual usou."],[2172,"Estatística descritiva e gráficos","Como apresentaria graficamente dados individuais de uma amostra pequena sem ocultar a distribuição das observações?","te",2,"Mostre os pontos individuais, como em gráficos de pontos ou dispersão com resumo. Com amostras pequenas, cada ponto importa."],[2173,"Estatística descritiva e gráficos","Quando um gráfico de violino pode sugerir características artificiais em razão do tamanho reduzido da amostra?","emd",2,"Com poucos dados, a estimativa de densidade do violino pode criar formas que não existem. Mostre os pontos junto."],[2174,"Estatística descritiva e gráficos","Se dois grupos tiverem tamanhos amostrais diferentes, como compararia suas distribuições graficamente sem confundir frequência absoluta e relativa?","temd",2,"Use frequências relativas ou densidades para comparar grupos de tamanhos diferentes, e informe o tamanho de cada um."],[2175,"Estatística descritiva e gráficos","Como você avaliaria se a escala logarítmica melhora a comunicação dos resultados sem induzir interpretações equivocadas?","temd",2,"A escala logarítmica ajuda com dados de várias ordens de grandeza, mas avise o leitor, porque diferenças iguais no gráfico são razões."],[2176,"Estatística descritiva e gráficos","Por que a escolha dos limites dos eixos pode modificar a percepção visual de uma diferença entre grupos?","te",1,"Eixos que não começam em zero ou muito estreitos exageram diferenças. Escolha limites que representem a magnitude real."],[2177,"Estatística descritiva e gráficos","Como apresentaria percentuais de categorias quando os denominadores diferem entre os grupos analisados?","te",2,"Mostre os percentuais junto com os denominadores. Percentuais de bases diferentes enganam se o leitor não souber o tamanho de cada grupo."],[2178,"Estatística descritiva e gráficos","Se uma média global contradiz o padrão observado nos subgrupos, que fenômeno estatístico investigaria?","emd",3,"É o paradoxo de Simpson: a tendência dos subgrupos se inverte no agregado por causa de uma variável de confusão. Analise por subgrupo."],[2179,"Estatística descritiva e gráficos","Em que condições uma média ponderada seria mais adequada do que uma média aritmética simples?","te",2,"Use média ponderada quando as unidades têm importâncias ou tamanhos diferentes, como médias de grupos com números diferentes de indivíduos."],[2180,"Estatística descritiva e gráficos","Se houver valores abaixo do limite de detecção, quais limitações surgem ao calcular médias e desvios-padrão convencionais?","md",3,"Substituir por zero ou metade do limite distorce média e desvio. Considere métodos para dados censurados ou estatísticas robustas."],[2181,"Estatística descritiva e gráficos","Como distinguiria um zero real de um valor ausente durante a descrição dos dados?","te",1,"Zero real é uma medida que deu zero. Ausente é não ter a medida. Confundir os dois distorce os resultados."],[2182,"Estatística descritiva e gráficos","Por que apresentar somente valores mínimos e máximos pode ser insuficiente para caracterizar a distribuição?","te",1,"Mínimo e máximo mostram só os extremos. Mostre também centro e dispersão, como mediana e quartis."],[2183,"Estatística descritiva e gráficos","Como você escolheria uma representação visual para demonstrar simultaneamente associação, dispersão e possíveis observações influentes?","temd",2,"Um gráfico de dispersão com reta ou curva ajustada mostra associação, dispersão e pontos influentes ao mesmo tempo."],[2184,"Estatística descritiva e gráficos","Se os dados forem proporções, como evitaria distorções ao calcular médias de proporções com denominadores diferentes?","emd",2,"Calcule a proporção total pela soma dos sucessos sobre a soma das tentativas, ou pondere pelos denominadores. A média simples das proporções distorce."],[2185,"Estatística descritiva e gráficos","Como garantiria que as tabelas descritivas informassem claramente o número de observações válidas de cada variável?","te",1,"Informe o n de cada variável na tabela. Dados ausentes mudam o n e precisam ficar visíveis."],[2186,"Teste t de Student e Welch","Como justificaria a escolha de um teste t para comparar dois grupos considerando o delineamento e a natureza da resposta?","te",2,"O teste t compara médias de dois grupos com resposta contínua. Diga se os grupos são independentes ou pareados."],[2187,"Teste t de Student e Welch","Se os grupos forem constituídos pelas mesmas unidades antes e depois de uma intervenção, por que não utilizar um teste t independente?","te",1,"As mesmas unidades geram medidas correlacionadas. O teste pareado analisa as diferenças dentro de cada unidade e é mais preciso."],[2188,"Teste t de Student e Welch","No teste t pareado, por que a distribuição das diferenças é mais importante que a normalidade de cada conjunto de observações isoladamente?","temd",2,"O teste pareado analisa as diferenças entre os pares. Por isso é a distribuição das diferenças que precisa ser aproximadamente normal."],[2189,"Teste t de Student e Welch","Qual é a diferença entre o teste t clássico com variância combinada e o teste t de Welch?","temd",2,"O teste clássico supõe variâncias iguais. O de Welch não supõe e ajusta os graus de liberdade."],[2190,"Teste t de Student e Welch","Se os tamanhos amostrais e as variâncias forem desiguais, por que o teste de Welch pode ser preferível?","temd",2,"Com variâncias e tamanhos desiguais, o teste clássico erra o valor de p. O de Welch se mantém correto e perde pouco quando as variâncias são iguais."],[2191,"Teste t de Student e Welch","Como você avaliaria a robustez de um teste t diante de assimetria acentuada em amostras pequenas?","emd",3,"Com amostras pequenas e assimetria forte, o teste t pode errar. Use bootstrap, transformação ou teste não paramétrico, e compare."],[2192,"Teste t de Student e Welch","Se a diferença média for estatisticamente significativa, como demonstraria se ela é relevante na prática?","temd",2,"Compare a diferença com o que importa na prática na sua área e mostre o intervalo de confiança da diferença."],[2193,"Teste t de Student e Welch","Como interpretaria um intervalo de confiança para a diferença média que inclui o zero?","te",2,"Se o intervalo inclui zero, a diferença pode ser nula. Mas valores relevantes podem estar no intervalo, então o resultado é inconclusivo."],[2194,"Teste t de Student e Welch","Se o resultado do teste t não for significativo, que evidências adicionais seriam necessárias para sustentar equivalência entre grupos?","md",3,"Para afirmar equivalência, defina uma margem de relevância e use um teste de equivalência, como o TOST."],[2195,"Teste t de Student e Welch","Qual a diferença entre um teste unilateral e bilateral e por que essa escolha deve preceder a inspeção dos resultados?","temd",2,"O unilateral testa uma direção, e o bilateral as duas. A escolha deve vir da hipótese, antes de ver os dados."],[2196,"Teste t de Student e Welch","Se o efeito observado ocorrer na direção oposta à hipótese unilateral, como você interpretaria esse resultado?","emd",3,"Num teste unilateral, efeito na direção oposta não pode ser declarado significativo. Relate como inesperado e discuta."],[2197,"Teste t de Student e Welch","Como o número de graus de liberdade influencia a distribuição utilizada pelo teste t?","temd",2,"Com menos graus de liberdade, a distribuição t tem caudas mais grossas e exige diferença maior para significância."],[2198,"Teste t de Student e Welch","O que a estatística t representa em termos de diferença estimada e erro-padrão dessa diferença?","te",2,"t é a diferença estimada dividida pelo seu erro-padrão. Mostra quantos erros-padrão a diferença está de zero."],[2199,"Teste t de Student e Welch","Se houver uma observação extrema em uma das amostras, como avaliaria sua influência sem excluí-la arbitrariamente?","temd",2,"Faça a análise com e sem a observação e use métodos robustos. Só exclua se houver erro comprovado."],[2200,"Teste t de Student e Welch","Como compararia os resultados de um teste t com os de uma regressão linear que utiliza um indicador de grupo?","emd",2,"O teste t equivale a uma regressão com uma variável indicadora de grupo. O coeficiente é a diferença de médias, e o p é o mesmo."],[2201,"Teste t de Student e Welch","Se existirem diversas medições por indivíduo, por que tratá-las como réplicas independentes pode produzir um teste t enganoso?","temd",3,"Medidas do mesmo indivíduo não são independentes. Use a média por indivíduo ou um modelo misto."],[2202,"Teste t de Student e Welch","Como a correlação entre medições pareadas pode influenciar a precisão da estimativa da diferença média?","emd",3,"Quanto maior a correlação entre as medidas pareadas, menor a variância das diferenças e maior a precisão."],[2203,"Teste t de Student e Welch","Se alguns pares estiverem incompletos, que limitações surgem ao realizar a análise somente com pares completos?","emd",3,"Usar só pares completos perde dados e pode viesar se a falta não for aleatória. Considere modelos mistos que usam todas as observações."],[2204,"Teste t de Student e Welch","Em que situação um teste t de uma amostra seria adequado e como justificaria o valor de referência utilizado?","te",2,"O teste t de uma amostra compara a média com um valor fixo. Justifique esse valor por norma, literatura ou valor teórico."],[2205,"Teste t de Student e Welch","Como você interpretaria um teste t significativo obtido com uma amostra muito grande e diferença média muito pequena?","temd",2,"Com amostra muito grande, diferenças minúsculas ficam significativas. Diga se a diferença importa na prática."],[2206,"Teste t de Student e Welch","Se a amostra apresentar distribuição assimétrica, que critérios utilizaria para escolher entre teste t, transformação e métodos de reamostragem?","emd",3,"Decida pelo tamanho da amostra, pela intensidade da assimetria e pela pergunta. Compare os resultados dos métodos."],[2207,"Teste t de Student e Welch","Como apresentaria a diferença entre grupos em unidades originais e por meio de uma medida padronizada de tamanho de efeito?","temd",2,"Mostre a diferença nas unidades originais, que é fácil de entender, e um tamanho de efeito padronizado, como o d de Cohen, para comparar com outros estudos."],[2208,"Teste t de Student e Welch","Se você aplicar vários testes t sobre diferentes desfechos, como avaliaria o problema de multiplicidade?","emd",2,"Vários desfechos aumentam a chance de falso positivo. Corrija para múltiplos testes ou defina um desfecho principal."],[2209,"Teste t de Student e Welch","Por que selecionar o tipo de teste t apenas com base em um teste preliminar de igualdade de variâncias pode ser problemático?","md",3,"Escolher o teste com base em outro teste muda a taxa de erro. Prefira usar Welch diretamente."],[2210,"Teste t de Student e Welch","Como explicaria a diferença entre testar uma diferença média e testar se um efeito é menor que uma margem de relevância previamente definida?","md",3,"O teste de diferença pergunta se há diferença. O teste de não inferioridade ou equivalência pergunta se o efeito fica dentro de uma margem."],[2211,"Correlação de Pearson e Spearman","Considerando a forma da relação observada, como justificaria a escolha entre os coeficientes de Pearson e Spearman?","temd",2,"Pearson mede relação linear entre variáveis contínuas. Spearman mede relação monotônica e é menos sensível a outliers."],[2212,"Correlação de Pearson e Spearman","Se Pearson for próximo de zero, por que isso não exclui a existência de uma relação não linear forte?","temd",2,"Pearson só capta relação linear. Uma curva em U pode dar Pearson perto de zero. Faça o gráfico."],[2213,"Correlação de Pearson e Spearman","Como interpretaria um coeficiente de Spearman elevado quando a relação entre as variáveis é monotônica, mas não linear?","temd",2,"Spearman alto indica que uma variável sobe ou desce junto com a outra, mesmo sem ser em linha reta."],[2214,"Correlação de Pearson e Spearman","Por que uma correlação estatisticamente significativa não constitui evidência suficiente de causalidade?","te",1,"Correlação mostra associação. Ela pode vir de causa comum, de direção inversa ou de acaso."],[2215,"Correlação de Pearson e Spearman","Como o tamanho amostral influencia a significância e a precisão de um coeficiente de correlação?","temd",2,"Com amostras grandes, correlações fracas ficam significativas. O intervalo de confiança fica mais estreito."],[2216,"Correlação de Pearson e Spearman","Se Pearson e Spearman produzirem resultados muito diferentes, quais características dos dados investigaria?","emd",2,"Diferenças entre os dois indicam outliers, relação não linear ou muitos empates. Olhe o gráfico."],[2217,"Correlação de Pearson e Spearman","Como avaliaria se a correlação observada é determinada principalmente por um único valor extremo?","temd",2,"Refaça sem o ponto extremo e compare. Mostre o gráfico de dispersão."],[2218,"Correlação de Pearson e Spearman","Se a correlação global for positiva e as correlações dentro dos grupos forem negativas, como explicaria esse padrão?","emd",3,"É o paradoxo de Simpson. Uma diferença entre grupos cria a tendência global. Analise dentro dos grupos."],[2219,"Correlação de Pearson e Spearman","Em que situação uma correlação parcial poderia ser útil e por que ela não elimina necessariamente todo o confundimento?","md",3,"A correlação parcial remove o efeito de uma terceira variável. Mas não elimina confundimento por variáveis não medidas."],[2220,"Correlação de Pearson e Spearman","Como a restrição da amplitude de uma variável pode afetar a magnitude da correlação observada?","emd",3,"Amplitude restrita reduz a correlação observada. A relação pode ser mais forte na população completa."],[2221,"Correlação de Pearson e Spearman","Se ambas as variáveis apresentarem tendências crescentes ao longo do tempo, como investigaria uma possível correlação espúria?","emd",3,"Duas variáveis que crescem com o tempo parecem correlacionadas. Remova a tendência ou analise as diferenças entre períodos."],[2222,"Correlação de Pearson e Spearman","Como a dependência espacial entre observações pode comprometer o teste de significância de uma correlação?","md",3,"Observações próximas no espaço são parecidas, o que reduz o tamanho efetivo da amostra e torna o p otimista."],[2223,"Correlação de Pearson e Spearman","Por que calcular uma correlação entre uma variável e outra que contém matematicamente a primeira pode ser enganoso?","md",3,"Se uma variável contém a outra, como uma razão e o seu denominador, a correlação aparece por construção matemática."],[2224,"Correlação de Pearson e Spearman","Como analisaria a correlação entre duas variáveis que apresentam muitos empates nos postos?","emd",2,"Muitos empates afetam Spearman. Use a versão corrigida para empates ou o tau de Kendall."],[2225,"Correlação de Pearson e Spearman","Em que circunstâncias o coeficiente tau de Kendall seria uma alternativa pertinente ao coeficiente de Spearman?","emd",2,"O tau de Kendall é mais adequado com amostras pequenas ou muitos empates, e tem interpretação de concordância entre pares."],[2226,"Correlação de Pearson e Spearman","Se as variáveis tiverem erros de medição importantes, como isso pode alterar a correlação estimada?","md",3,"Erros de medição atenuam a correlação. A relação verdadeira pode ser mais forte que a observada."],[2227,"Correlação de Pearson e Spearman","Como você compararia formalmente duas correlações obtidas em grupos independentes?","md",3,"Use a transformação z de Fisher para comparar correlações de grupos independentes."],[2228,"Correlação de Pearson e Spearman","Por que a comparação de correlações que compartilham uma variável exige considerar sua dependência?","md",3,"Correlações que compartilham uma variável não são independentes. Use testes específicos para correlações dependentes."],[2229,"Correlação de Pearson e Spearman","Como interpretaria uma correlação forte com intervalo de confiança amplo?","temd",2,"Intervalo amplo indica pouca precisão. A correlação verdadeira pode ser bem mais fraca. Relate o intervalo."],[2230,"Correlação de Pearson e Spearman","Se a matriz de correlações incluir dezenas de variáveis, como evitaria destacar associações fortuitas?","emd",3,"Com muitas correlações, algumas serão significativas por acaso. Corrija para múltiplos testes e não destaque só as maiores."],[2231,"Correlação de Pearson e Spearman","Por que uma matriz calculada com exclusão de ausentes par a par pode apresentar problemas para análises posteriores?","md",3,"Com exclusão par a par, cada correlação usa casos diferentes, e a matriz pode ficar inconsistente para análises multivariadas."],[2232,"Correlação de Pearson e Spearman","Como distinguiria correlação entre medidas repetidas dentro de indivíduos de correlação entre médias individuais?","md",3,"A correlação dentro dos indivíduos pode diferir da correlação entre as médias deles. Use métodos de correlação para medidas repetidas."],[2233,"Correlação de Pearson e Spearman","Se a variabilidade da relação mudar ao longo da amplitude de uma variável, por que um único coeficiente pode ser insuficiente?","md",3,"Se a dispersão muda ao longo da variável, um único coeficiente resume mal. Mostre o gráfico ou modele a variância."],[2234,"Correlação de Pearson e Spearman","Em que circunstâncias a regressão seria mais informativa que a correlação para responder à pergunta científica?","temd",2,"A regressão diz quanto uma variável muda com a outra e permite prever. A correlação só mede a força da associação."],[2235,"Correlação de Pearson e Spearman","Como demonstraria graficamente que uma correlação elevada não implica concordância entre dois métodos de medição?","emd",3,"Use o gráfico de Bland-Altman. Dois métodos podem ser muito correlacionados e mesmo assim ter diferenças sistemáticas."],[2236,"Comparações não paramétricas","Se os dados não forem normais, por que isso não torna automaticamente obrigatório utilizar um teste não paramétrico?","temd",2,"O que importa é a distribuição dos resíduos e o tamanho da amostra, e não a normalidade dos dados brutos. Testes t e ANOVA são robustos com amostras moderadas."],[2237,"Comparações não paramétricas","Como explicaria o que o teste de Mann-Whitney avalia e sob quais condições ele pode ser interpretado como diferença de localização?","temd",2,"O Mann-Whitney testa se valores de um grupo tendem a ser maiores que do outro. Só vira teste de localização se as distribuições tiverem a mesma forma."],[2238,"Comparações não paramétricas","Por que o Mann-Whitney não deve ser descrito indiscriminadamente como um teste de igualdade de medianas?","emd",3,"O Mann-Whitney só testa medianas quando as distribuições têm a mesma forma. Sem isso, ele testa a tendência de um grupo superar o outro."],[2239,"Comparações não paramétricas","Se dois grupos tiverem medianas iguais e dispersões muito diferentes, como interpretaria uma eventual significância no Mann-Whitney?","md",3,"O teste pode dar significativo por diferença de forma ou dispersão, e não de mediana. Interprete com cuidado."],[2240,"Comparações não paramétricas","Como justificaria a utilização do teste de Wilcoxon de postos sinalizados para dados pareados?","te",2,"O Wilcoxon pareado usa as diferenças dentro dos pares e não exige normalidade."],[2241,"Comparações não paramétricas","Que pressuposto sobre a distribuição das diferenças é relevante para a interpretação usual do Wilcoxon pareado?","emd",3,"A interpretação usual como teste de mediana supõe que as diferenças tenham distribuição simétrica."],[2242,"Comparações não paramétricas","Em que situação o teste dos sinais seria uma alternativa ao Wilcoxon pareado?","temd",2,"O teste dos sinais só usa a direção das diferenças e não supõe simetria. É útil quando a simetria não se sustenta."],[2243,"Comparações não paramétricas","Como interpretaria um resultado significativo do Kruskal-Wallis sem assumir que todos os grupos diferem entre si?","temd",2,"O Kruskal-Wallis indica que ao menos um grupo difere. Faça comparações posteriores, como o teste de Dunn, para saber quais."],[2244,"Comparações não paramétricas","Após um Kruskal-Wallis significativo, como escolheria comparações posteriores e controlaria a multiplicidade?","emd",2,"Use o teste de Dunn com correção de Holm ou Bonferroni, e planeje as comparações de interesse."],[2245,"Comparações não paramétricas","Por que o teste de Friedman seria mais apropriado que Kruskal-Wallis para medidas repetidas em blocos completos?","temd",2,"O Friedman considera que as medidas vêm dos mesmos blocos ou indivíduos. O Kruskal-Wallis supõe grupos independentes."],[2246,"Comparações não paramétricas","Como a presença de muitos valores empatados pode afetar testes baseados em postos?","emd",3,"Muitos empates reduzem a informação dos postos. Use correção para empates ou métodos exatos."],[2247,"Comparações não paramétricas","Em amostras muito pequenas, quais diferenças existem entre calcular valores de p exatos e utilizar aproximações assintóticas?","emd",3,"Com amostras pequenas, o p exato é mais confiável. As aproximações assintóticas supõem amostras maiores."],[2248,"Comparações não paramétricas","Como escolheria uma medida de tamanho de efeito compatível com comparações não paramétricas?","emd",3,"Use medidas como r de postos, delta de Cliff ou probabilidade de superioridade."],[2249,"Comparações não paramétricas","Se a pesquisa pretende comparar médias especificamente, por que substituir um teste t por Mann-Whitney pode mudar a pergunta científica?","md",3,"O Mann-Whitney não compara médias. Se a pergunta é sobre médias, outra abordagem, como bootstrap ou modelo adequado, responde melhor."],[2250,"Comparações não paramétricas","Em que condições a permutação dos rótulos dos grupos é válida para testar uma diferença?","md",3,"A permutação é válida quando, sob a hipótese nula, os rótulos são trocáveis, ou seja, as observações são independentes e as distribuições iguais."],[2251,"Comparações não paramétricas","Como modificaria um teste de permutação se as observações estivessem organizadas em pares ou blocos?","md",3,"Permute dentro dos pares ou blocos, trocando os sinais das diferenças ou os rótulos dentro de cada bloco."],[2252,"Comparações não paramétricas","Por que métodos não paramétricos também possuem pressupostos e não são automaticamente robustos a qualquer estrutura de dados?","emd",3,"Testes não paramétricos também supõem independência e, às vezes, formas iguais. Eles não resolvem dependência nem desenhos complexos."],[2253,"Comparações não paramétricas","Como compararia uma abordagem baseada em postos com um modelo que representa diretamente a distribuição assimétrica da resposta?","md",3,"Modelar a distribuição, como com um GLM Gamma, estima efeitos na escala real. Os postos só testam ordem."],[2254,"Comparações não paramétricas","Se os resultados paramétricos e não paramétricos discordarem, como investigaria a origem da divergência sem escolher apenas o resultado significativo?","md",3,"Verifique outliers, assimetria e o que cada teste avalia. Relate os dois resultados e explique a diferença."],[2255,"Comparações não paramétricas","Como apresentaria graficamente uma comparação não paramétrica para permitir que o leitor avalie diferenças de localização, forma e dispersão?","temd",2,"Use boxplots com pontos individuais ou gráficos de violino, que mostram centro, forma e dispersão."],[2256,"GLM: Modelos lineares generalizados","Se sua variável resposta for uma contagem, por que um GLM pode ser mais adequado do que uma regressão normal convencional?","emd",2,"Contagens são inteiros não negativos, e a variância cresce com a média. Um GLM com Poisson ou binomial negativa respeita isso. A regressão normal pode prever valores negativos."],[2257,"GLM: Modelos lineares generalizados","Como a distribuição da resposta e a função de ligação desempenham papéis distintos em um GLM?","emd",3,"A distribuição descreve a variação da resposta, como Poisson ou binomial. A ligação conecta a média ao preditor linear, como log ou logito."],[2258,"GLM: Modelos lineares generalizados","Se o modelo utilizar ligação log, como converteria um coeficiente em uma interpretação multiplicativa na escala da resposta?","emd",3,"Com ligação log, a exponencial do coeficiente é um fator multiplicativo. Um valor de 1,2 indica 20% a mais na resposta por unidade da explicativa."],[2259,"GLM: Modelos lineares generalizados","Em uma regressão logística, por que uma razão de chances não deve ser interpretada diretamente como risco relativo?","emd",3,"A razão de chances compara chances, e não probabilidades. Quando o evento é comum, ela exagera o risco relativo."],[2260,"GLM: Modelos lineares generalizados","Como interpretaria uma mudança na probabilidade prevista quando o coeficiente logístico é constante na escala do logito?","md",3,"O efeito é constante no logito, mas a mudança na probabilidade depende do ponto da curva. Mostre probabilidades previstas em valores de interesse."],[2261,"GLM: Modelos lineares generalizados","Se a variância condicional das contagens exceder a prevista por Poisson, como diagnosticaria e trataria a superdispersão?","emd",3,"Compare a variância residual com a média ou use a razão entre desvio residual e graus de liberdade. Trate com binomial negativa ou quase-Poisson."],[2262,"GLM: Modelos lineares generalizados","Como diferenciaria um modelo quase-Poisson de um modelo binomial negativo em termos de variância e comparação por verossimilhança?","md",3,"O quase-Poisson multiplica a variância por um fator constante e não tem verossimilhança, então não permite AIC. A binomial negativa tem variância quadrática na média e permite AIC."],[2263,"GLM: Modelos lineares generalizados","Se as unidades tiverem diferentes tempos ou áreas de exposição, como utilizaria um offset em um modelo de contagem?","emd",3,"Use o logaritmo do tempo ou da área como offset. O modelo passa a estimar taxas por unidade de esforço."],[2264,"GLM: Modelos lineares generalizados","Por que incluir a exposição como offset é diferente de estimar livremente seu coeficiente como covariável?","md",3,"O offset fixa o coeficiente em 1, supondo proporcionalidade ao esforço. Como covariável, o coeficiente é estimado livremente."],[2265,"GLM: Modelos lineares generalizados","Como avaliaria se o excesso de zeros decorre de heterogeneidade não modelada ou de um processo adicional gerador de zeros?","md",3,"Compare um modelo binomial negativo com um inflacionado de zeros. Veja se os zeros previstos batem com os observados."],[2266,"GLM: Modelos lineares generalizados","Qual a diferença conceitual entre um modelo hurdle e um modelo inflacionado de zeros?","md",3,"O hurdle separa zero e não zero, e todos os zeros vêm de um processo. O inflacionado de zeros admite zeros estruturais e também zeros da própria contagem."],[2267,"GLM: Modelos lineares generalizados","Se a resposta for uma proporção obtida de sucessos e tentativas, como especificaria corretamente um GLM binomial?","emd",3,"Use a resposta como sucessos e fracassos, informando o número de tentativas, para que cada proporção tenha o peso correto."],[2268,"GLM: Modelos lineares generalizados","Se a resposta for uma proporção contínua sem denominador de tentativas, por que consideraria regressão beta em vez de binomial?","md",3,"Proporções contínuas, como cobertura percentual, não têm número de tentativas. A distribuição beta modela valores entre 0 e 1."],[2269,"GLM: Modelos lineares generalizados","Como trataria valores exatamente iguais a zero ou um em uma resposta candidata à regressão beta?","md",3,"A beta não aceita 0 nem 1. Use uma transformação de compressão ou modelos beta inflacionados de zeros e uns."],[2270,"GLM: Modelos lineares generalizados","Se os dados forem contínuos, positivos e assimétricos, como compararia modelos Gamma e lognormal?","md",3,"Compare a relação média e variância de cada um, os resíduos e o AIC. A Gamma modela a média diretamente. A lognormal modela a média do logaritmo."],[2271,"GLM: Modelos lineares generalizados","Como avaliaria a adequação de um GLM utilizando resíduos apropriados à distribuição, em vez de exigir normalidade dos resíduos brutos?","md",3,"Use resíduos de deviance, de Pearson ou simulados, como os do DHARMa. Eles avaliam o ajuste adequado à distribuição escolhida."],[2272,"GLM: Modelos lineares generalizados","Se a regressão logística apresentar separação completa, quais sintomas surgiriam e que alternativas consideraria?","md",3,"Os coeficientes e erros-padrão ficam enormes. Use regressão logística penalizada, como a de Firth, ou um enfoque bayesiano."],[2273,"GLM: Modelos lineares generalizados","Como compararia modelos logísticos quanto à discriminação e à calibração das probabilidades previstas?","md",3,"Discriminação é separar quem tem o evento de quem não tem, medida pela AUC. Calibração é acertar as probabilidades, vista em curvas de calibração."],[2274,"GLM: Modelos lineares generalizados","Por que a interpretação de interações em GLMs exige atenção à diferença entre a escala da ligação e a escala da resposta?","md",3,"A interação na escala do logito ou do log não corresponde à interação na escala da probabilidade ou da contagem. Diga em qual escala você interpreta."],[2275,"GLM: Modelos lineares generalizados","Como comunicaria previsões e intervalos de incerteza de um GLM na escala que é cientificamente relevante para o leitor?","emd",2,"Volte à escala da resposta, como probabilidade ou contagem, com intervalos calculados na escala da ligação e depois transformados."],[2276,"GLMM e modelos mistos","Se várias observações foram obtidas de cada indivíduo, local ou instituição, como justificaria incorporar efeitos aleatórios ao modelo?","emd",2,"Observações do mesmo grupo são parecidas. O efeito aleatório modela essa dependência e evita erros-padrão subestimados."],[2277,"GLMM e modelos mistos","Como diferenciaria um fator fixo de um fator aleatório considerando o objetivo inferencial e a estrutura de amostragem?","emd",3,"O fator fixo tem níveis de interesse em si. O aleatório tem níveis que representam uma população maior, sobre a qual você quer generalizar."],[2278,"GLMM e modelos mistos","Qual a diferença entre interceptos aleatórios e inclinações aleatórias e quando cada estrutura seria relevante?","md",3,"O intercepto aleatório permite que cada grupo tenha seu nível médio. A inclinação aleatória permite que o efeito de uma variável mude entre grupos."],[2279,"GLMM e modelos mistos","Se a resposta a um tratamento variar entre indivíduos, por que somente um intercepto aleatório pode ser insuficiente?","md",3,"Se a resposta ao tratamento varia entre indivíduos, só o intercepto aleatório subestima a incerteza do efeito. Inclua inclinação aleatória."],[2280,"GLMM e modelos mistos","Como interpretaria a variância de um intercepto aleatório no contexto do fenômeno estudado?","md",3,"A variância do intercepto mostra quanto os grupos diferem entre si no nível médio. Compare com a variância residual."],[2281,"GLMM e modelos mistos","Como explicaria a correlação intraclasse em um modelo linear de intercepto aleatório?","md",3,"A correlação intraclasse é a proporção da variação total que se deve às diferenças entre grupos."],[2282,"GLMM e modelos mistos","Se a pesquisa tiver unidades agrupadas dentro de locais e locais dentro de regiões, como especificaria a estrutura hierárquica?","md",3,"Use efeitos aleatórios aninhados, por exemplo local dentro de região."],[2283,"GLMM e modelos mistos","Como distinguiria efeitos aleatórios aninhados de efeitos aleatórios cruzados?","md",3,"Aninhado é quando um nível só existe dentro de outro. Cruzado é quando os níveis se combinam, como indivíduos avaliados por vários avaliadores."],[2284,"GLMM e modelos mistos","Se houver poucos níveis de um fator de agrupamento, quais dificuldades surgem na estimação da variância aleatória?","md",3,"Com poucos níveis, menos de cinco ou seis, a variância é mal estimada. Considere tratar o fator como fixo."],[2285,"GLMM e modelos mistos","Como investigaria um ajuste singular ou uma variância aleatória estimada próxima de zero?","md",3,"Ajuste singular indica variância perto de zero ou estrutura complexa demais. Simplifique os efeitos aleatórios."],[2286,"GLMM e modelos mistos","Por que um efeito aleatório de indivíduo não garante que toda autocorrelação temporal tenha sido resolvida?","md",3,"O efeito aleatório trata a correlação geral do indivíduo, mas medidas próximas no tempo podem ser ainda mais parecidas. Modele a autocorrelação temporal."],[2287,"GLMM e modelos mistos","Como escolheria entre um modelo linear misto e um modelo linear generalizado misto?","md",3,"Use o linear misto se a resposta for contínua e aproximadamente normal. Use o generalizado misto para contagens, proporções ou respostas binárias."],[2288,"GLMM e modelos mistos","Se a resposta for binária e repetida no mesmo indivíduo, como especificaria a distribuição e a estrutura de dependência de um GLMM?","md",3,"Use distribuição binomial com ligação logito e efeito aleatório de indivíduo."],[2289,"GLMM e modelos mistos","Como diferenciaria previsões condicionais a grupos conhecidos de previsões para novos grupos?","md",3,"A previsão condicional usa o efeito do grupo conhecido. Para grupos novos, use a previsão populacional, sem o efeito do grupo."],[2290,"GLMM e modelos mistos","Por que integrar sobre os efeitos aleatórios pode alterar previsões de probabilidade em um GLMM logístico?","md",3,"Em modelos não lineares, a probabilidade média da população difere da probabilidade de um grupo típico. Integrar sobre os efeitos aleatórios dá a média populacional."],[2291,"GLMM e modelos mistos","Qual a diferença entre R² marginal e R² condicional e o que cada um comunica sobre o ajuste?","md",3,"O R² marginal mede o que os efeitos fixos explicam. O condicional inclui também os aleatórios."],[2292,"GLMM e modelos mistos","Em modelos lineares mistos, por que comparações de estruturas de efeitos fixos por verossimilhança devem considerar ML em vez de REML?","md",3,"O REML estima melhor as variâncias, mas sua verossimilhança depende dos efeitos fixos. Para comparar efeitos fixos, ajuste por ML."],[2293,"GLMM e modelos mistos","Como avaliaria a convergência e a adequação de um GLMM antes de interpretar seus coeficientes?","md",3,"Verifique avisos de convergência, resíduos, efeitos aleatórios e a estabilidade com diferentes otimizadores."],[2294,"GLMM e modelos mistos","Se os efeitos fixos mudarem substancialmente após incluir um agrupamento, quais explicações investigaria?","md",3,"O agrupamento pode estar ligado às variáveis explicativas, o que é confundimento entre e dentro de grupos. Separe os efeitos entre e dentro."],[2295,"GLMM e modelos mistos","Como estruturaria uma validação cruzada se o objetivo fosse prever respostas em grupos nunca observados?","md",3,"Separe os grupos inteiros entre treino e teste, validação cruzada por grupo, para simular grupos novos."],[2296,"PCA: Componentes principais","Qual pergunta científica justificou utilizar PCA em vez de analisar separadamente as variáveis originais?","emd",2,"A PCA resume variáveis correlacionadas em poucos eixos. Diga que pergunta exigia essa síntese."],[2297,"PCA: Componentes principais","Como a PCA constrói componentes a partir da estrutura de covariância ou correlação dos dados?","emd",3,"A PCA cria eixos que capturam a maior variação possível, combinando as variáveis originais, sem correlação entre os eixos."],[2298,"PCA: Componentes principais","Se as variáveis forem medidas em unidades muito diferentes, por que a escolha de padronizá-las pode alterar os componentes?","emd",3,"Sem padronizar, variáveis com grande variância dominam os eixos. Padronizar dá o mesmo peso a todas."],[2299,"PCA: Componentes principais","Em que situação utilizar a matriz de covariância seria mais defensável que a matriz de correlação?","md",3,"Use a covariância quando as variáveis estão na mesma unidade e a diferença de variância importa."],[2300,"PCA: Componentes principais","Como justificaria a quantidade de componentes retidos sem recorrer exclusivamente a um percentual arbitrário de variância explicada?","emd",3,"Use critérios como o gráfico de declive, a análise paralela ou o modelo de bastão quebrado."],[2301,"PCA: Componentes principais","Se os dois primeiros componentes explicarem uma parcela modesta da variabilidade, quais limitações teria uma interpretação bidimensional?","emd",2,"Se os dois eixos explicam pouco, o gráfico mostra só parte da estrutura. Analise mais componentes."],[2302,"PCA: Componentes principais","Como distinguiria os escores das observações dos pesos ou cargas associados às variáveis?","emd",2,"Os escores são as posições das observações nos eixos. As cargas mostram quanto cada variável contribui para os eixos."],[2303,"PCA: Componentes principais","Em um biplot, quais cuidados teria ao interpretar ângulos e comprimentos das setas considerando a escala adotada?","md",3,"No biplot, ângulos e comprimentos dependem da escala escolhida. Explique a escala usada."],[2304,"PCA: Componentes principais","Por que o sinal dos eixos de uma PCA pode ser invertido sem modificar o significado matemático da solução?","emd",3,"O sinal dos eixos é arbitrário. Inverter não muda a interpretação, desde que você mantenha a coerência."],[2305,"PCA: Componentes principais","Como interpretaria duas variáveis com cargas elevadas e de sinais opostos no mesmo componente?","emd",3,"Cargas de sinais opostos indicam variáveis que variam em sentidos contrários ao longo do eixo."],[2306,"PCA: Componentes principais","Se os grupos parecerem separados na PCA, por que isso não constitui por si só um teste estatístico de diferença entre grupos?","emd",3,"A PCA só descreve. Para testar diferença entre grupos, use PERMANOVA ou outro teste formal."],[2307,"PCA: Componentes principais","Como valores extremos podem influenciar a orientação dos componentes principais?","emd",3,"Valores extremos podem puxar os eixos. Faça a análise com e sem eles ou use PCA robusta."],[2308,"PCA: Componentes principais","Se várias variáveis representarem quase a mesma característica, como sua inclusão redundante poderia afetar a ordenação?","md",3,"Variáveis redundantes pesam mais na ordenação. Considere remover duplicatas ou agrupar."],[2309,"PCA: Componentes principais","Como trataria dados ausentes antes da PCA e avaliaria o impacto dessa decisão na estrutura encontrada?","md",3,"Exclua casos, impute ou use métodos de PCA que lidam com ausentes. Teste se a estrutura muda."],[2310,"PCA: Componentes principais","Em que circunstâncias uma PCA convencional seria inadequada para dados composicionais ou predominantemente categóricos?","md",3,"Dados composicionais pedem transformações de razões logarítmicas. Dados categóricos pedem análise de correspondência."],[2311,"NMDS: Escalonamento multidimensional","Por que você escolheu NMDS em vez de PCA para representar a estrutura de similaridade entre suas observações?","emd",2,"A NMDS aceita qualquer dissimilaridade e não supõe relações lineares, o que é útil para dados de abundância."],[2312,"NMDS: Escalonamento multidimensional","Como justificaria a medida de dissimilaridade utilizada considerando a natureza dos dados e a pergunta científica?","emd",3,"Justifique pelo tipo de dado: Bray-Curtis para abundâncias, Jaccard para presença e ausência, Gower para variáveis mistas."],[2313,"NMDS: Escalonamento multidimensional","O que significa preservar a ordenação das dissimilaridades em vez de preservar exatamente suas magnitudes?","md",3,"A NMDS preserva a ordem das distâncias, ou seja, quais pontos estão mais próximos, e não os valores exatos."],[2314,"NMDS: Escalonamento multidimensional","Como interpretaria o stress de uma NMDS e por que seus limites aceitáveis não são universais?","emd",3,"O stress mede o desajuste entre distâncias originais e do gráfico. Valores menores são melhores, mas os limites são só orientativos."],[2315,"NMDS: Escalonamento multidimensional","Se o stress diminuir ao passar de duas para três dimensões, como decidiria qual solução apresentar?","md",3,"Compare a queda no stress com o ganho de interpretação. Se três dimensões reduzem muito o stress, considere usá-las."],[2316,"NMDS: Escalonamento multidimensional","Por que os eixos de uma NMDS não devem receber percentuais de variância explicada como os eixos de uma PCA?","emd",3,"Os eixos da NMDS não têm variância explicada. A solução é baseada na ordem das distâncias, e não em decomposição de variância."],[2317,"NMDS: Escalonamento multidimensional","Como você avaliaria se diferentes configurações iniciais convergem para soluções semelhantes?","md",3,"Rode várias vezes com inícios diferentes e veja se as soluções convergem, por exemplo com análise de Procrustes."],[2318,"NMDS: Escalonamento multidimensional","Se duas observações estiverem próximas no gráfico, que interpretação é possível e quais distorções devem ser consideradas?","emd",2,"Pontos próximos são mais parecidos na composição. A distância no gráfico é aproximada e depende do stress."],[2319,"NMDS: Escalonamento multidimensional","Como um diagrama de Shepard ajuda a avaliar a representação das dissimilaridades pela ordenação?","md",3,"O diagrama de Shepard compara as distâncias originais com as do gráfico. Pontos perto da curva indicam boa representação."],[2320,"NMDS: Escalonamento multidimensional","Se as observações formarem grupos visualmente distintos, como testaria formalmente essa separação?","emd",2,"Use PERMANOVA ou ANOSIM para testar a separação. A NMDS sozinha não testa."],[2321,"NMDS: Escalonamento multidimensional","Como transformações e padronizações dos dados podem alterar uma ordenação baseada em Bray-Curtis?","md",3,"Transformações como raiz quadrada reduzem o peso das espécies dominantes e mudam a ordenação."],[2322,"NMDS: Escalonamento multidimensional","Quando a distância de Jaccard seria mais informativa que Bray-Curtis para dados de ocorrência?","emd",3,"Jaccard usa presença e ausência e é útil quando a abundância não é confiável ou quando interessa a composição."],[2323,"NMDS: Escalonamento multidimensional","Como trataria unidades amostrais completamente vazias quando a medida de dissimilaridade não está definida para determinados pares?","md",3,"Unidades sem nenhuma ocorrência geram distâncias indefinidas. Remova essas unidades ou use dissimilaridades ajustadas."],[2324,"NMDS: Escalonamento multidimensional","Ao ajustar vetores ambientais sobre uma NMDS, por que uma associação significativa não demonstra causalidade?","emd",3,"O ajuste de vetores mostra associação com a ordenação, e não causa."],[2325,"NMDS: Escalonamento multidimensional","Como avaliaria se a configuração obtida é robusta à escolha da dissimilaridade e à remoção de observações influentes?","md",3,"Repita com outras dissimilaridades e sem observações influentes. Compare as soluções."],[2326,"RDA e CCA: Ordenações canônicas","Como explicaria a diferença entre uma ordenação exploratória não restrita e uma ordenação condicionada por variáveis explicativas?","md",3,"A ordenação não restrita mostra a estrutura geral dos dados. A restrita mostra só a variação explicada pelas variáveis escolhidas."],[2327,"RDA e CCA: Ordenações canônicas","Qual hipótese sobre a relação entre respostas e preditores sustenta a escolha da RDA em comparação com a CCA?","md",3,"A RDA supõe resposta linear aos gradientes. A CCA supõe resposta unimodal, mais comum em gradientes longos."],[2328,"RDA e CCA: Ordenações canônicas","Como justificaria uma transformação de Hellinger antes de realizar RDA com dados de abundância?","md",3,"A transformação de Hellinger reduz o peso das espécies muito abundantes e torna a RDA adequada para dados de abundância."],[2329,"RDA e CCA: Ordenações canônicas","Se o objetivo envolver uma medida não euclidiana de dissimilaridade, por que uma db-RDA poderia ser mais adequada?","md",3,"A db-RDA permite usar dissimilaridades como Bray-Curtis dentro de uma análise canônica."],[2330,"RDA e CCA: Ordenações canônicas","Como diferenciaria a variação total, a variação explicada pelas restrições e a variação residual em uma RDA?","md",3,"Mostre a variação total, quanto as variáveis explicam e o que sobra sem explicação."],[2331,"RDA e CCA: Ordenações canônicas","Por que os percentuais dos eixos podem depender de serem expressos em relação à variação total ou somente à variação restrita?","md",3,"Diga se os percentuais se referem à variação total ou só à explicada, porque os valores mudam muito."],[2332,"RDA e CCA: Ordenações canônicas","Como interpretaria o R² ajustado de uma RDA e por que ele pode ser negativo?","md",3,"O R² ajustado corrige pelo número de variáveis. Ele pode ser negativo quando as variáveis explicam menos que o esperado ao acaso."],[2333,"RDA e CCA: Ordenações canônicas","Como avaliaria a significância global do modelo e a contribuição dos eixos ou termos explicativos?","md",3,"Use testes de permutação para o modelo global, para os eixos e para cada variável, com correção quando necessário."],[2334,"RDA e CCA: Ordenações canônicas","Se houver blocos ou observações repetidas, como restringiria as permutações em testes de uma ordenação canônica?","md",3,"Restrinja as permutações aos blocos ou às repetições, para respeitar a estrutura dos dados."],[2335,"RDA e CCA: Ordenações canônicas","Como a multicolinearidade entre variáveis ambientais pode comprometer a interpretação das setas e dos efeitos individuais?","md",3,"Variáveis colineares tornam as setas instáveis. Verifique o fator de inflação da variância e selecione variáveis."],[2336,"RDA e CCA: Ordenações canônicas","Em que situação uma RDA parcial seria adequada para controlar uma estrutura espacial, temporal ou outra covariável?","md",3,"A RDA parcial remove o efeito de uma covariável, como espaço ou tempo, antes de testar as variáveis de interesse."],[2337,"RDA e CCA: Ordenações canônicas","Como interpretaria frações compartilhadas de variação em um particionamento sem atribuir causalidade indevida?","md",3,"A fração compartilhada não pode ser atribuída a uma variável só. Não indica causa."],[2338,"RDA e CCA: Ordenações canônicas","Se uma variável não for significativa isoladamente após incluir outras, por que isso não demonstra ausência de relação com a resposta multivariada?","md",3,"A variável pode estar correlacionada com outras do modelo, e o efeito dela foi absorvido. Isso não prova ausência de relação."],[2339,"RDA e CCA: Ordenações canônicas","Como escolheria variáveis explicativas evitando sobreajuste em uma ordenação com poucas unidades amostrais?","md",3,"Use seleção progressiva com critério de parada pelo R² ajustado global, e evite muitas variáveis para poucas unidades."],[2340,"RDA e CCA: Ordenações canônicas","Como interpretaria uma RDA significativa que explica apenas uma pequena parcela da variabilidade total?","md",3,"A significância mostra que a relação existe. O baixo R² mostra que outros fatores explicam a maior parte. Diga as duas coisas."],[2341,"Pressupostos estatísticos","Por que os pressupostos devem ser avaliados em relação ao modelo e à estrutura do delineamento, e não apenas por testes de normalidade das variáveis originais?","temd",2,"Os pressupostos se aplicam aos resíduos do modelo e à forma como os dados foram coletados, e não às variáveis brutas."],[2342,"Pressupostos estatísticos","Se Shapiro-Wilk indicar significância em uma amostra grande, como decidiria se o desvio de normalidade é relevante para a inferência?","emd",3,"Com amostras grandes, pequenos desvios ficam significativos. Veja o gráfico quantil-quantil e o efeito prático do desvio."],[2343,"Pressupostos estatísticos","Se Shapiro-Wilk não for significativo em uma amostra pequena, por que isso não comprova a normalidade?","temd",2,"Com amostras pequenas o teste tem pouco poder. Não rejeitar não prova normalidade."],[2344,"Pressupostos estatísticos","Como um gráfico quantil-quantil complementa os testes formais de normalidade?","te",2,"O gráfico quantil-quantil mostra onde e como os dados se afastam da normal, o que o teste sozinho não mostra."],[2345,"Pressupostos estatísticos","Como diferenciaria heterocedasticidade de uma relação média-resposta mal especificada?","md",3,"A heterocedasticidade é variância desigual. Uma relação média e resposta mal especificada mostra padrão sistemático nos resíduos. Veja o gráfico de resíduos."],[2346,"Pressupostos estatísticos","Por que a independência das observações deve ser justificada principalmente pelo delineamento e pelo processo de coleta?","temd",2,"A independência vem do desenho. Nenhum teste prova independência se as unidades estão agrupadas."],[2347,"Pressupostos estatísticos","Se os resíduos estiverem correlacionados no tempo, quais consequências espera para os erros-padrão convencionais?","emd",3,"A correlação temporal faz os erros-padrão ficarem pequenos demais e o p otimista."],[2348,"Pressupostos estatísticos","Como identificaria dependência espacial residual após ajustar um modelo com covariáveis ambientais ou geográficas?","md",3,"Use o índice I de Moran ou variogramas nos resíduos."],[2349,"Pressupostos estatísticos","Se a distribuição residual apresentar caudas pesadas, quais estratégias robustas consideraria e com que justificativa?","md",3,"Considere estimadores robustos, distribuições t ou bootstrap, justificando pela natureza dos dados."],[2350,"Pressupostos estatísticos","Como distinguiria falta de ajuste sistemática de variação aleatória em um gráfico de resíduos?","emd",3,"Falta de ajuste aparece como padrão nos resíduos, como curva ou tendência. Variação aleatória aparece como nuvem sem forma."],[2351,"Pressupostos estatísticos","Por que testar pressupostos e escolher automaticamente outro método com base em um único valor de p pode ser inadequado?","md",3,"Escolher o método com base em um teste preliminar muda as taxas de erro. Decida pelo conhecimento dos dados."],[2352,"Pressupostos estatísticos","Se a variância aumentar proporcionalmente à média, que distribuições ou estruturas de variância investigaria?","md",3,"Considere Poisson, Gamma, binomial negativa ou modelos que estimam a variância em função da média."],[2353,"Pressupostos estatísticos","Como avaliaria a linearidade de uma variável contínua na escala apropriada de um modelo com função de ligação?","md",3,"Analise os resíduos em relação à variável na escala da ligação, com gráficos de resíduos parciais ou splines."],[2354,"Pressupostos estatísticos","Em que condições uma transformação estabiliza variâncias, mas não resolve problemas de dependência amostral?","md",3,"A transformação pode igualar as variâncias, mas não resolve observações dependentes."],[2355,"Pressupostos estatísticos","Como documentaria uma violação de pressuposto que não pôde ser completamente corrigida e suas consequências para as conclusões?","emd",2,"Relate a violação, as tentativas de correção e como ela limita a força das conclusões."],[2356,"PERMANOVA e PERMDISP","Qual pergunta multivariada justificou utilizar PERMANOVA em vez de comparar cada variável resposta separadamente?","md",3,"A PERMANOVA testa o conjunto das variáveis ao mesmo tempo, o que evita muitos testes separados."],[2357,"PERMANOVA e PERMDISP","O que representa a estatística pseudo-F e como sua significância é obtida por permutações?","md",3,"O pseudo-F compara a variação entre e dentro dos grupos nas distâncias. O p é obtido embaralhando os rótulos."],[2358,"PERMANOVA e PERMDISP","Por que um resultado significativo pode refletir diferenças de localização, dispersão ou ambas, dependendo do delineamento?","md",3,"A PERMANOVA pode dar significativo por diferença de centro, de dispersão ou de ambos."],[2359,"PERMANOVA e PERMDISP","Como utilizaria PERMDISP para investigar a heterogeneidade de dispersão multivariada entre os grupos?","md",3,"O PERMDISP testa se a dispersão difere entre grupos. Use junto com a PERMANOVA."],[2360,"PERMANOVA e PERMDISP","Se PERMANOVA e PERMDISP forem significativas, como apresentaria uma interpretação cautelosa d
