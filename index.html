<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreBanca</title>
<style>
:root{--text:#111827;--muted:#6b7280;--border:#e5e7eb;
--c1:#0d9488;--c1s:#f0fdfa;--c2:#2563eb;--c2s:#eff6ff;--c3:#7c3aed;--c3s:#f5f3ff;--c4:#ea580c;--c4s:#fff7ed;
--n1:#16a34a;--n2:#d97706;--n3:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 20px 80px}
header.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border)}
.topin{max-width:880px;margin:0 auto;padding:12px 20px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;margin-right:auto;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.status{font-size:12px;color:var(--muted)}
button,select,input,textarea{font:inherit;color:var(--text)}
button{cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 16px}
button:hover{filter:brightness(.97)}
button:disabled{opacity:.45;cursor:default}
.big{font-size:17px;font-weight:700;padding:14px 22px;border:0;color:#fff;border-radius:14px}
.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.b4{background:var(--c4)}
.mini{padding:6px 12px;font-size:14px;border-radius:10px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
/* passos */
.steps{display:flex;gap:6px;margin-top:10px}
.step{font:inherit;cursor:pointer;flex:1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:#f9fafb;border:1px solid var(--border);border-radius:99px;padding:5px 10px;white-space:nowrap;overflow:hidden}
.step i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#e5e7eb;color:#4b5563}
.step.on{color:#fff}.step.on i{background:#fff}
.step.s1.on{background:var(--c1);border-color:var(--c1)}.step.s1.on i{color:var(--c1)}
.step.s2.on{background:var(--c2);border-color:var(--c2)}.step.s2.on i{color:var(--c2)}
.step.s3.on{background:var(--c3);border-color:var(--c3)}.step.s3.on i{color:var(--c3)}
.step.s4.on{background:var(--c4);border-color:var(--c4)}.step.s4.on i{color:var(--c4)}
.step.ok i{background:#dcfce7;color:#16a34a}
.bar{height:10px;background:#f3f4f6;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,var(--c3));border-radius:99px;transition:width .3s}
.pct{font-weight:700;font-size:14px;color:var(--c3)}
/* cartoes */
.card{border:1px solid var(--border);border-radius:18px;padding:24px;margin:18px 0;background:#fff}
.card h2{margin:0 0 6px;font-size:21px}
.sub{margin:0 0 8px;color:var(--muted);font-size:15px}
.hero{font-size:28px;line-height:1.25;margin:10px 0 6px}
.lead{font-size:17px;color:#374151;margin:0 0 6px}
.tops1{border-top:6px solid var(--c1)}.tops2{border-top:6px solid var(--c2)}.tops3{border-top:6px solid var(--c3)}.tops4{border-top:6px solid var(--c4)}
/* planos */
.planos{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:18px}
.plano{border:2px solid var(--border);border-radius:20px;padding:22px;display:flex;flex-direction:column;position:relative}
.plano.pe{border-color:#99f6e4;background:var(--c1s)}
.plano.pc{border-color:#c4b5fd;background:linear-gradient(180deg,#faf5ff,#fff)}
.plano h3{margin:0;font-size:22px}
.preco{font-size:30px;font-weight:800;margin:4px 0 8px}
.pe .preco{color:var(--c1)}.pc .preco{color:var(--c3)}
.plano ul{margin:0 0 18px;padding-left:20px;flex:1}
.plano li{margin:6px 0}
.selo{position:absolute;top:-13px;right:18px;background:var(--c3);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px}
.fine{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
/* formularios */
label.f{display:block;font-weight:600;margin:14px 0 4px}
label.f small{font-weight:400;color:var(--muted)}
input.t,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:11px 13px;background:#fff}
textarea{min-height:90px;resize:vertical}
input.t:focus,textarea:focus{outline:2px solid #c4b5fd;border-color:var(--c3)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:140px;font-weight:600}
.seg button.on{background:var(--c2);border-color:var(--c2);color:#fff}
label.ck{display:flex;gap:8px;align-items:center;margin-top:12px}
.estbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;margin-top:8px}
.estgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}.estgrid label.ck{margin-top:6px;font-size:14px}
.drop{border:2px dashed #93c5fd;background:var(--c2s);border-radius:16px;padding:26px 16px;text-align:center;cursor:pointer;margin-top:8px}
.drop b{display:block;font-size:18px;color:var(--c2)}
.drop span{color:var(--muted);font-size:14px}
.okdoc{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.code{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.code input{flex:1;min-width:200px;text-transform:uppercase;letter-spacing:.04em}
.msg{margin-top:10px;font-size:15px;color:#374151}
.msg.err{color:#b91c1c}
.wait{display:flex;gap:10px;align-items:center;background:var(--c3s);border:1px solid #ddd6fe;border-radius:12px;padding:12px 14px;margin-top:12px}
.spin{width:22px;height:22px;border:3px solid #ddd6fe;border-top-color:var(--c3);border-radius:50%;animation:gira 1s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
/* pergunta */
.qcard{border:2px solid #ddd6fe;border-radius:22px;padding:26px;margin:18px 0;background:#fff;box-shadow:0 8px 24px rgba(124,58,237,.08)}
.tema{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:99px;padding:3px 12px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.qh{display:flex;gap:12px;align-items:flex-start}
.qq{flex:1;font-size:22px;line-height:1.35;font-weight:700;margin:0}
.qcard textarea{min-height:200px;margin-top:14px;font-size:17px}
.tipb{width:40px;height:40px;border-radius:50%;padding:0;font-weight:800;font-size:20px;color:#fff;background:#f59e0b;border:0;flex:none;box-shadow:0 3px 10px rgba(245,158,11,.4)}
.tip{display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:14px 16px;margin:12px 0 0;font-size:15px}
.tip.on{display:block}
.brain{display:inline-block;font-size:30px;margin-right:8px;vertical-align:middle;animation:spin 1.2s ease-out 1}
@keyframes spin{from{transform:rotate(0) scale(.6)}to{transform:rotate(720deg) scale(1)}}
.tip ul{margin:6px 0 0;padding-left:20px}
.tip .lab{font-weight:700;margin-top:10px;display:block}
.tip .no{color:#b91c1c}
.alert{display:none;background:var(--c4s);border:1px solid #fdba74;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.alert.on{display:block}
.meta{font-size:13px;color:var(--muted);margin-top:6px}
.nav{margin-top:18px}
.calma{font-size:14px;color:var(--muted);text-align:center}
/* correcao */
.resumo h3{margin:16px 0 6px;font-size:17px}
.riscos{margin:0;padding-left:22px}.riscos li{margin:6px 0}
.pior{background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:14px 16px;margin-top:14px}
.pior b{color:#b91c1c}
.qc{border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin:14px 0}
.qc .qh b{flex:1;font-size:17px}
.lv{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;color:#fff;white-space:nowrap}
.lv1{background:var(--n1)}.lv2{background:var(--n2)}.lv3{background:var(--n3)}
.qc textarea{min-height:90px;margin-top:10px}
.fb{border-radius:12px;padding:10px 14px;margin-top:8px;font-size:15px}
.fb b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.fbok{background:#ecfdf5}.fbok b{color:#047857}
.fbfa{background:var(--c4s)}.fbfa b{color:#c2410c}
.fbdi{background:var(--c2s)}.fbdi b{color:#1d4ed8}
.fbco{background:var(--c3s)}.fbco b{color:#6d28d9}
.old{font-size:13px;color:var(--muted);margin-top:6px}
.compra{margin-top:12px;background:var(--c1s);border:1px solid #99f6e4;border-radius:12px;padding:12px 14px;font-size:15px}
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px}
.opt{border:1px solid var(--border);border-radius:16px;padding:16px}
.opt h3{margin:0 0 4px;font-size:18px}
.notice{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
@media(max-width:640px){.wrap{padding:14px 14px 80px}.card,.qcard{padding:18px}.hero{font-size:24px}.qq{font-size:20px}.step span{display:none}.step.on span{display:inline}.step{justify-content:center}}
@media print{header.top,.noprint,.tipb{display:none}.card,.qc{border:0;padding:0}}
</style>
</head>
<body>
<header class="top noprint"><div class="topin">
  <div class="row">
    <div class="brand">PreBanca<small>Treine com as perguntas que a banca pode fazer</small></div>
    <span class="status" id="status"></span>
    <button class="mini" id="btnLogin">Entrar com Google</button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="row" id="barRow" style="margin-top:8px;display:none"><div class="bar"><i id="barFill"></i></div><div class="pct" id="pct"></div></div>
</div></header>

<div class="wrap">
  <div id="app"></div>
  <input type="file" id="fileDoc" accept=".docx,.pdf" style="display:none">
  <div class="card noprint">
    <h2 style="font-size:18px">Suas arguições</h2>
    <p class="sub">Cada arguição guarda um trabalho e um treino. Você pode ter várias.</p>
    <div class="row">
      <select id="selArg" style="flex:1;min-width:180px;padding:9px;border:1px solid var(--border);border-radius:12px"></select>
      <button class="mini" id="btnNova">Nova</button>
      <button class="mini" id="btnRen">Renomear</button>
      <button class="mini" id="btnDel">Excluir</button>
    </div>
    <div class="notice" id="notice"></div>
  </div>
</div>

<script>
/* ============ CONFIGURACAO DO FIREBASE ============ */
const firebaseConfig = { apiKey:"AIzaSyBDbGUx64rLgugo9ZsJdwo9vI_-oeEgxjk", authDomain:"preparado-pra-defesa.firebaseapp.com", projectId:"preparado-pra-defesa", storageBucket:"preparado-pra-defesa.firebasestorage.app", messagingSenderId:"1026287073338", appId:"1:1026287073338:web:640c0f873ebfdb84465d03" };
const FB_VER = "10.12.2";

/* ============ CONTEUDO ============ */
const BLOCOS = [
 {id:"perg",t:"Pergunta científica",s:"Tudo começa aqui. Se a pergunta estiver frouxa, o resto cai junto."},
 {id:"local",t:"Local de estudo",s:"A banca quer um motivo científico para o lugar, e não um motivo pessoal."},
 {id:"tempo",t:"Recorte temporal",s:"Dez anos ou vinte anos não são motivo. Um evento, uma lei ou um dado são."},
 {id:"leit",t:"Leituras e lacuna",s:"Mostre que você conhece o tema melhor do que quem está te avaliando."},
 {id:"met",t:"Método",s:"O método precisa parecer a escolha óbvia depois que você explica."},
 {id:"est",t:"Estatística",s:"Perguntas gerais que servem para qualquer análise. Responda com o seu caso.",opt:true},
 {id:"fim",t:"Resultados e contribuição",s:"O que você entrega e por que isso importa."}
];
const Q = [
/* Perguntas de examinador (Ernandes) */
{id:"k1",b:"fim",n:2,f:"d",q:"Em que ponto a sua discussão responde aos seus objetivos e às suas hipóteses?",
 d:"A banca percebe quando a discussão rodeia o tema sem responder ao objetivo. Para cada objetivo, aponte o trecho da discussão que responde a ele e diga a resposta em uma frase.",
 ex:["O primeiro objetivo era... e a discussão mostra que... A hipótese dois foi confirmada em parte, porque..."],
 ev:["Repetir os resultados sem interpretar","Discussão que conversa com a literatura e esquece o objetivo"]},
{id:"k2",b:"met",n:2,f:"d",q:"No campo ou na coleta, o que você viu de diferente que não entrou no trabalho, mas vale contar para a banca?",

 ev:["Dizer que não viu nada de diferente","Contar algo sem ligação com o trabalho"]},
{id:"k3",b:"met",n:1,q:"Você usou inteligência artificial em alguma parte do trabalho? Em qual parte, e como conferiu o que ela produziu?",
 d:"Essa pergunta está cada vez mais comum. Seja transparente: diga em que etapa usou, por exemplo revisão de texto, tradução ou código, e como você checou o resultado. Se não usou, diga isso com tranquilidade.",
 ex:["Usei IA para revisar a gramática e para testar um código de análise. Conferi cada resultado com os dados originais."],
 ev:["Negar um uso que aparece no texto","Dizer que a IA escreveu e você só ajustou"]},
{id:"k4",b:"fim",n:2,f:"d",q:"Qual variável explica melhor os seus principais resultados?",
 d:"Escolha uma variável e mostre a evidência: o tamanho do efeito, a correlação, a diferença entre grupos ou o padrão que se repete. A banca quer ver que você sabe o que move o seu resultado.",
 ex:["A variável que mais explica é... Ela responde por... e o padrão aparece em todos os períodos."],
 ev:["Citar várias variáveis sem escolher","Escolher pelo p-valor sem olhar o tamanho do efeito"]},
{id:"k5",b:"fim",n:3,f:"d",q:"Por que essa variável seria a mais explicativa no seu trabalho? Você pode citar outro estudo que encontrou a mesma variável como resposta?",
 d:"Explique o mecanismo, ou seja, por que faz sentido essa variável comandar o resultado. Depois cite um trabalho que encontrou algo parecido e diga em que ele difere do seu.",
 ex:["Faz sentido porque... Tal estudo encontrou o mesmo papel dessa variável em outro local, mas com efeito menor, talvez porque..."],
 ev:["Não saber citar nenhum estudo","Citar um estudo que encontrou outra coisa"]},
{id:"k6",b:"perg",n:3,q:"As suas hipóteses surgiram antes de ver os dados ou depois?",

 ex:["As hipóteses estão no projeto de qualificação, antes da coleta. A análise de tal variável foi exploratória, e eu apresento como exploratória."],
 ev:["Apresentar como hipótese algo que você descobriu nos dados","Ficar na defensiva"]},
{id:"k7",b:"local",n:2,q:"Por que a sua região de estudo é expressiva para o tema, a ponto de interessar a quem não mora lá?",
 d:"Estudos locais têm mais dificuldade de publicação. Mostre o que a sua região tem de representativo: um gradiente, um ecossistema ou contexto que existe em outros lugares, um caso extremo ou uma lacuna de dados que o seu trabalho preenche.",
 ex:["A região concentra... e representa uma situação que se repete em... Por isso os resultados ajudam a entender também..."],
 ev:["Dizer que é importante porque é onde você mora","Falar só da importância local"]},
{id:"k8",b:"est",n:3,q:"Que outro modelo ou análise, que você não usou, poderia analisar os seus dados? Por que você não usou?",

{id:"k9",b:"fim",n:2,f:"d",q:"Quais foram as conclusões do seu trabalho? Diga direto, sem frases genéricas.",

{id:"k10",b:"fim",n:1,f:"d",q:"Qual é a principal mensagem do seu trabalho para o público leigo?",

 ex:["Descobrimos que... e isso significa que..."],
 ev:["Usar siglas e termos técnicos","Frase longa que não diz o resultado"]},
{id:"k11",b:"fim",n:2,q:"Qual é o público-alvo do seu trabalho e que mensagem você quer deixar para ele?",
 d:"Diga quem deve usar o seu resultado, por exemplo gestores, professores, pesquisadores ou uma comunidade, e qual é a mensagem prática para esse grupo. É diferente da mensagem para o público leigo.",
 ex:["O público-alvo são os gestores de... A mensagem para eles é que... e que isso pode ser feito por meio de..."],
 ev:["Dizer que o público é a sociedade em geral","Mensagem que não muda nenhuma decisão"]},
/* Classicas para qualquer area */
{id:"c1",b:"perg",n:1,q:"Como você chegou a esse tema?",
 d:"A banca usa essa pergunta para aquecer, mas ela revela muito. Conte em duas ou três frases o que despertou o interesse e, logo em seguida, mostre a lacuna que justifica a pesquisa. A história pessoal abre a resposta, e o argumento científico fecha.",
 ex:["Comecei a me interessar quando vi que... Ao ler sobre o assunto, percebi que ninguém tinha medido... e é isso que o trabalho faz."],

{id:"c2",b:"perg",n:1,q:"Por que esse tema importa agora?",
 d:"Mostre o que está acontecendo hoje que torna o tema urgente: um problema que cresce, uma lei nova, uma decisão que depende dessa resposta ou um dado recente. Prenda a urgência a algo que a banca possa conferir.",
 ex:["O problema aumentou nos últimos anos, e as decisões sobre ele ainda são tomadas sem dado local."],
 ev:["Dizer só que o tema é importante","Usar frases genéricas como cada vez mais"]},
{id:"c3",b:"perg",n:1,q:"Defina, com as suas palavras, o conceito central do seu trabalho.",

{id:"c4",b:"perg",n:2,q:"O título representa o que o trabalho de fato fez?",

{id:"c5",b:"leit",n:2,q:"Por que você escolheu esse referencial teórico e não outro?",

{id:"c6",b:"fim",n:2,q:"Qual é o produto ou a aplicação prática do seu trabalho e quem vai usar?",

 d:"Diga os critérios de inclusão e de exclusão e o motivo de cada um. Em pesquisa qualitativa, explique o critério para encerrar a coleta, por exemplo quando novas entrevistas deixaram de trazer informação nova.",
 ex:["Incluí quem... e excluí quem... Parei na entrevista doze, porque as três últimas não trouxeram nenhuma categoria nova."],
 ev:["Escolher só por facilidade de acesso sem admitir isso como limitação","Não saber dizer quantos participantes foram"]},
{id:"q2",b:"met",n:3,q:"Como você garante que a sua interpretação dos dados não é só a sua opinião?",
 d:"Fale dos cuidados que tornam a análise conferível: categorias definidas antes, mais de uma fonte de dado, outra pessoa codificando parte do material, trechos das falas que sustentam cada conclusão.",
 ex:["Comparei as entrevistas com os documentos e com a observação. Uma colega codificou parte do material, e discutimos as diferenças."],
 ev:["Dizer que a pesquisa qualitativa é subjetiva e por isso não precisa de rigor"]},
{id:"q3",b:"met",n:3,q:"Qual é a sua relação com o local ou com os participantes, e como isso pode influenciar os resultados?",
 d:"Se você trabalha no lugar ou conhece as pessoas, a banca vai perguntar. Assuma a proximidade, diga o que ela facilita e o que ela pode distorcer, e mostre o que você fez para reduzir esse efeito.",
 ex:["Trabalho na escola estudada. Isso facilitou o acesso, mas pode ter inibido respostas críticas. Por isso as entrevistas foram anônimas e..."],
 ev:["Negar qualquer influência","Usar a proximidade como motivo da escolha do local"]},
/* Defesa final */
{id:"d1",b:"fim",n:1,f:"d",q:"Qual é o principal resultado do seu trabalho, em uma frase?",
 d:"Diga o achado com um número ou com uma evidência concreta. A banca quer ouvir o resultado antes da explicação. Se você precisa de mais de uma frase, ainda não escolheu o principal.",
 ex:["O principal resultado é que X aumentou em tanto nos locais com Y, e isso não apareceu nos locais sem Y."],
 ev:["Começar pelo método","Dizer que os resultados foram satisfatórios"]},
{id:"d2",b:"fim",n:2,f:"d",q:"A sua conclusão responde à pergunta que você fez no começo?",
 d:"Leia a pergunta científica e depois a conclusão, lado a lado. Diga em que medida a pergunta foi respondida e, se foi só em parte, qual parte ficou aberta e por quê.",
 ex:["A pergunta era em que medida... A resposta é que... Ficou aberta a parte sobre..., porque o dado de... não chegou."],
 ev:["Conclusão que resume os resultados sem voltar à pergunta","Conclusão que responde a outra pergunta"]},
{id:"d3",b:"fim",n:2,f:"d",q:"Como os seus resultados conversam com o que outros autores encontraram?",
 d:"Escolha dois ou três trabalhos e diga onde você concorda, onde discorda e qual é a explicação para a diferença: local, período, método ou amostra.",
 ex:["Encontrei o mesmo padrão de tal estudo, mas com intensidade menor. A diferença pode vir do período, porque..."],
 ev:["Dizer que os resultados corroboram a literatura sem citar quem","Ignorar trabalhos que encontraram o contrário"]},
{id:"d4",b:"fim",n:2,f:"d",q:"Qual é a principal limitação dos seus resultados?",
 d:"Toda pesquisa tem limitação, e a banca respeita quem aponta a própria. Diga qual é, como ela afeta a conclusão e por que, mesmo com ela, o resultado continua válido.",
 ex:["A principal limitação é... Ela pode ter feito X parecer maior. Mesmo assim, o padrão aparece em todos os anos, o que sugere que..."],
 ev:["Dizer que não há limitação","Listar limitações sem dizer o efeito de cada uma"]},
{id:"d5",b:"fim",n:3,f:"d",q:"Explique a figura ou a tabela mais importante do seu trabalho como se a banca não tivesse lido.",
 d:"Diga o que está em cada eixo ou coluna, o que o leitor deve olhar primeiro e qual é a mensagem em uma frase. Treine em voz alta, porque essa pergunta costuma vir com o slide na tela.",
 ex:["No eixo horizontal estão os anos e no vertical... O ponto principal é a queda depois de tal ano, que coincide com..."],
 ev:["Ler a figura linha por linha","Não saber o que significa uma barra de erro ou uma sigla da legenda"]},
{id:"d6",b:"fim",n:3,f:"d",q:"Um dos seus resultados pode ter outra explicação? Qual e como você a descarta?",
 d:"Pense na explicação alternativa mais forte, aquela que um membro da banca levantaria. Diga se o seu desenho permite descartá-la e, se não permite, assuma isso e diga que dado resolveria.",
 ex:["Outra explicação seria... Descarto em parte porque... Para descartar de vez, seria preciso..."],
 ev:["Dizer que não há outra explicação","Atacar a alternativa sem argumento"]},
{id:"d7",b:"fim",n:3,f:"d",q:"Se você começasse o trabalho hoje, o que faria diferente?",
 d:"Essa pergunta mede maturidade. Escolha uma ou duas mudanças concretas no desenho ou na coleta e diga o que elas permitiriam responder. Mostre que você aprendeu, e não que o trabalho está errado.",
 ex:["Coletaria também na estação chuvosa, porque isso permitiria comparar... Hoje sei que..."],
 ev:["Dizer que não mudaria nada","Desmontar o próprio trabalho na frente da banca"]},
{id:"d8",b:"fim",n:2,f:"d",q:"Quais são os próximos passos de pesquisa a partir do seu trabalho?",
 d:"Diga duas perguntas que o seu trabalho abriu e por que elas importam. A banca gosta de ver que você enxerga o que vem depois.",
 ex:["O trabalho mostrou que... A próxima pergunta é se isso se repete em... e qual é o mecanismo por trás de..."],
 ev:["Dizer apenas que é preciso mais estudos","Propor algo sem ligação com os resultados"]},
/* Pergunta */
{id:"p1",b:"perg",n:1,chk:"simnao",q:"Qual é a sua pergunta científica?",
 d:"Se a sua pergunta pode ser respondida com sim ou não, ela precisa mudar. Uma boa pergunta pede medida, mecanismo ou comparação. Comece com Como, Quanto, Em que medida, Quais fatores ou De que forma.",
 ex:["Fraca: Existe relação entre queimadas e internações? Forte: Em que medida a concentração de material particulado nos meses de queima explica a variação das internações respiratórias no município?",
     "Fraca: O uso da terra afeta a qualidade da água? Forte: Como a conversão de vegetação nativa em pastagem altera a concentração de nutrientes ao longo do rio entre a cheia e a seca?",
     "Fraca: A escola trabalha educação ambiental? Forte: Quais práticas de educação ambiental os professores adotam e que barreiras limitam a sua aplicação?"],
 ev:["Pergunta que cabe em sim ou não","Pergunta que já traz a resposta dentro dela","Duas ou três perguntas diferentes coladas em uma só"]},
{id:"p2",b:"perg",n:1,q:"Qual é a sua hipótese e que resultado faria você abandonar essa hipótese?",
 d:"Hipótese boa pode dar errado. Diga o que você espera encontrar e descreva o resultado que mostraria que você estava enganado. Se nenhum resultado derruba a hipótese, ela ainda é uma opinião.",
 ex:["Espero que X aumente quando Y aumenta. Se X ficar estável nos locais com mais Y, a hipótese cai.","Em pesquisa qualitativa, troque hipótese por pressuposto e diga o que te surpreenderia nos dados."],
 ev:["Dizer que não tem hipótese sem explicar o motivo","Hipótese que repete o objetivo com outras palavras"]},
{id:"p3",b:"perg",n:2,q:"Como cada objetivo específico responde a um pedaço da sua pergunta?",
 d:"Liste os objetivos específicos e ligue cada um a uma parte da pergunta. Objetivo que não ajuda a responder a pergunta deve sair. Parte da pergunta sem objetivo indica um buraco no projeto.",
 ex:["Objetivo 1 mede a causa, objetivo 2 mede o efeito, objetivo 3 testa a ligação entre os dois."],
 ev:["Objetivos que são tarefas, como fazer revisão ou coletar dados","Mais de quatro objetivos específicos sem necessidade"]},
{id:"p4",b:"perg",n:2,q:"Explique o seu projeto em três frases para alguém de fora da área.",
 d:"Use uma frase para o problema, uma para o que você vai fazer e uma para o que muda depois. Se você não consegue resumir assim, a banca vai perceber antes do terceiro slide.",
 ex:["Problema: ninguém sabe quanto. Ação: vou medir em tais condições. Ganho: a resposta permite decidir tal coisa."],
 ev:["Jargão e sigla sem explicar","Começar pela história do tema desde a origem"]},
{id:"p5",b:"perg",n:3,q:"Se você só pudesse responder uma parte da pergunta, qual seria e por quê?",
 d:"A banca testa se você sabe o que é central e o que é acessório. Escolha a parte sem a qual o trabalho não existe e defenda essa escolha.",
 ex:["O núcleo é a medição de X. A comparação entre locais enriquece, mas pode virar trabalho futuro."],
 ev:["Dizer que tudo é igualmente essencial"]},
{id:"p6",b:"perg",n:3,q:"Quem vai usar a resposta da sua pergunta e o que muda quando ela for respondida?",
 d:"Nomeie um usuário concreto: gestor, comitê de bacia, secretaria, escola, outros pesquisadores. Diga que decisão ou que conhecimento fica diferente com o seu resultado.",
 ex:["O comitê de bacia passa a ter um valor de referência para discutir outorga no trecho estudado."],
 ev:["Dizer que contribui para a sociedade sem dizer como","Dizer que serve de base para estudos futuros e parar aí"]},
/* Local */
{id:"l1",b:"local",n:1,chk:"local",q:"Por que o seu local de estudo é importante?",
 d:"Responda com características do lugar que tornam a sua pergunta respondível ali. Pense em bioma, bacia hidrográfica, pressão de uso, população exposta, ausência de dados ou situação legal especial.",
 ex:["O local reúne o gradiente que a pergunta exige, com áreas conservadas e áreas convertidas na mesma bacia.","O local concentra o problema em intensidade maior que a média regional e ainda não tem série de dados publicada."],
 ev:["Porque eu moro lá","Porque é mais fácil ou mais perto","Porque eu já conheço a região","Porque o orientador mandou"]},
{id:"l2",b:"local",n:2,chk:"local",q:"O que diferencia esse local de outros parecidos e fez você escolher justamente ele?",
 d:"Compare com pelo menos uma alternativa real. Mostre o que o seu local tem que o outro não tem para responder a pergunta.",
 ex:["Entre os municípios da região, este é o único com estação de monitoramento contínuo e registro de saúde completo no período."],
 ev:["Dizer que é representativo sem mostrar em que aspecto","Citar só facilidade de acesso"]},
{id:"l3",b:"local",n:2,q:"Quais marcos regulatórios e instrumentos de gestão incidem sobre o seu local?",
 d:"Lei transforma um lugar comum em caso de interesse público. Verifique quais normas se aplicam e cite a que tem relação direta com a pergunta. Confira sempre o texto atual da norma antes de citar.",
 ex:["Constituição Federal, artigo 225, que trata do meio ambiente e nomeia biomas como patrimônio nacional",
     "Lei 6.938 de 1981, Política Nacional do Meio Ambiente",
     "Lei 9.433 de 1997, Política Nacional de Recursos Hídricos, com comitês de bacia e planos de bacia",
     "Lei 9.985 de 2000, Sistema Nacional de Unidades de Conservação",
     "Lei 12.187 de 2009, Política Nacional sobre Mudança do Clima",
     "Lei 12.651 de 2012, Código Florestal, com APP, Reserva Legal e CAR",
     "Lei 14.944 de 2024, Política Nacional de Manejo Integrado do Fogo",
     "Resoluções do CONAMA sobre enquadramento de corpos de água e padrões de qualidade do ar",
     "Reconhecimentos internacionais, como Sítio Ramsar e Reserva da Biosfera, além de plano diretor e leis estaduais e municipais"],
 ev:["Listar leis sem dizer o que elas mudam no seu local","Citar norma revogada"]},
{id:"l4",b:"local",n:3,q:"Os seus resultados valem para outros lugares? Até onde você pode generalizar?",
 d:"Diga com honestidade o alcance. Aponte para quais condições o resultado se transfere e onde ele deixa de valer.",
 ex:["Vale para áreas com o mesmo regime de inundação e uso semelhante. Fora disso, o método se transfere e os valores não."],
 ev:["Dizer que vale para o Brasil inteiro","Dizer que não se aplica a nenhum outro lugar"]},
{id:"l5",b:"local",n:3,q:"Se a banca sugerir trocar o local, que argumento técnico sustenta a sua escolha?",
 d:"Prepare uma resposta que reconheça a sugestão e mostre o que se perderia. Use dado, e não apego.",
 ex:["A troca é possível, mas perderíamos a série histórica e o contraste entre os dois tipos de uso."],
 ev:["Responder que já começou a coleta e por isso não muda"]},
/* Tempo */
{id:"t1",b:"tempo",n:1,chk:"data",q:"Por que você escolheu esse período de estudo?",
 d:"Número redondo não justifica nada. O início e o fim precisam estar presos a algo: uma lei, um evento extremo, o começo de uma série de dados, uma mudança de política ou um ciclo natural completo.",
 ex:["Início em 1985 porque é o primeiro ano das séries anuais de cobertura da terra por satélite Landsat.","Início em 2008 porque 22 de julho de 2008 é a data de corte do Código Florestal para área rural consolidada.","Período que cobre pelo menos um ciclo completo de cheia e seca ou um evento de El Niño e um de La Niña."],
 ev:["Porque dez anos é um bom intervalo","Porque foi o que deu tempo","Porque outros trabalhos usaram"]},
{id:"t2",b:"tempo",n:2,q:"Que evento, norma ou dado marca o primeiro ano e o último ano do seu recorte?",
 d:"Escreva uma frase para o início e outra para o fim. Se você não acha um marco, talvez o recorte deva mudar.",
 ex:["Começa no ano de criação da unidade de conservação e termina no último ano com dado consolidado."],
 ev:["Justificar só o início e esquecer o fim"]},
{id:"t3",b:"tempo",n:2,q:"O período é longo o bastante para enxergar o fenômeno que você estuda?",
 d:"Compare a duração do recorte com a escala do processo. Tendência climática pede décadas. Efeito de um evento pode pedir meses antes e depois. Variação entre anos pode esconder ou criar tendência falsa em série curta.",
 ex:["Com cinco anos eu descrevo variação entre anos. Só com série mais longa eu poderia falar em tendência."],
 ev:["Chamar de tendência o que são três ou quatro anos"]},
{id:"t4",b:"tempo",n:3,q:"As fontes de dados mudaram durante o período? Como você garante que os anos são comparáveis?",
 d:"Sensor, método de coleta, definição de variável e lei mudam com o tempo. Diga o que mudou e como você trata essa mudança.",
 ex:["Houve troca de sensor no meio da série. Uso produto já harmonizado e testo se há salto no ano da troca."],
 ev:["Dizer que os dados são oficiais e por isso não precisam de checagem"]},
{id:"t5",b:"tempo",n:3,q:"Se o período fosse a metade ou o dobro, o que mudaria na sua conclusão?",
 d:"Essa pergunta mede se o resultado depende do recorte. Pense em refazer a análise com outro intervalo como teste de robustez.",
 ex:["Vou repetir a análise retirando os dois anos extremos para ver se o padrão se mantém."],
 ev:["Dizer que não mudaria nada sem ter testado"]},
/* Leituras */
{id:"e1",b:"leit",n:1,q:"Quais são os três a cinco trabalhos que sustentam o seu projeto e o que cada um concluiu?",
 d:"Autor, ano e achado principal em uma linha cada. A banca confia em quem cita de memória o que leu.",
 ex:["Autor e ano: mostrou que X aumenta com Y em tal ambiente. Meu projeto parte desse resultado."],
 ev:["Citar livro-texto genérico","Citar trabalho que você só leu o resumo"]},
{id:"e2",b:"leit",n:1,q:"O que você leu sobre o tema que vale a pena contar para a banca?",
 d:"Escolha achados que surpreendem ou que mudam a forma de ver o problema. Um bom dado dito no começo ganha a atenção da sala.",
 ex:["Um número que mostra o tamanho do problema, com a fonte.","Um resultado recente que contraria o senso comum da área."],
 ev:["Repetir definições que todo mundo conhece"]},
{id:"e3",b:"leit",n:2,q:"O que a banca provavelmente não sabe sobre o seu tema?",
 d:"Ninguém na banca leu tanto sobre o seu recorte quanto você. Ache dois ou três pontos específicos do seu local, do seu método ou da literatura recente.",
 ex:["Um detalhe do funcionamento do local que só aparece em relatório técnico ou em dado primário."],
 ev:["Subestimar a banca em assunto que é da especialidade dela"]},
{id:"e4",b:"leit",n:2,q:"O que a banca precisa saber para entender por que o seu trabalho importa?",
 d:"Liste o mínimo de contexto sem o qual a pergunta parece pequena. Coloque isso nos primeiros minutos da apresentação.",
 ex:["Sem saber que o dado não existe para a região, a banca pode achar que o estudo é repetição."],
 ev:["Gastar dez minutos de contexto geral antes de chegar ao projeto"]},
{id:"e5",b:"leit",n:2,q:"O que ainda não foi feito sobre o seu tema?",
 d:"A lacuna é o motivo de existir do projeto. Diga o que falta e como você verificou que falta, com bases de busca, termos e período.",
 ex:["Há estudos em outros biomas, mas a busca em duas bases com tais termos não retornou trabalho para esta região."],
 ev:["Dizer que não existe nenhum estudo sem ter feito busca","Confundir lacuna com eu não encontrei"]},
{id:"e6",b:"leit",n:3,q:"Qual é o trabalho mais parecido com o seu e em que o seu é diferente?",
 d:"A banca pode conhecer esse trabalho. Cite antes que alguém cite e mostre a diferença de local, escala, método ou pergunta.",
 ex:["O estudo tal usou dado anual. Eu uso dado diário, o que permite ver o efeito de curto prazo."],
 ev:["Fingir que o trabalho parecido não existe"]},
{id:"e7",b:"leit",n:3,q:"Quem discorda da sua abordagem e qual é o argumento dessa pessoa?",
 d:"Conhecer a crítica mostra maturidade. Apresente o argumento contrário de forma justa e diga por que você mantém a sua escolha.",
 ex:["Há autores que preferem outro indicador por tal motivo. Mantenho o meu porque responde melhor à pergunta."],
 ev:["Dizer que não existe discordância na literatura"]},
{id:"e8",b:"leit",n:3,q:"Como você buscou a literatura? Quais bases, termos e período?",
 d:"Busca descrita pode ser repetida. Anote bases, combinação de termos, idiomas, período e critério de inclusão.",
 ex:["Bases Scopus e Web of Science, termos em inglês e português, período tal, com leitura de título e resumo para triagem."],
 ev:["Dizer que pesquisou no Google"]},
/* Metodo */
{id:"m1",b:"met",n:1,q:"Complete a frase: este método é o mais adequado porque...",
 d:"Ligue o método à pergunta. O método é adequado quando mede exatamente o que a pergunta pede, com o recurso que você tem.",
 ex:["Porque mede a variável de forma direta, na escala de tempo em que o processo acontece."],
 ev:["Porque é o que o laboratório tem","Porque todo mundo usa","Porque é o mais moderno"]},
{id:"m2",b:"met",n:1,q:"Descreva o caminho do dado, da coleta até a resposta da pergunta.",
 d:"Conte em etapas: de onde vem, como é coletado, como é tratado, como é analisado e que produto final responde a pergunta. Um fluxograma ajuda muito.",
 ex:["Coleta, conferência, organização em planilha, análise e figura final que responde ao objetivo 1."],
 ev:["Pular a etapa de conferência e limpeza dos dados"]},
{id:"m3",b:"met",n:2,q:"Que outros métodos você considerou e por que descartou cada um?",
 d:"Cite pelo menos uma alternativa real e o motivo técnico do descarte, como custo, precisão, escala ou viabilidade.",
 ex:["O método B tem mais precisão, mas exige equipamento indisponível e não muda a resposta na escala do estudo."],
 ev:["Dizer que não havia alternativa"]},
{id:"m4",b:"met",n:2,q:"Qual é a sua unidade amostral, quantas são e por que esse número?",
 d:"Diga o que conta como uma amostra: ponto, parcela, pessoa, escola, município, mês. Justifique a quantidade com variabilidade esperada, estudo anterior, cálculo ou saturação no caso qualitativo.",
 ex:["Cada ponto de coleta é uma unidade. São tantos pontos por tratamento, definidos a partir da variação de um estudo piloto."],
 ev:["Dizer que foi o número que deu para fazer","Confundir número de medidas com número de amostras"]},
{id:"m5",b:"met",n:2,q:"Qual é a maior limitação do seu método e o que você faz para reduzir o problema?",
 d:"Fale da limitação antes da banca. Quem aponta o próprio ponto fraco e mostra o controle ganha credibilidade.",
 ex:["A coleta é pontual no tempo. Reduzo isso repetindo a coleta em duas estações do ano."],
 ev:["Dizer que o método não tem limitação"]},
{id:"m6",b:"met",n:2,q:"O projeto precisa de aprovação ética ou de licença? Em que situação está?",
 d:"Pesquisa com pessoas passa por Comitê de Ética em Pesquisa. Coleta de material biológico e pesquisa em unidade de conservação federal passam pelo SISBIO. Acesso a patrimônio genético e a conhecimento tradicional pede cadastro no SisGen. Diga o que se aplica e o número do protocolo se já tiver.",
 ex:["Projeto submetido ao comitê de ética, aguardando parecer. A coleta só começa após aprovação."],
 ev:["Descobrir na banca que precisava de licença"]},
{id:"m7",b:"met",n:3,q:"Outra pessoa conseguiria repetir o seu estudo só com o que está escrito no projeto?",
 d:"Releia o método como se fosse um estranho. Faltam coordenadas, datas, equipamento, versão de programa, critério de exclusão?",
 ex:["Os pontos têm coordenadas, o protocolo está descrito passo a passo e o código de análise ficará disponível."],
 ev:["Escrever conforme metodologia padrão sem citar qual"]},
{id:"m8",b:"met",n:3,q:"Que fatores você não controla e que podem confundir o seu resultado?",
 d:"Liste as variáveis que mudam junto com a que você estuda. Diga se você mede, bloqueia, sorteia ou apenas reconhece cada uma.",
 ex:["A chuva varia junto com a estação. Registro a chuva e incluo essa variável na análise."],
 ev:["Atribuir toda a diferença observada ao fator que você escolheu estudar"]},
{id:"m9",f:"q",b:"met",n:3,q:"Qual é o seu plano B se a coleta falhar ou o dado não chegar?",
 d:"Equipamento quebra, rio não enche, entrevistado desiste, base de dados sai do ar. Mostre uma saída que ainda responda a pergunta, mesmo que em parte.",
 ex:["Se a campanha de campo falhar, uso a série pública já disponível para responder ao objetivo 1."],
 ev:["Dizer que não vai dar errado"]},
/* Estatistica */
{id:"s1",b:"est",n:1,q:"Qual é a sua variável resposta, quais são as explicativas e de que tipo é cada uma?",
 d:"Diga o que você quer explicar e com o quê. Classifique cada variável: contínua, contagem, proporção, categórica, ordinal. O tipo da variável resposta decide quase toda a análise.",
 ex:["Resposta: contagem de casos por mês. Explicativas: concentração média mensal, contínua, e estação do ano, categórica."],
 ev:["Não saber dizer qual é a variável resposta"]},
{id:"s2",b:"est",n:2,q:"Por que esse teste ou modelo? Quais pressupostos ele tem e como você vai conferir cada um?",
 d:"Todo teste assume coisas sobre os dados. Liste os pressupostos do seu e diga como verifica, de preferência olhando resíduos em gráfico em vez de confiar só em teste de normalidade.",
 ex:["O modelo assume independência e variância constante dos resíduos. Confiro com gráficos de resíduos contra valores ajustados."],
 ev:["Porque foi o teste que o programa ofereceu","Testar normalidade da variável bruta e parar aí"]},
{id:"s3",b:"est",n:2,q:"As suas amostras são independentes entre si?",
 d:"Medidas repetidas no mesmo ponto, pontos muito próximos e meses seguidos costumam ser parecidos. Isso é pseudorreplicação ou autocorrelação e infla a significância. Diga como o seu desenho ou o seu modelo trata isso.",
 ex:["Há medidas repetidas no mesmo local. Incluo o local como efeito aleatório no modelo."],
 ev:["Tratar dez medidas do mesmo ponto como dez amostras independentes"]},

const GEN = [[1,"Motivação","O que motivou a escolha deste tema?","temd",1,"Comece pelo que despertou o interesse, em uma frase, e passe logo para o argumento científico: o problema que existe e a lacuna que o trabalho preenche. A história pessoal abre, mas não sustenta a resposta."],[5,"Motivação","Por que este assunto merece atenção?","temd",1,"Mostre quem é afetado pelo problema e o que se perde se ninguém estudar o assunto. Um dado concreto, como um número, uma lei ou um caso, convence mais que adjetivos."],[9,"Motivação","Que inquietação deu origem ao trabalho?","temd",1,"Diga qual pergunta ficou sem resposta para você ao ler sobre o tema ou ao observar a realidade. A inquietação boa é uma dúvida que a literatura ainda não resolveu."],[13,"Motivação","Como seu interesse pelo tema evoluiu?","temd",1,"Conte o percurso em dois ou três passos, por exemplo da curiosidade inicial até a pergunta atual. Mostre que o recorte ficou mais preciso com o tempo, e não mais vago."],[17,"Motivação","Que razões sustentam a realização deste trabalho?","temd",2,"Organize em três razões: a relevância do problema, a lacuna no conhecimento e o uso prático do resultado. Cada razão em uma frase."],[21,"Delimitação","Como você delimitou o objeto do trabalho?","temd",2,"Diga o que entra e o que fica de fora: lugar, período, população, variáveis ou fontes. Depois explique o critério que levou a esse limite."],[25,"Delimitação","O que decidiu deixar fora do escopo?","temd",2,"Cite uma ou duas coisas que você deixou de fora de propósito e o motivo de cada uma. Deixar algo fora é uma escolha defensável quando tem justificativa."],[29,"Delimitação","Por que escolheu esse recorte?","temd",2,"Explique por que esse recorte responde melhor à sua pergunta do que um recorte maior ou menor. Se houve limitação prática, assuma, mas mostre também o motivo científico."],[33,"Delimitação","Quais fronteiras definem o alcance do trabalho?","temd",2,"Diga até onde as conclusões valem: para que lugar, período, grupo ou tipo de caso. Mostrar o limite do alcance passa segurança, e não fraqueza."],[37,"Delimitação","Como evitar que o tema se torne amplo demais?","te",1,"Mostre a pergunta central e diga que tudo o que não ajuda a respondê-la ficou de fora. Um tema fica amplo demais quando a pergunta tenta responder várias coisas ao mesmo tempo."],[41,"Problema","Qual é o problema central abordado?","temd",1,"Diga o problema em uma frase, sem rodeios, de preferência apontando o que não se sabe ainda. Se precisar de mais de uma frase, o problema ainda não está claro para você."],[45,"Problema","Como você chegou à formulação do problema?","temd",2,"Conte de onde veio a formulação: da leitura, de um dado, de uma observação ou de uma demanda prática. Mostre como uma ideia geral virou uma pergunta que pode ser respondida."],[49,"Problema","Que aspecto do problema é mais difícil de enfrentar?","emd",3,"Escolha a parte mais difícil, como medir algo complexo, conseguir dados ou separar causas, e diga o que você fez para lidar com ela. A banca valoriza quem reconhece a dificuldade e tem estratégia."],[53,"Problema","Por que essa formulação é adequada?","emd",2,"Mostre que a formulação permite uma resposta com os dados e o método que você tem. Uma boa formulação é clara, delimitada e pode ser verificada."],[57,"Problema","Que outra formulação do problema seria possível?","md",3,"Apresente uma formulação alternativa e diga por que preferiu a sua. Isso mostra que você pensou no problema por mais de um ângulo."],[61,"Objetivo geral","Qual é o propósito principal do trabalho?","temd",1,"Diga o objetivo geral em uma frase, começando com um verbo como analisar, avaliar ou comparar. Ele deve responder diretamente ao problema."],[65,"Objetivo geral","Como o objetivo geral se relaciona com o problema?","temd",2,"Mostre que o objetivo geral é a resposta prometida ao problema. Se o problema é o que não se sabe, o objetivo é descobrir exatamente isso."],[69,"Objetivo geral","Em que medida o objetivo geral foi alcançado ou pode ser alcançado?","temd",2,"Diga com franqueza o quanto foi alcançado e aponte a evidência. Se foi alcançado em parte, explique qual parte ficou aberta e por quê."],[73,"Objetivo geral","Por que formulou o objetivo dessa maneira?","emd",2,"Justifique o verbo e o alcance do objetivo. Avaliar é diferente de descrever, e a banca percebe quando o verbo promete mais do que o método entrega."],[77,"Objetivo geral","Como saber se o objetivo principal foi cumprido?","temd",2,"Diga qual resultado, produto ou evidência mostra que o objetivo foi cumprido. Um objetivo bom já deixa claro como verificar se foi atingido."],[81,"Objetivos específicos","Como os objetivos específicos contribuem para o objetivo geral?","temd",1,"Mostre que cada objetivo específico responde a uma parte do objetivo geral, como peças de um quebra-cabeça. Se um deles não se conecta, a banca vai perguntar por que está ali."],[85,"Objetivos específicos","Qual objetivo específico considera mais importante?","temd",2,"Escolha um e diga por que ele é o centro do trabalho. Normalmente é aquele sem o qual o objetivo geral não seria respondido."],[89,"Objetivos específicos","Há algum objetivo que poderia ser reformulado?","emd",3,"Reconheça um objetivo que poderia ser mais preciso e diga como você o reescreveria. Mostrar senso crítico sobre o próprio texto conta pontos."],[93,"Objetivos específicos","Como os objetivos específicos se complementam?","temd",2,"Explique a sequência: um objetivo prepara o outro, ou cada um olha o problema por um lado. Mostre que juntos cobrem o objetivo geral sem sobrar nem faltar."],[97,"Objetivos específicos","Que critério utilizou para definir os objetivos específicos?","emd",2,"Diga o critério, por exemplo etapas do método, dimensões do problema ou perguntas da literatura. Objetivos definidos por um critério claro ficam mais fáceis de defender."],[101,"Justificativa","Qual é a justificativa mais forte para o trabalho?","temd",1,"Escolha a justificativa mais forte e fale dela primeiro, com um dado ou fato que a sustente. Uma justificativa forte vale mais que várias fracas."],[105,"Justificativa","Quem pode se beneficiar da discussão proposta?","temd",1,"Cite grupos concretos, como gestores, professores, comunidades, empresas ou outros pesquisadores, e diga o que cada um ganha com o resultado."],[109,"Justificativa","Que necessidade o trabalho procura atender?","temd",2,"Descreva a necessidade de forma concreta: uma decisão que precisa de dados, uma lacuna na literatura ou um problema prático sem solução."],[113,"Justificativa","Como defenderia a relevância do trabalho perante um público cético?","emd",3,"Responda ao cético com fatos, e não com entusiasmo. Mostre o tamanho do problema, quem é afetado e o que muda com o seu resultado."],[117,"Justificativa","Por que o trabalho é oportuno?","emd",2,"Mostre o que acontece agora que torna o trabalho necessário: uma mudança, uma lei nova, um dado recente ou um problema que cresceu."],[121,"Originalidade","O que diferencia seu trabalho de outros sobre o tema?","temd",2,"Compare com dois ou três trabalhos parecidos e diga a diferença: o lugar, o período, o método, os dados ou a pergunta. Seja específico."],[125,"Originalidade","Em que consiste sua contribuição própria?","emd",2,"Diga o que existe no trabalho que não existia antes dele: um dado novo, uma análise, uma interpretação ou um produto. Use uma frase."],[129,"Originalidade","Qual aspecto do trabalho apresenta maior novidade?","md",3,"Aponte a parte mais nova e diga por que ela é nova, citando o que já foi feito. Novidade não precisa ser revolucionária, precisa ser real."],[133,"Originalidade","Como distingue originalidade de simples reformulação?","md",3,"Explique que originalidade é responder algo que ainda não tinha resposta, e não dizer o mesmo com outras palavras. Mostre onde o seu trabalho acrescenta algo."],[137,"Originalidade","Que parte do trabalho representa sua própria elaboração?","temd",2,"Separe o que você usou de outros autores do que você produziu: os dados, a análise, a interpretação ou a síntese. A banca quer ver a sua autoria."],[141,"Contextualização","Que contexto é indispensável para compreender o trabalho?","temd",1,"Diga o contexto mínimo que alguém de fora precisa saber: o lugar, o período, a situação social ou o estado do problema. Seja breve e objetivo."],[145,"Contextualização","Como o contexto influencia a abordagem escolhida?","emd",2,"Mostre como o contexto pesou nas escolhas, por exemplo no método, nas fontes ou nas variáveis. Um contexto diferente pediria uma abordagem diferente."],[149,"Contextualização","Que mudanças de contexto poderiam alterar sua interpretação?","md",3,"Pense em uma mudança plausível, como outro período ou outro lugar, e diga como ela poderia alterar a sua conclusão. Isso mostra que você conhece os limites da interpretação."],[153,"Contextualização","Que antecedentes ajudam a entender o tema?","temd",1,"Cite os fatos ou estudos anteriores que explicam como o tema chegou ao ponto atual. Dois ou três antecedentes bem escolhidos bastam."],[157,"Contextualização","Como situaria o trabalho em uma discussão mais ampla?","emd",2,"Ligue o seu trabalho a uma discussão maior, nacional ou internacional, e diga que peça ele acrescenta a essa discussão."],[161,"Conceitos","Qual conceito é central para entender seu trabalho?","temd",1,"Escolha o conceito central, dê a definição do autor que você usa e diga como ele aparece no seu trabalho."],[165,"Conceitos","Como definiu os principais termos utilizados?","temd",2,"Diga de onde vêm as definições, de quais autores ou normas, e como você aplicou cada uma. Termos importantes não podem ficar sem definição."],[169,"Conceitos","Que conceito poderia gerar interpretações equivocadas?","emd",2,"Aponte um termo que pode ter mais de um sentido e diga qual sentido você usa. Antecipar essa confusão evita uma pergunta difícil."],[173,"Conceitos","Como distingue conceitos próximos no trabalho?","emd",3,"Escolha dois conceitos parecidos e diga em que eles diferem, com um exemplo do seu trabalho. Confundir conceitos próximos é um dos pontos que a banca mais cobra."],[177,"Conceitos","Por que adotou essas definições e não outras?","md",3,"Mostre que você conhece outras definições e diga por que a sua serve melhor à sua pergunta. Escolher entre definições é uma decisão teórica."],[181,"Fundamentação","O que sustenta intelectualmente sua abordagem?","emd",2,"Diga a base teórica do trabalho em uma frase, citando a linha ou os autores principais, e mostre como ela sustenta a sua pergunta."],[185,"Fundamentação","Como a fundamentação orienta suas decisões?","emd",2,"Dê um exemplo concreto de uma decisão do trabalho que veio da teoria, como a escolha de uma variável, de uma categoria ou de um método."],[189,"Fundamentação","Que pressuposto fundamenta a discussão central?","md",3,"Diga qual ideia você assume como verdadeira para que a discussão faça sentido. Reconhecer esse pressuposto mostra maturidade."],[193,"Fundamentação","Que parte da fundamentação merece maior atenção?","emd",2,"Aponte a parte da fundamentação mais importante para entender os resultados e diga por quê."],[197,"Fundamentação","Como avaliou a adequação da fundamentação ao tema?","md",3,"Explique como verificou que a teoria escolhida serve para o seu objeto, por exemplo pela comparação com estudos parecidos ou pela adequação ao contexto."],[201,"Referências","Como selecionou as referências utilizadas?","temd",2,"Explique o critério: bases consultadas, palavras usadas, período e por que algumas fontes ficaram de fora. Seleção sem critério é um ponto fraco comum."],[205,"Referências","Qual referência mais influenciou sua compreensão do tema?","temd",1,"Escolha uma referência e diga o que ela mudou na sua forma de ver o tema. Conhecer bem uma obra central vale mais que citar muitas."],[209,"Referências","Como avaliou a confiabilidade das fontes?","temd",2,"Diga como checou as fontes: se são revisadas e responder ao que você quer saber."],[249,"Perspectivas","Como outra perspectiva mudaria a discussão?","md",3,"Imagine o trabalho com outra lente teórica e diga o que mudaria nas perguntas ou nas conclusões. Isso mostra domínio do campo."],[253,"Perspectivas","Que vantagens e desvantagens percebe na perspectiva escolhida?","emd",2,"Dê uma vantagem e uma desvantagem reais da perspectiva escolhida. Admitir a desvantagem com tranquilidade fortalece a defesa."],[257,"Perspectivas","Como lidou com perspectivas incompatíveis entre si?","md",3,"Explique se você escolheu uma das perspectivas ou se combinou partes delas, e como evitou contradições ao fazer isso."],[261,"Pressupostos","Quais pressupostos orientam o trabalho?","md",2,"Liste dois ou três pressupostos, ou seja, o que você assume como verdadeiro sem testar. Por exemplo, que os dados representam bem a realidade estudada."],[265,"Pressupostos","Qual pressuposto é mais importante para sua argumentação?","md",3,"Escolha o pressuposto de que o argumento mais depende e diga por que ele é razoável."],[269,"Pressupostos","O que aconteceria se um pressuposto central fosse questionado?","md",3,"Diga o que cairia e o que continuaria de pé se esse pressuposto fosse falso. Isso mostra que você conhece a solidez do próprio trabalho."],[273,"Pressupostos","Como tornou explícitos seus pressupostos?","md",2,"Diga em que parte do texto os pressupostos aparecem. Se não aparecem, reconheça que poderiam estar mais claros."],[277,"Pressupostos","Que pressuposto merece ser reavaliado?","md",3,"Aponte um pressuposto que mereceria ser testado num próximo trabalho e diga como você faria esse teste."],[281,"Abordagem","Como caracterizaria a abordagem adotada?","temd",1,"Diga o tipo de pesquisa, por exemplo quantitativa, qualitativa, experimental ou documental, e o porquê em uma frase."],[285,"Abordagem","Por que essa abordagem é apropriada ao problema?","temd",2,"Ligue a abordagem à pergunta: diga o que a pergunta exige e como a abordagem ,"emd",2,"Reconheça uma decisão que poderia ter sido outra e diga o que mudaria no resultado. Isso mostra maturidade."],[337,"Decisões","Como conciliou escolhas que competiam entre si?","md",3,"Dê um exemplo de duas escolhas em conflito, como profundidade e abrangência, e explique o equilíbrio que você encontrou."],[341,"Procedimentos","Como descreve o caminho adotado para desenvolver o trabalho?","temd",1,"Descreva o caminho em passos, do início até o resultado, como uma receita que outra pessoa poderia seguir."],[345,"Procedimentos","Por que escolheu esses procedimentos?","temd",2,"Justifique cada procedimento pela pergunta que ele ajuda a responder. Procedimento sem função clara chama a atenção da banca."],[349,"Procedimentos","Como os procedimentos se relacionam com os objetivos?","temd",2,"Mostre a ligação direta: cada objetivo tem um procedimento que gera a informação de que ele precisa."],[353,"Procedimentos","Que cuidados são necessários na execução dos procedimentos?","temd",2,"Diga os cuidados que garantem a qualidade dos dados, como padronização, calibração, registro e controle de erros."],[357,"Procedimentos","Como avaliaria a adequação dos procedimentos?","emd",2,"Avalie com franqueza se os procedimentos funcionaram e o que você ajustaria numa próxima vez."],[361,"Materiais e fontes","Que recursos são essenciais para desenvolver o trabalho?","temd",1,"Cite os recursos sem os quais o trabalho não aconteceria: dados, equipamentos, acesso a pessoas, documentos ou programas."],[365,"Materiais e fontes","Como avaliou a adequação dos materiais ou fontes utilizados?","temd",2,"Diga como verificou que os materiais ou as fontes eram adequados para a pergunta, quanto à qualidade, à abrangência e à confiabilidade."],[369,"Materiais e fontes","Que critérios orientam a inclusão de materiais ou fontes?","temd",2,"Explique os critérios de inclusão e de exclusão das fontes ou dos materiais, e por que eles fazem sentido."],[373,"Materiais e fontes","Que limitações decorrem dos recursos disponíveis?","temd",2,"Reconheça o que faltou em recursos e como isso limitou o trabalho, sem transformar a limitação em desculpa."],[377,"Materiais e fontes","Como garantir a rastreabilidade das informações utilizadas?","emd",2,"Diga como alguém pode refazer o caminho: registro de dados, fontes citadas, versões e arquivos guardados."],[381,"Critérios","Que critérios utiliza para avaliar a qualidade do trabalho?","emd",2,"Diga quais critérios você usaria para julgar se o seu trabalho é bom, como clareza, rigor, coerência e utilidade."],[385,"Critérios","Como estabeleceu os critérios de seleção?","temd",2,"Explique de onde vieram os critérios de seleção, como literatura, norma técnica ou objetivo, e como você os aplicou."],[389,"Critérios","Como justificaria os critérios adotados?","emd",2,"Mostre que os critérios decorrem da pergunta e não da conveniência. Cite a base de cada um."],[393,"Critérios","Que consequência teria a alteração de um critério central?","md",3,"Pense em mudar um critério e diga se o resultado mudaria. Se mudaria pouco, isso mostra que o resultado é robusto."],[397,"Critérios","Como evita aplicar critérios de maneira inconsistente?","emd",3,"Diga como garantiu que o critério foi aplicado igual em todos os casos, por exemplo com protocolo escrito ou revisão por outra pessoa."],[401,"Coerência","Como demonstra a coerência entre as partes do trabalho?","emd",2,"Mostre o fio que liga problema, objetivos, método, resultados e conclusão. Se um elo parece solto, explique a ligação."],[405,"Coerência","Qual ligação entre as partes merece maior explicação?","emd",2,"Aponte a ligação entre partes que pode não estar clara no texto e explique em voz alta como uma leva à outra."],[409,"Coerência","Como evita contradições internas?","emd",3,"Diga como você revisou o texto para evitar afirmações que se contradizem. Se encontrou alguma, explique como resolveu."],[413,"Coerência","Como os argumentos sustentam o propósito central?","emd",2,"Mostre como cada argumento principal contribui para o objetivo central. Argumento que não contribui pode ser cortado."],[417,"Coerência","Que aspecto poderia melhorar a unidade do trabalho?","emd",2,"Aponte o que daria mais unidade ao trabalho, como um fio condutor mais explícito ou a retomada do objetivo nas conclusões."],[421,"Argumentação","Qual é seu argumento principal?","temd",2,"Diga o argumento central em uma frase. É a tese que o trabalho inteiro tenta sustentar."],[425,"Argumentação","Que razões sustentam esse argumento?","emd",2,"Dê duas ou três razões que sustentam o argumento, cada uma com uma evidência do trabalho."],[429,"Argumentação","Qual objeção seria mais difícil de responder?","md",3,"Escolha a objeção mais forte ao seu argumento e responda com evidência. Antecipar a crítica é a melhor defesa."],[433,"Argumentação","Como diferencia afirmações fundamentadas de opiniões?","emd",2,"Explique que afirmação fundamentada tem dado ou fonte por trás, e opinião não tem. Mostre um exemplo do seu texto."],[437,"Argumentação","Como fortaleceria um argumento menos desenvolvido?","emd",3,"Aponte o argumento mais frágil e diga que evidência ou análise o fortaleceria."],[441,"Evidências","Que elementos sustentam suas afirmações?","temd",2,"Diga quais dados, fontes ou observações sustentam cada afirmação principal. Afirmação sem sustentação é alvo fácil."],[445,"Evidências","Como distingue evidências fortes de evidências frágeis?","md",3,"Explique o que torna uma evidência forte, como tamanho da amostra, qualidade da medida e consistência, e classifique as suas."],[449,"Evidências","Que informação adicional fortaleceria sua discussão?","emd",2,"Diga que informação faltou e como ela mudaria ou reforçaria a discussão."],[453,"Evidências","Como lida com elementos que contrariam sua interpretação?","md",3,"Mostre que você não ignorou o que contraria a sua interpretação. Diga como explica esse dado ou por que ele não derruba a conclusão."],[457,"Evidências","Que afirmação exige maior sustentação?","emd",2,"Aponte a afirmação mais ousada do trabalho e diga que evidência ainda falta para ela."],[461,"Interpretação","Como chegou à interpretação apresentada ou proposta?","emd",2,"Conte o raciocínio que levou dos dados à interpretação, passo a passo."],[465,"Interpretação","Que interpretação alternativa considera plausível?","md",3,"Apresente uma interpretação alternativa plausível e diga por que a sua é mais convincente."],[469,"Interpretação","Como evita extrapolar o que os elementos disponíveis permitem afirmar?","emd",3,"Mostre que as conclusões ficam dentro do que os dados permitem. Diga o que você não pode afirmar com o que tem."],[473,"Interpretação","Que fatores influenciam sua interpretação?","md",3,"Reconheça os fatores que pesam na sua leitura, como a teoria escolhida, a sua experiência e o contexto, e como você controlou isso."],[477,"Interpretação","Como diferencia descrição de interpretação?","temd",2,"Explique que descrever é dizer o que foi encontrado, e interpretar é dizer o que isso significa. Dê um exemplo de cada no seu trabalho."],[481,"Análise","Como organiza a análise do tema?","temd",2,"Diga a ordem e a lógica da análise, por exemplo do geral para o específico ou por objetivo."],[485,"Análise","Que aspecto considera mais importante examinar?","temd",2,"Escolha o aspecto central da análise e diga por que ele responde à pergunta."],[489,"Análise","Como relaciona as partes da análise?","emd",2,"Mostre como os resultados de uma parte da análise se ligam aos da outra para formar a conclusão."],[493,"Análise","Que critério indica que a análise é suficiente?","md",3,"Diga o critério que indicou que a análise bastava, como saturação, estabilidade dos resultados ou cobertura dos objetivos."],[497,"Análise","Que outra forma de análise poderia ser útil?","emd",3,"Cite outra forma de análise que poderia complementar a sua e o que ela acrescentaria."],[501,"Qualidade","O que considera um trabalho de qualidade neste contexto?","emd",2,"Diga dois ou três critérios de qualidade da sua área, como rigor do método, clareza e coerência, e mostre como o trabalho atende a cada um."],[505,"Qualidade","Como demonstra o rigor de sua elaboração?","emd",2,"Mostre o rigor com fatos: protocolo seguido, cuidados com os dados, revisões feitas e testes de robustez."],[509,"Qualidade","Que aspecto precisa de maior controle de qualidade?","emd",2,"Aponte a etapa mais sujeita a erro e diga como você controlou ou controlaria essa etapa."],[513,"Qualidade","Como avaliaria a consistência das suas decisões?","md",3,"Mostre que você usou os mesmos critérios do começo ao fim. Se mudou algum no meio, explique o motivo."],[517,"Qualidade","Que melhoria aumentaria a qualidade do trabalho?","temd",2,"Diga uma melhoria concreta e possível, e o que ela mudaria no resultado. Evite listar muitas."],[521,"Limitações","Qual é a principal limitação do trabalho?","temd",1,"Diga a principal limitação com franqueza e explique o efeito dela sobre o resultado. Toda pesquisa tem limites, e reconhecê-los conta a seu favor."],[525,"Limitações","Como as limitações afetam o alcance das afirmações?","emd",2,"Mostre até onde as afirmações continuam válidas apesar da limitação, e o que deixa de poder ser afirmado."],[529,"Limitações","Que limitação poderia ser reduzida?","temd",2,"Escolha uma limitação que tem solução e diga como ela poderia ser reduzida numa próxima etapa."],[533,"Limitações","Que limitação não seria possível eliminar facilmente?","emd",3,"Aponte a limitação que vem da própria natureza do objeto ou dos dados disponíveis e explique como você convive com ela."],[537,"Limitações","Como comunicaria as limitações sem desvalorizar a contribuição?","emd",2,"Fale da limitação e, em seguida, do que o trabalho entrega mesmo com ela. Limitação bem explicada valoriza a contribuição."],[541,"Incertezas","Qual é a maior incerteza associada ao trabalho?","emd",2,"Diga qual resultado ou etapa tem mais incerteza e de onde ela vem, como medida, amostra ou interpretação."],[545,"Incertezas","Como identifica aquilo que ainda não pode afirmar?","md",3,"Explique como separou o que os dados mostram do que eles apenas sugerem. Diga uma coisa que você ainda não pode afirmar."],[549,"Incertezas","Que informação reduziria a incerteza mais importante?","emd",2,"Diga que dado ou análise reduziria a maior dúvida do trabalho, e por que ele não foi possível agora."],[553,"Incertezas","Como comunica dúvidas de forma academicamente adequada?","md",2,"Mostre que você usa termos adequados como sugere, indica ou é compatível com, e não afirma mais do que os dados permitem."],[557,"Incertezas","Como distingue incerteza de ausência de fundamentação?","md",3,"Explique que incerteza é uma dúvida medida e declarada, enquanto falta de fundamentação é afirmar sem base. Dê um exemplo do seu trabalho."],[561,"Vieses","Que vieses poderiam influenciar suas escolhas?","emd",2,"Reconheça um ou dois vieses possíveis, como de seleção, de medida ou de confirmação, e diga como lidou com eles."],[565,"Vieses","Como reconhece a influência de suas próprias expectativas?","md",3,"Diga o que você esperava encontrar e como evitou que essa expectativa direcionasse a análise ou a leitura dos dados."],[569,"Vieses","Que medida ajudaria a reduzir interpretações tendenciosas?","emd",2,"Cite uma medida concreta, como análise cega, segundo avaliador, critério definido antes ou teste de sensibilidade."],[573,"Vieses","Como evita selecionar apenas elementos favoráveis à sua posição?","md",3,"Mostre que você incluiu dados e autores que contrariam a sua posição e o que fez com eles."],[577,"Vieses","Que perspectiva ausente poderia revelar um viés?","md",3,"Pense em um grupo, autor ou dado que ficou de fora e diga como a ausência pode ter influenciado o resultado."],[581,"Ética","Que questões éticas são pertinentes ao trabalho?","temd",1,"Diga as questões éticas do seu trabalho, como consentimento, sigilo, licenças ou uso de dados, e como foram resolvidas."],[585,"Ética","Como avalia as consequências das suas escolhas?","emd",2,"Mostre que você pensou no efeito das escolhas sobre as pessoas, o ambiente ou as instituições envolvidas."],[589,"Ética","Que responsabilidades acompanham sua contribuição?","emd",2,"Diga que cuidados o uso do seu resultado exige, para que ele não seja mal interpretado ou mal aplicado."],[593,"Ética","Como garantir respeito às pessoas e contextos envolvidos quando pertinente?","temd",2,"Explique como garantiu o respeito aos participantes e ao contexto, como sigilo, consentimento e devolução dos resultados."],[597,"Ética","Como lidaria com um conflito ético relacionado ao trabalho?","emd",3,"Descreva o que faria diante de um conflito ético, como consultar o comitê, o orientador e as normas, antes de seguir."],[601,"Integridade","Como assegura a atribuição adequada das ideias utilizadas?","temd",1,"Diga que todas as ideias de outros autores estão citadas e que você confere as citações com a fonte original."],[605,"Integridade","Como diferencia sua contribuição das contribuições de terceiros?","temd",2,"Separe com clareza o que veio da literatura do que é análise ou conclusão sua."],[609,"Integridade","Que cuidados adota para evitar distorções de fontes?","emd",2,"Diga que você consultou a fonte original sempre que possível e evitou citar de segunda mão."],[613,"Integridade","Como documenta decisões importantes?","emd",2,"Explique como registrou as decisões, por exemplo em caderno de campo, versões do arquivo ou notas de análise."],[617,"Integridade","Como agiria diante da identificação de um erro relevante?","temd",2,"Diga que corrigiria e comunicaria o erro com transparência, mesmo que isso mudasse a conclusão."],[621,"Transparência","Como permite que outras pessoas compreendam seu percurso?","emd",2,"Mostre que o texto descreve o caminho com detalhes suficientes para outra pessoa seguir e entender cada etapa."],[625,"Transparência","Que informações precisam estar explícitas no trabalho?","emd",2,"Cite o que não pode faltar no texto: critérios, fontes, procedimentos, limitações e decisões de análise."],[629,"Transparência","Como justificaria escolhas que não são imediatamente evidentes?","emd",2,"Escolha uma decisão que pode parecer estranha e explique o raciocínio por trás dela."],[633,"Transparência","Que aspecto exige documentação mais clara?","emd",2,"Reconheça uma parte do método ou da análise que poderia estar mais bem documentada."],[637,"Transparência","Como torna verificáveis suas afirmações quando possível?","md",2,"Diga como alguém pode conferir o que você afirma, por exemplo pelos dados disponíveis, pelas fontes citadas ou pelo código."],[641,"Viabilidade","O que torna o trabalho viável?","te",1,"Cite o que torna o trabalho possível: acesso aos dados ou ao campo, tempo, orientação e recursos."],[645,"Viabilidade","Que obstáculo poderia comprometer sua execução?","te",2,"Aponte o maior risco à execução e o plano para contorná-lo."],[649,"Viabilidade","Como adequou o escopo aos recursos disponíveis?","tem",2,"Mostre que o tamanho do trabalho foi ajustado ao tempo e aos recursos, sem perder a pergunta central."],[653,"Viabilidade","Que prioridade estabeleceria diante de restrições?","tem",2,"Diga o que é essencial e o que você cortaria primeiro se faltasse tempo ou recurso."],[657,"Viabilidade","Que condição é essencial para a continuidade do trabalho?","tem",2,"Diga a condição de que o trabalho mais depende, como um dado, uma autorização ou uma parceria."],[661,"Alcance","Até onde suas afirmações podem ser estendidas?","emd",2,"Diga para que casos, lugares ou grupos o resultado vale, e onde ele deixa de valer."],[665,"Alcance","Em quais circunstâncias sua abordagem pode não ser adequada?","md",3,"Descreva uma situação em que a sua abordagem não funcionaria bem e por quê."],[669,"Alcance","Como caracteriza o alcance da contribuição?","emd",2,"Diga se a contribuição é local, regional ou geral, e se é teórica, metodológica ou prática."],[673,"Alcance","Que cuidado é necessário ao transportar suas ideias para outro contexto?","md",3,"Explique o que precisaria ser verificado antes de aplicar as suas ideias em outro lugar ou grupo."],[677,"Alcance","Como diferencia relevância ampla de aplicabilidade universal?","md",3,"Mostre que um resultado pode interessar a muitos sem valer para todos os casos. Dê um exemplo dessa diferença."],[681,"Contribuição","Qual é a contribuição mais importante do trabalho?","temd",1,"Diga a contribuição principal em uma frase. É o que fica de novo depois do trabalho."],[685,"Contribuição","Como explicaria o valor da contribuição a um colega de outra área?","temd",2,"Explique a contribuição em linguagem simples, com um exemplo que alguém de fora entenderia."],[689,"Contribuição","Que aspecto da contribuição merece maior reconhecimento?","emd",2,"Aponte a parte da contribuição que você acha mais valiosa e diga por quê."],[693,"Contribuição","Como sua contribuição complementa o conhecimento existente?","emd",2,"Mostre o que já se sabia e o que o seu trabalho acrescenta a esse conhecimento."],[697,"Contribuição","Que diferença faria a ausência deste trabalho na discussão?","md",3,"Diga o que continuaria desconhecido ou sem solução se o trabalho não existisse."],[701,"Implicações","Que implicações decorrem da sua abordagem?","emd",2,"Diga o que muda, na prática ou na pesquisa, por causa do caminho que você escolheu."],[705,"Implicações","Qual consequência do trabalho considera mais relevante?","temd",2,"Escolha a consequência mais importante do resultado e diga para quem ela importa."],[709,"Implicações","Que implicação merece ser examinada com cautela?","md",3,"Aponte uma implicação que pode ser exagerada se mal lida e diga como você a apresentaria com cuidado."],[713,"Implicações","Como suas ideias podem influenciar discussões futuras?","emd",2,"Diga que perguntas ou debates o trabalho pode abrir ou reforçar."],[717,"Implicações","Que consequência não pretendida poderia surgir?","md",3,"Pense em um uso indevido ou efeito indesejado do resultado e como evitá-lo."],[721,"Aplicabilidade","Em que situações o conhecimento produzido poderia ser útil?","temd",1,"Cite situações concretas em que o resultado ajudaria alguém a decidir ou agir."],[725,"Aplicabilidade","Que condições seriam necessárias para aproveitar sua contribuição?","emd",2,"Diga o que seria preciso para aplicar o resultado, como recursos, formação, dados ou vontade institucional."],[729,"Aplicabilidade","Como avalia a possibilidade de uso das ideias apresentadas?","emd",2,"Avalie com realismo se o resultado pode ser usado agora e por quem."],[733,"Aplicabilidade","Que barreiras poderiam limitar seu aproveitamento?","emd",2,"Aponte uma barreira real, como custo, acesso ou resistência, e uma forma de superá-la."],[737,"Aplicabilidade","Como distingue valor conceitual de aplicação prática?","md",3,"Explique que o valor conceitual ajuda a entender, e a aplicação ajuda a agir. Diga onde o seu trabalho contribui mais."],[741,"Comunicação","Como explicaria o trabalho a alguém sem formação na área?","temd",1,"Explique o trabalho em três frases simples, sem siglas, com um exemplo do dia a dia."],[745,"Comunicação","Qual mensagem deseja que a banca retenha?","temd",1,"Escolha uma mensagem principal, em uma frase, e repita essa ideia no fim da apresentação."],[749,"Comunicação","Que termo exigiria explicação para um público não especializado?","temd",1,"Escolha o termo técnico mais importante e prepare uma explicação curta e simples para ele."],[753,"Comunicação","Como simplificaria a apresentação sem perder precisão?","temd",2,"Diga o que você cortaria e o que manteria. Simplificar é escolher, sem trocar o sentido."],[757,"Comunicação","Que aspecto da comunicação poderia ser aprimorado?","temd",2,"Reconheça um ponto da apresentação ou do texto que pode ficar mais claro e diga como faria."],[761,"Estrutura textual","Como justificaria a organização do texto?","temd",2,"Explique a lógica da ordem dos capítulos e como ela leva o leitor até a conclusão."],[765,"Estrutura textual","Que parte do texto é indispensável para entender a proposta?","temd",2,"Aponte a parte que o leitor não pode pular e diga por quê."],[769,"Estrutura textual","Como garante continuidade entre as seções?","emd",2,"Mostre que cada seção retoma a anterior e prepara a próxima, por exemplo com frases de ligação."],[773,"Estrutura textual","Que conteúdo poderia ser reorganizado?","temd",2,"Indique um trecho que ficaria melhor em outro lugar e diga o motivo."],[777,"Estrutura textual","Como avaliaria a clareza da redação?","temd",2,"Avalie com franqueza a clareza do texto e diga o que você revisou para melhorar."],[781,"Síntese","Como resumiria o trabalho em uma frase?","temd",1,"Resuma em uma frase com o que foi feito, como e o principal resultado. Treine até caber em uma respiração."],[785,"Síntese","Quais ideias são indispensáveis em uma síntese do trabalho?","temd",1,"Diga as três ideias que não podem faltar: o problema, o principal resultado e a contribuição."],[789,"Síntese","Como distinguiria o essencial do acessório?","emd",2,"Mostre que você sabe o que é central para a conclusão e o que é detalhe de apoio."],[793,"Síntese","Que ponto não deveria ser omitido em um resumo?","temd",1,"Aponte o ponto que, se omitido, mudaria a compreensão do trabalho."],[797,"Síntese","Como sintetizaria a contribuição sem exagerá-la?","emd",2,"Diga a contribuição sem adjetivos exagerados e com a delimitação certa de alcance."],[801,"Reflexão crítica","Qual é o ponto mais vulnerável do trabalho?","emd",3,"Aponte o ponto mais frágil com honestidade e diga como você o defende ou o tornaria mais forte."],[805,"Reflexão crítica","Que crítica considera especialmente pertinente?","emd",3,"Escolha uma crítica que você aceita e diga o que faria com ela."],[809,"Reflexão crítica","Que aspecto defenderia com maior segurança?","temd",2,"Diga a parte do trabalho de que você tem mais certeza e por quê."],[813,"Reflexão crítica","O que mudaria se pudesse recomeçar?","temd",2,"Cite uma ou duas mudanças concretas e o que elas permitiriam. Mostre aprendizado, e não arrependimento."],[817,"Reflexão crítica","Como responde a uma discordância fundamentada?","emd",3,"Mostre que você ouve, reconhece o que há de válido na crítica e responde com evidência, sem ficar na defensiva."],[821,"Aprendizagem","O que aprendeu durante a elaboração do trabalho?","temd",1,"Diga um aprendizado sobre o tema e um sobre fazer pesquisa."],[825,"Aprendizagem","Que habilidade precisou desenvolver?","temd",1,"Cite uma habilidade concreta, como uma técnica, um programa, a escrita ou a análise, e como ela foi útil."],[829,"Aprendizagem","Que ideia precisou reconsiderar?","temd",2,"Conte uma ideia que você tinha no começo e que mudou com os dados ou com a leitura."],[833,"Aprendizagem","Como o trabalho modificou sua compreensão do tema?","temd",2,"Diga como você enxergava o tema antes e como enxerga agora."],[837,"Aprendizagem","Que aprendizado considera transferível para outros trabalhos?","temd",2,"Aponte um aprendizado que você levaria para qualquer trabalho futuro."],[841,"Autonomia","Como demonstra domínio sobre as escolhas realizadas?","emd",2,"Mostre que você sabe explicar o porquê de cada escolha sem depender do orientador."],[845,"Autonomia","Que decisão exigiu maior autonomia?","emd",2,"Conte uma decisão que você tomou por conta própria e como chegou a ela."],[849,"Autonomia","Como diferencia orientação recebida de elaboração própria?","emd",2,"Reconheça a contribuição do orientador e diga o que foi elaboração sua."],[853,"Autonomia","Que aspecto consegue defender independentemente de apoio externo?","temd",2,"Aponte a parte que você domina a ponto de defender sozinho diante de qualquer pergunta."],[857,"Autonomia","Como buscou superar dificuldades de compreensão?","temd",1,"Conte como você estudou o que não sabia, como leituras, cursos, colegas ou testes."],[861,"Interdisciplinaridade","Que diálogo c
