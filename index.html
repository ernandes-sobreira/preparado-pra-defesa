os resultados?","md",3,"Se os dois derem significativos, a diferença pode ser de dispersão e não de centro. Interprete com cuidado."],[2361,"PERMANOVA e PERMDISP","Por que tamanhos amostrais desiguais exigem atenção especial quando as dispersões multivariadas diferem?","md",3,"Com grupos desiguais e dispersões diferentes, a PERMANOVA fica menos confiável."],[2362,"PERMANOVA e PERMDISP","Como definiria o esquema de permutações quando as amostras pertencem aos mesmos locais ou indivíduos?","md",3,"Restrinja as permutações dentro dos locais ou indivíduos."],[2363,"PERMANOVA e PERMDISP","Como interpretaria o R² de uma PERMANOVA em relação à parcela de variação atribuída a um fator?","md",3,"O R² mostra a fração da variação atribuída ao fator."],[2364,"PERMANOVA e PERMDISP","Como conduziria comparações par a par após uma PERMANOVA com vários grupos, considerando a multiplicidade?","md",3,"Faça PERMANOVAs par a par com correção para múltiplos testes."],[2365,"PERMANOVA e PERMDISP","Se a conclusão variar ao trocar Bray-Curtis por outra dissimilaridade, como justificaria a escolha final sem selecionar apenas a análise significativa?","md",3,"Justifique a dissimilaridade pela natureza dos dados, antes de ver os resultados, e relate se outras dão resultados diferentes."],[2366,"GAM e modelos não lineares","Como você demonstraria que uma função suavizada é mais adequada que uma relação linear para explicar a resposta?","md",3,"Compare o modelo linear e o GAM pelo AIC ou pelo teste de razão de verossimilhança, e mostre a curva com intervalo."],[2367,"GAM e modelos não lineares","Qual o papel da penalização de suavidade em um GAM e como ela contribui para evitar sobreajuste?","md",3,"A penalização evita curvas muito onduladas, equilibrando ajuste e suavidade."],[2368,"GAM e modelos não lineares","Como interpretaria os graus de liberdade efetivos de um termo suavizado?","md",3,"Os graus de liberdade efetivos mostram a complexidade da curva. Perto de 1 indica relação quase linear."],[2369,"GAM e modelos não lineares","Se um termo suavizado tiver poucos dados em uma extremidade do domínio, como avaliaria a confiabilidade da curva nessa região?","md",3,"Com poucos dados nos extremos, a curva é incerta. Mostre os dados e o intervalo de confiança."],[2370,"GAM e modelos não lineares","Como diagnosticaria concurvidade entre termos de um GAM e quais consequências ela teria para a interpretação?","md",3,"A concurvidade é a versão não linear da colinearidade. Torna as curvas instáveis. Verifique com as funções do pacote."],[2371,"GAM e modelos não lineares","Como compararia uma curva logística de crescimento com uma curva exponencial considerando mecanismos e limites biológicos ou físicos?","emd",3,"A exponencial cresce sem limite. A logística tem um teto. Escolha pelo mecanismo e pela capacidade de suporte."],[2372,"GAM e modelos não lineares","Se um modelo não linear depender fortemente dos valores iniciais dos parâmetros, como verificaria a estabilidade da solução?","md",3,"Teste valores iniciais diferentes e veja se os parâmetros convergem para os mesmos valores."],[2373,"GAM e modelos não lineares","Como estimaria e comunicaria a incerteza de um ponto de mudança em uma regressão segmentada?","md",3,"Estime o ponto de mudança com intervalo de confiança, por bootstrap ou verossimilhança."],[2374,"GAM e modelos não lineares","Por que a extrapolação de uma função suavizada pode ser especialmente problemática fora da faixa amostrada?","md",3,"Fora da faixa dos dados, a curva não tem informação e pode assumir qualquer forma."],[2375,"GAM e modelos não lineares","Como incorporaria sazonalidade por meio de uma função suavizada cíclica e quais limites temporais precisariam ser definidos?","md",3,"Use um suavizador cíclico, cujas extremidades se encontram. Defina o início e o fim do ciclo."],[2376,"Seleção e validação de modelos","Como diferenciaria seleção de modelos orientada por hipóteses de seleção automatizada orientada pelos dados?","md",3,"A seleção por hipóteses compara modelos que representam ideias científicas. A automática escolhe pelos dados e corre o risco de achar padrões por acaso."],[2377,"Seleção e validação de modelos","Por que modelos comparados por AIC precisam ser ajustados a dados e verossimilhanças comparáveis?","md",3,"O AIC só compara modelos ajustados aos mesmos dados e com a mesma resposta."],[2378,"Seleção e validação de modelos","Como interpretaria uma diferença pequena de AIC entre dois modelos com complexidades distintas?","md",3,"Diferenças de AIC menores que 2 indicam modelos com suporte parecido. Prefira o mais simples ou use média de modelos."],[2379,"Seleção e validação de modelos","Em que condições o AICc seria preferível ao AIC convencional?","md",3,"Use o AICc quando a amostra é pequena em relação ao número de parâmetros."],[2380,"Seleção e validação de modelos","Como explicaria a diferença entre os objetivos de seleção por AIC e BIC?","md",3,"O AIC busca o melhor modelo para previsão. O BIC penaliza mais a complexidade e tende a modelos mais simples."],[2381,"Seleção e validação de modelos","Por que selecionar variáveis por métodos stepwise e depois interpretar valores de p convencionais pode gerar inferência excessivamente otimista?","md",3,"O stepwise testa muitos modelos, e os valores de p ficam otimistas. Relate essa limitação."],[2382,"Seleção e validação de modelos","Como evitaria vazamento de informações entre os conjuntos de treinamento e validação durante a seleção de variáveis?","md",3,"Faça a seleção de variáveis só nos dados de treino, dentro da validação cruzada."],[2383,"Seleção e validação de modelos","Se os dados apresentarem estrutura espacial ou temporal, por que uma divisão aleatória para validação cruzada pode superestimar o desempenho?","md",3,"Observações próximas são parecidas. Separar ao acaso deixa dados parecidos no treino e no teste, o que superestima o desempenho."],[2384,"Seleção e validação de modelos","Como escolheria entre métricas de erro absoluto, erro quadrático e outras medidas de desempenho preditivo?","md",3,"O erro quadrático penaliza mais os erros grandes. O absoluto é mais robusto. Escolha pelo custo dos erros na prática."],[2385,"Seleção e validação de modelos","Como demonstraria que um modelo é simultaneamente adequado aos objetivos científicos e suficientemente robusto para o uso pretendido?","md",3,"Mostre que o modelo responde à pergunta, que os resíduos estão adequados e que a validação confirma o desempenho."],[2386,"Delineamento e amostragem","Qual é a verdadeira unidade de replicação do seu estudo e como ela determina o tamanho amostral efetivo?","temd",2,"A unidade de replicação é a menor unidade que recebe o tratamento de forma independente. Ela define o tamanho real da amostra."],[2387,"Delineamento e amostragem","Se você coletar diversas subamostras de uma mesma unidade experimental, por que elas não equivalem necessariamente a réplicas independentes?","temd",2,"Subamostras da mesma unidade medem a variação dentro dela. São pseudorréplicas, e não réplicas independentes."],[2388,"Delineamento e amostragem","Como justificaria o tamanho amostral considerando a magnitude do efeito relevante, a variabilidade e a precisão desejada?","emd",2,"Use análise de poder com o efeito mínimo relevante, a variabilidade esperada e o nível de significância."],[2389,"Delineamento e amostragem","Qual o papel da randomização na redução do confundimento e por que ela não substitui a replicação?","temd",2,"A randomização distribui fatores desconhecidos ao acaso entre os grupos. A replicação permite estimar a variação. Uma não substitui a outra."],[2390,"Delineamento e amostragem","Como o bloqueamento pode aumentar a precisão das comparações e quais características justificariam sua adoção?","emd",2,"O bloco agrupa unidades parecidas e retira essa variação do erro. Use quando há heterogeneidade conhecida."],[2391,"Delineamento e amostragem","Se o estudo for observacional, como você selecionaria covariáveis para controlar confundimento sem ajustar mediadores ou colisores indevidamente?","md",3,"Use um diagrama causal. Controle confundidores e não controle mediadores nem colisores."],[2392,"Delineamento e amostragem","Como um delineamento antes-depois com controle pode ajudar a distinguir efeitos de uma intervenção de mudanças temporais gerais?","md",3,"O controle mostra a mudança que ocorreria sem a intervenção. A diferença entre as mudanças estima o efeito."],[2393,"Delineamento e amostragem","Se a seleção das unidades depender do desfecho estudado, quais vieses podem surgir na interpretação das associações?","md",3,"Selecionar pelo desfecho cria associações falsas, o chamado viés de seleção."],[2394,"Delineamento e amostragem","Como a amostragem por conglomerados influencia os erros-padrão e a representatividade das estimativas?","md",3,"Observações do mesmo conglomerado são parecidas, o que aumenta os erros-padrão. Use análise que considere o desenho."],[2395,"Delineamento e amostragem","Se o estudo utilizar amostras de conveniência, quais limites estabeleceria para a generalização dos resultados à população de interesse?","temd",2,"Amostras de conveniência não representam a população. Limite as conclusões ao grupo estudado."],[2396,"Interpretação e inferência estatística","Se um resultado apresentar p = 0,03, como explicaria seu significado sem afirmar que a hipótese nula tem 3% de probabilidade de ser verdadeira?","temd",2,"O p é a probabilidade de observar dados tão extremos se a hipótese nula fosse verdadeira. Não é a probabilidade de a nula ser verdadeira."],[2397,"Interpretação e inferência estatística","Se um efeito for estatisticamente significativo, mas menor que a diferença considerada relevante na área, como formularia a conclusão científica?","temd",2,"Diga que existe diferença estatística, mas que ela é pequena demais para ter importância prática."],[2398,"Interpretação e inferência estatística","Como interpretaria corretamente um intervalo de confiança frequentista de 95% sem atribuir probabilidade posterior ao parâmetro fixo?","emd",3,"O intervalo de 95% vem de um procedimento que captura o parâmetro em 95% das repetições. Não é a probabilidade de o parâmetro estar nesse intervalo específico."],[2399,"Interpretação e inferência estatística","Se os resultados mudarem após diferentes decisões analíticas defensáveis, como comunicaria essa incerteza sem omitir resultados inconvenientes?","md",3,"Relate as análises alternativas e mostre como os resultados variam, sem esconder as que não deram significativo."],[2400,"Interpretação e inferência estatística","Quais dados, códigos, versões de programas e decisões analíticas disponibilizaria para permitir que outro pesquisador reproduzisse integralmente suas análises?","emd",2,"Disponibilize dados, código, versões dos programas e as decisões tomadas, por exemplo em um repositório público."]];
const ESP = {"Ciências Exatas e da Terra":{"Matemática":[[1001,"Como você demonstraria que as hipóteses de um teorema são necessárias?","emd",3,"Mostre um caso em que, retirada uma hipótese, a conclusão falha. Um contraexemplo que viola só aquela hipótese prova que ela é necessária."],[1002,"Como você construiria um contraexemplo para uma generalização indevida?","temd",2,"Procure o caso mais simples que satisfaz as condições da generalização e ainda assim contraria a conclusão. Um único contraexemplo derruba uma afirmação geral."],[1003,"Como você distinguiria condição necessária de condição suficiente?","te",1,"Necessária é a condição sem a qual o resultado não ocorre. Suficiente é a que garante o resultado. Dê um exemplo do seu trabalho para cada uma."],[1004,"Como você verificaria a validade de uma demonstração por indução?","te",2,"Confira a base, que vale para o primeiro caso, e o passo, em que supor o caso n leva ao caso n mais 1. A falha mais comum está no passo."],[1005,"Como você identificaria circularidade em uma demonstração?","emd",2,"Verifique se a conclusão foi usada, direta ou indiretamente, como premissa. Se o raciocínio supõe o que quer provar, ele é circular."],[1006,"Como você estabeleceria a existência de uma solução?","emd",3,"Cite o argumento usado, como um teorema de ponto fixo, o valor intermediário ou uma construção explícita, e diga por que as hipóteses dele valem no seu caso."],[1007,"Como você caracterizaria a convergência de uma sequência?","te",2,"Diga para qual valor a sequência se aproxima e como você mostra isso, pela definição com épsilon ou por um critério conhecido, como o de Cauchy ou o da monotonicidade limitada."],[1008,"Como você distinguiria convergência uniforme de pontual?","tem",3,"Na convergência pontual cada ponto pode exigir um índice diferente. Na uniforme, um mesmo índice serve para todos os pontos. Diga qual delas o seu resultado precisa e por quê."],[1009,"Como você avaliaria a estabilidade de uma solução numérica?","emd",3,"Mostre que pequenos erros de arredondamento ou de dados não crescem sem controle durante as iterações. Cite o critério de estabilidade do método e o teste que você fez."],[1010,"Como você estimaria o erro de truncamento?","temd",2,"Explique que o erro de truncamento vem de interromper um processo infinito, como uma série ou um passo de discretização, e mostre como ele diminui quando o passo diminui."],[1011,"Como você identificaria invariantes de uma transformação?","emd",3,"Procure grandezas que não mudam quando a transformação é aplicada. Elas ajudam a classificar casos e a provar que algo é impossível."],[1012,"Como você relacionaria uma estrutura algébrica a suas propriedades?","md",3,"Diga quais axiomas a estrutura satisfaz e que propriedades decorrem deles. Mostre como isso foi usado no seu resultado."],[1013,"Como você justificaria uma passagem ao limite?","emd",3,"Diga qual teorema garante a troca entre limite e outra operação, como integral ou derivada, por exemplo convergência dominada ou uniforme, e por que as condições valem."],[1014,"Como você investigaria a regularidade de uma função?","emd",3,"Diga o grau de regularidade necessário, como continuidade ou diferenciabilidade, e como você o verificou."],[1015,"Como você escolheria entre demonstração construtiva e não construtiva?","md",3,"Uma prova construtiva exibe o objeto, e a não construtiva só garante que ele existe. Diga qual você usou e se a construção explícita traria algo a mais."],[1016,"Como você avaliaria a complexidade de um procedimento matemático?","emd",2,"Diga como o número de operações cresce com o tamanho do problema e compare com alternativas conhecidas."],[1017,"Como você estenderia um resultado sem violar suas hipóteses?","md",3,"Mostre quais hipóteses você relaxou e por que o argumento continua valendo. Se alguma hipótese cair, aponte o ponto exato em que a prova falharia."]],"Estatística":[[1018,"Como você distinguiria significância estatística de relevância prática?","temd",2,"Significância diz se o efeito provavelmente não é zero. Relevância diz se o tamanho do efeito importa na prática. Mostre o tamanho do efeito com o seu intervalo."],[1019,"Como você avaliaria a independência das observações?","temd",2,"Diga se as unidades foram amostradas de forma que uma não influencia a outra, considerando proximidade no espaço, no tempo ou no mesmo indivíduo, e como tratou a dependência."],[1020,"Como você identificaria pseudorreplicação?","temd",3,"Pseudorreplicação ocorre quando medidas da mesma unidade são tratadas como réplicas independentes. Diga qual é a sua unidade experimental real."],[1021,"Como você interpretaria um intervalo de confiança?","te",2,"O intervalo de 95% indica a faixa de valores compatíveis com os dados pelo procedimento usado. Evite dizer que há 95% de chance de o valor verdadeiro estar ali."],[1022,"Como você avaliaria heterocedasticidade?","temd",2,"Heterocedasticidade é a variância dos resíduos mudar com os valores ajustados. Mostre o gráfico de resíduos e diga como corrigiu, por transformação ou modelo adequado."],[1023,"Como você justificaria o tamanho amostral?","temd",2,"Diga como o tamanho foi definido: cálculo de poder, referência da literatura ou limite prático. Se foi limite prático, discuta o efeito mínimo que a amostra consegue detectar."],[1024,"Como você interpretaria a potência de um teste?","emd",2,"Poder é a chance de detectar um efeito que existe. Com poder baixo, um resultado não significativo não prova ausência de efeito."],[1025,"Como você trataria comparações múltiplas?","emd",2,"Diga quantos testes fez e como controlou o risco de falsos positivos, por exemplo com Bonferroni, Holm ou taxa de falsas descobertas."],[1026,"Como você diagnosticaria multicolinearidade?","emd",2,"Mostre como verificou, por correlação entre preditores ou fator de inflação da variância, e o que fez, como retirar ou combinar variáveis."],[1027,"Como você avaliaria dados ausentes não aleatoriamente?","md",3,"Dados ausentes não aleatórios dependem do próprio valor que falta e podem viesar o resultado. Diga como investigou o padrão e que análise de sensibilidade fez."],[1028,"Como você identificaria pontos influentes em uma regressão?","emd",2,"Mostre os diagnósticos usados, como alavancagem e distância de Cook, e se o resultado muda sem esses pontos."],[1029,"Como você compararia modelos por critérios de informação?","md",3,"Explique o critério, por exemplo AIC ou BIC, que equilibra ajuste e complexidade. Diga o que fez quando modelos ficaram próximos."],[1030,"Como você validaria um modelo preditivo fora da amostra?","emd",3,"Diga como testou o modelo em dados que ele não viu, por validação cruzada ou separação treino e teste, e que métrica usou."],[1031,"Como você justificaria a escolha de efeitos fixos e aleatórios?","md",3,"Efeito aleatório é usado quando os grupos representam uma população maior e você quer generalizar. Efeito fixo, quando o interesse está nos grupos em si. Justifique pela pergunta."],[1032,"Como você avaliaria a sensibilidade a distribuições a priori?","md",3,"Mostre que testou outras distribuições a priori plausíveis e se as conclusões se mantiveram."],[1033,"Como você interpretaria um intervalo de credibilidade?","emd",3,"O intervalo de credibilidade diz que, dados o modelo e a priori, o parâmetro está ali com a probabilidade indicada. Mostre essa leitura no seu caso."],[1034,"Como você distinguiria superdispersão de excesso de zeros?","md",3,"Superdispersão é variância maior que a esperada pelo modelo. Excesso de zeros é haver mais zeros do que a distribuição prevê. Diga qual teste ou gráfico usou e qual modelo adotou."],[1035,"Como você quantificaria a incerteza de uma estimativa por reamostragem?","emd",3,"Explique o bootstrap ou outra reamostragem: repetir a estimativa em muitas amostras sorteadas dos seus dados para medir a variação."]],"Física":[[1036,"Como você determinaria quais leis de conservação se aplicam a um sistema?","temd",2,"Diga se o sistema é fechado ou aberto e que grandezas se conservam nele, como energia, massa ou momento, justificando pelas condições do problema."],[1037,"Como você justificaria uma aproximação de regime estacionário?","emd",2,"Mostre que as variáveis mudam pouco no tempo na escala de interesse, ou que o tempo de transição é curto diante do período estudado."],[1038,"Como você identificaria os graus de liberdade relevantes?","emd",3,"Diga quais variáveis independentes descrevem o sistema e por que outras podem ser ignoradas na escala do problema."],[1039,"Como você avaliaria a validade de uma aproximação linear?","temd",2,"Mostre que as perturbações são pequenas o bastante para os termos não lineares serem desprezíveis, e em que faixa isso deixa de valer."],[1040,"Como você distinguiria incerteza instrumental de variabilidade física?","te",2,"A incerteza instrumental vem do aparelho e do procedimento. A variabilidade física é diferença real do fenômeno. Diga como você separou as duas."],[1041,"Como você interpretaria a simetria de um sistema?","emd",3,"Diga que simetria o sistema tem e que consequência ela traz, como conservação de uma grandeza ou simplificação das equações."],[1042,"Como você avaliaria a consistência dimensional de uma equação?","te",1,"Confira se as unidades dos dois lados da equação são as mesmas. Uma inconsistência dimensional indica erro na equação."],[1043,"Como você identificaria regimes em que efeitos não lineares dominam?","emd",3,"Indique a grandeza ou o número adimensional que marca a passagem para o regime não linear e a faixa do seu trabalho."],[1044,"Como você explicaria a dissipação de energia?","te",2,"Diga para onde a energia vai, como calor por atrito ou viscosidade, e como isso aparece nas suas medidas ou equações."],[1045,"Como você relacionaria entropia à irreversibilidade?","tem",2,"A entropia de um sistema isolado não diminui. Processos irreversíveis a aumentam. Dê um exemplo do seu sistema."],[1046,"Como você distinguiria equilíbrio térmico de equilíbrio dinâmico?","te",2,"Equilíbrio térmico é temperatura igual sem fluxo de calor. Equilíbrio dinâmico é quando processos opostos ocorrem com taxas iguais. Diga qual se aplica."],[1047,"Como você justificaria a escolha de um referencial?","te",1,"Justifique pelo que simplifica as equações ou pelo que é natural no problema, e diga se o referencial é inercial."],[1048,"Como você avaliaria a influência de efeitos de escala?","emd",2,"Diga se as leis ou parâmetros mudam com o tamanho do sistema e como você verificou ou contornou isso."],[1049,"Como você investigaria a estabilidade de um estado de equilíbrio?","emd",3,"Mostre o que acontece após uma pequena perturbação: o sistema volta ao equilíbrio ou se afasta? Cite o critério usado."],[1050,"Como você estimaria a ordem de grandeza de uma grandeza física?","te",1,"Use valores típicos e potências de dez para chegar a uma estimativa rápida, e compare com o valor medido."],[1051,"Como você distinguiria uma previsão clássica de uma quântica?","tem",3,"Mostre a escala do problema, pela comparação com a constante de Planck ou o comprimento de onda envolvido, e diga por que a descrição clássica basta ou não."],[1052,"Como você avaliaria a propagação de erros em medidas indiretas?","temd",2,"Explique como as incertezas das grandezas medidas se combinam na grandeza calculada, por derivadas parciais ou simulação."],[1053,"Como você confrontaria uma previsão teórica com observações experimentais?","temd",2,"Compare a previsão com os dados levando em conta as incertezas de ambos. Diga se a diferença é significativa."]],"Química":[[1054,"Como você justificaria a escolha de um método de identificação química?","temd",2,"Justifique pela seletividade, pela sensibilidade, pela matriz da amostra e pela disponibilidade, e diga como validou a identificação."],[1055,"Como você avaliaria a seletividade de uma reação?","emd",2,"Diga a proporção do produto desejado em relação aos secundários e as condições que favorecem essa escolha."],[1056,"Como você distinguiria controle cinético de termodinâmico?","tem",3,"Controle cinético favorece o produto que se forma mais rápido. Controle termodinâmico favorece o mais estável. Diga qual governou a sua reação e por quê."],[1057,"Como você explicaria o efeito do pH na especiação?","temd",2,"Mostre como o pH muda a forma química predominante da espécie, por ganho ou perda de prótons, e o efeito disso no comportamento."],[1058,"Como você identificaria interferentes em uma matriz analítica?","emd",2,"Diga que componentes da matriz podem afetar o sinal e como você os identificou, por adição de padrão ou comparação de matrizes."],[1059,"Como você avaliaria a pureza de um reagente?","te",1,"Cite a especificação do fabricante e qualquer teste de verificação feito, como ponto de fusão, espectro ou titulação."],[1060,"Como você interpretaria uma curva de calibração?","te",1,"Explique a relação entre sinal e concentração, a faixa linear e o coeficiente de determinação, e diga como verificou os resíduos."],[1061,"Como você distinguiria limite de detecção de limite de quantificação?","te",2,"O limite de detecção é a menor quantidade que se distingue do branco. O de quantificação, a menor que se mede com precisão aceitável. Dê os seus valores."],[1062,"Como você avaliaria a recuperação de um analito?","temd",2,"Diga a porcentagem recuperada de uma quantidade conhecida adicionada e o que ela indica sobre perdas ou interferências."],[1063,"Como você justificaria o uso de um branco analítico?","te",1,"O branco mostra o sinal que vem dos reagentes e do procedimento, sem o analito, e serve para corrigir as medidas."],[1064,"Como você interpretaria desvios da idealidade?","emd",3,"Diga em que condições o comportamento se afasta do ideal, como alta concentração ou interações fortes, e como corrigiu, por atividade ou coeficientes."],[1065,"Como você avaliaria a estabilidade de uma amostra durante o armazenamento?","temd",2,"Diga as condições de armazenamento, o tempo até a análise e se testou a perda ou a transformação do analito nesse período."],[1066,"Como você investigaria mecanismos de reação concorrentes?","md",3,"Diga como distinguiu os mecanismos, por cinética, intermediários ou marcação isotópica, e qual evidência foi decisiva."],[1067,"Como você relacionaria estrutura molecular a propriedades físico-químicas?","temd",2,"Ligue grupos funcionais, polaridade ou tamanho da molécula às propriedades observadas, com um exemplo do seu trabalho."],[1068,"Como você justificaria a escolha de um solvente?","te",1,"Justifique pela solubilidade, pela reatividade, pelo ponto de ebulição, pela segurança e pelo custo."],[1069,"Como você distinguiria precisão de exatidão?","te",1,"Precisão é a concordância entre repetições. Exatidão é a proximidade do valor verdadeiro. Uma medida pode ser precisa e inexata."],[1070,"Como você interpretaria evidências espectroscópicas de identidade molecular?","temd",2,"Diga quais espectros confirmam a estrutura, como infravermelho, RMN ou massas, e que sinais foram decisivos."],[1071,"Como você avaliaria riscos e resíduos de um procedimento químico?","te",1,"Cite os riscos dos reagentes, os equipamentos de proteção e o destino dos resíduos, conforme as normas."]],"Geociências":[[1072,"Como você distinguiria processos de intemperismo físico e químico?","te",1,"O intemperismo físico fragmenta a rocha sem mudar a composição. O químico altera os minerais. Diga qual predomina no seu caso e a evidência."],[1073,"Como você interpretaria relações estratigráficas?","temd",2,"Use o princípio da superposição e as relações de corte para ordenar as camadas no tempo."],[1074,"Como você avaliaria a representatividade espacial de amostras geológicas?","temd",2,"Diga como escolheu os pontos de amostragem e se eles cobrem a variabilidade da área."],[1075,"Como você justificaria um método de datação?","emd",2,"Justifique pelo material disponível, pela faixa de idade esperada e pela precisão necessária."],[1076,"Como você distinguiria idade de formação de idade de alteração mineral?","md",3,"Explique qual sistema isotópico ou mineral registra cada evento e como você separou os dois sinais."],[1077,"Como você interpretaria estruturas tectônicas?","temd",2,"Descreva as estruturas, como falhas e dobras, e o regime de esforço que elas indicam."],[1078,"Como você avaliaria a influência da litologia na permeabilidade?","temd",2,"Relacione porosidade, fraturamento e tipo de rocha à facilidade de fluxo da água."],[1079,"Como você reconstruiria processos deposicionais a partir de sedimentos?","temd",2,"Mostre como granulometria, estruturas sedimentares e fósseis indicam o ambiente e a energia de deposição."],[1080,"Como você identificaria fontes de erro em análises mineralógicas?","emd",2,"Cite erros de preparo, de identificação e de calibração, e como os controlou."],[1081,"Como você relacionaria relevo e processos erosivos?","te",2,"Ligue declividade, tipo de solo e cobertura à intensidade da erosão observada."],[1082,"Como você avaliaria a resolução de uma investigação geofísica?","emd",2,"Diga a menor estrutura detectável com o espaçamento e o método usados."],[1083,"Como você distinguiria anomalia geofísica de artefato instrumental?","emd",3,"Mostre se a anomalia se repete em medidas e métodos diferentes, e descarte fontes de ruído e erros de aquisição."],[1084,"Como você avaliaria a vulnerabilidade de um aquífero?","temd",2,"Cite o método, como DRASTIC ou GOD, os fatores considerados e as limitações."],[1085,"Como você justificaria a escolha de um modelo hidrogeológico?","emd",3,"Justifique pelos dados disponíveis, pela escala e pela pergunta, e diga como calibrou e validou o modelo."],[1086,"Como você identificaria evidências de transporte sedimentar?","te",2,"Use granulometria, arredondamento e estruturas sedimentares para indicar distância e tipo de transporte."],[1087,"Como você avaliaria a influência da escala temporal em processos geomorfológicos?","emd",3,"Mostre que processos lentos e rápidos aparecem em escalas diferentes e qual delas o seu dado alcança."],[1088,"Como você distinguiria perigo geológico de risco geológico?","te",1,"Perigo é o fenômeno que pode causar dano. Risco combina o perigo com a exposição e a vulnerabilidade de quem está ali."],[1089,"Como você interpretaria assinaturas geoquímicas de proveniência?","md",3,"Diga que elementos ou razões indicam a fonte do material e como compara com assinaturas de referência."]],"Computação e inteligência artificial":[[1090,"Como você evitaria vazamento de dados entre treino e teste?","temd",2,"Garanta que nada dos dados de teste foi usado no treino ou no ajuste, incluindo normalização e seleção de variáveis."],[1091,"Como você avaliaria o desbalanceamento entre classes?","temd",2,"Diga a proporção das classes e que métricas e técnicas usou, como F1, balanceamento ou pesos."],[1092,"Como você detectaria sobreajuste?","te",2,"Compare o desempenho no treino e na validação. Uma diferença grande indica sobreajuste."],[1093,"Como você justificaria a arquitetura de um modelo?","emd",2,"Justifique pelo tipo de dado, pela quantidade disponível e pela comparação com arquiteturas mais simples."],[1094,"Como você avaliaria a complexidade computacional de um algoritmo?","te",2,"Diga como o tempo e a memória crescem com o tamanho da entrada, por exemplo em notação O."],[1095,"Como você distinguiria desempenho médio de desempenho em casos extremos?","emd",2,"Mostre o desempenho nos piores casos ou nos grupos raros, além da média."],[1096,"Como você investigaria mudanças na distribuição dos dados?","md",3,"Compare as distribuições ao longo do tempo ou entre fontes e diga como o modelo reage a essas mudanças."],[1097,"Como você avaliaria a robustez contra entradas perturbadas?","md",3,"Teste com ruído ou alterações pequenas na entrada e mostre se a saída se mantém."],[1098,"Como você interpretaria a contribuição de atributos para uma previsão?","emd",3,"Cite o método usado, como SHAP ou importância por permutação, e os cuidados ao interpretar."],[1099,"Como você garantiria a reprodutibilidade de um treinamento?","temd",2,"Fixe sementes, versões e configurações, e guarde o código e os dados de cada experimento."],[1100,"Como você compararia um modelo com uma linha de base simples?","temd",2,"Compare com um modelo simples ou com uma regra trivial. O ganho real é a diferença sobre essa referência."],[1101,"Como você avaliaria a equidade entre grupos de usuários?","md",3,"Compare métricas entre grupos e diga que critério de equidade usou e por quê."],[1102,"Como você distinguiria explicabilidade de interpretabilidade?","md",3,"Interpretável é o modelo cuja lógica se entende diretamente. Explicável é o que precisa de um método externo para ser explicado."],[1103,"Como você controlaria a exposição de dados pessoais?","temd",2,"Cite anonimização, minimização de dados, controle de acesso e conformidade com a LGPD."],[1104,"Como você avaliaria a qualidade de rótulos de treinamento?","emd",2,"Diga como os rótulos foram feitos, a concordância entre anotadores e como tratou os erros."],[1105,"Como você justificaria a estratégia de ajuste de hiperparâmetros?","emd",2,"Diga o método de busca, como grade, aleatória ou bayesiana, e que dados usou para a escolha."],[1106,"Como você detectaria falhas silenciosas em produção?","md",3,"Cite monitoramento de entradas e saídas, alertas e reavaliação periódica com dados novos."],[1107,"Como você avaliaria a generalização para domínios não observados?","md",3,"Teste em dados de outra fonte ou contexto e discuta o que limita a generalização."]]},"Ciências Biológicas":{"Ecologia":[[1108,"Como você distinguiria riqueza de espécies de diversidade?","te",1,"Riqueza é o número de espécies. Diversidade combina riqueza e equitabilidade, ou seja, como os indivíduos se distribuem entre as espécies. Dê o índice que você usou."],[1109,"Como você avaliaria a detectabilidade de organismos?","emd",3,"Detectabilidade é a chance de registrar a espécie quando ela está presente. Diga se você a estimou, por exemplo com modelos de ocupação, ou como ela pode afetar os seus resultados."],[1110,"Como você separaria efeitos ambientais de efeitos espaciais?","md",3,"Diga como separou o efeito das variáveis ambientais do efeito da posição no espaço, por exemplo com partição de variância ou modelos com estrutura espacial."],[1111,"Como você identificaria pseudorreplicação em amostragens de campo?","temd",2,"Diga qual é a sua unidade amostral independente. Várias medidas no mesmo ponto, lago ou parcela não são réplicas independentes."],[1112,"Como você justificaria a escala de observação de processos ecológicos?","emd",2,"Mostre que o tamanho da unidade e a extensão da área combinam com a escala do processo que você estuda."],[1113,"Como você avaliaria mecanismos de coexistência?","md",3,"Cite o mecanismo, como partição de nicho, efeitos estabilizadores ou equalizadores, e a evidência do seu trabalho."],[1114,"Como você interpretaria mudanças na diversidade beta?","emd",3,"Diversidade beta é a diferença de composição entre locais. Diga se você separou substituição de espécies e perda de espécies."],[1115,"Como você distinguiria limitação por dispersão de filtragem ambiental?","md",3,"Mostre se a composição acompanha mais o ambiente ou a distância e a conectividade entre locais, e que análise permitiu essa separação."],[1116,"Como você avaliaria efeitos de borda?","te",2,"Mostre como as variáveis mudam com a distância da borda e até onde o efeito chega no seu sistema."],[1117,"Como você relacionaria conectividade a persistência populacional?","emd",2,"Ligue o fluxo de indivíduos entre manchas à chance de a população se manter ou se recuperar."],[1118,"Como você investigaria efeitos de perturbações recorrentes?","emd",2,"Diga a frequência e a intensidade das perturbações e o que acontece com a recuperação entre elas."],[1119,"Como você identificaria interações indiretas em redes tróficas?","md",3,"Mostre como uma espécie afeta outra por meio de uma terceira, como em cascatas tróficas, e a evidência que você tem."],[1120,"Como você avaliaria a importância da sazonalidade?","te",1,"Mostre a diferença entre estações nos seus dados e se as conclusões valem para o ano todo."],[1121,"Como você interpretaria densidade dependência no crescimento populacional?","emd",3,"Mostre se a taxa de crescimento cai quando a densidade aumenta e que modelo ou evidência sustenta isso."],[1122,"Como você separaria efeitos de composição e funcionamento ecossistêmico?","md",3,"Diga se a diferença de funcionamento vem de quais espécies estão presentes ou de quantas e em que proporção."],[1123,"Como você avaliaria a representatividade de áreas de referência?","emd",2,"Diga por que as áreas de referência representam a condição esperada e se são comparáveis às áreas estudadas."],[1124,"Como você distinguiria mudanças de estado de flutuações naturais?","md",3,"Mostre que a mudança supera a variação natural conhecida e persiste no tempo."]],"Genética e evolução":[[1125,"Como você distinguiria deriva genética de seleção natural?","tem",2,"A deriva é mudança ao acaso, mais forte em populações pequenas. A seleção depende do valor adaptativo. Diga que evidência separa as duas no seu caso."],[1126,"Como você interpretaria desequilíbrio de ligação?","emd",3,"Explique que alelos de locos diferentes aparecem juntos mais que o esperado ao acaso, e o que isso indica, como proximidade física ou seleção."],[1127,"Como você identificaria estruturação populacional?","emd",2,"Diga a análise usada, como FST, AMOVA ou agrupamento genético, e quantos grupos encontrou."],[1128,"Como você distinguiria homologia de analogia?","te",1,"Homologia é semelhança herdada de um ancestral comum. Analogia é semelhança por função parecida, sem ancestral comum. Dê um exemplo."],[1129,"Como você avaliaria evidências de adaptação local?","md",3,"Mostre que a população local tem melhor desempenho no próprio ambiente, por exemplo em experimentos recíprocos, ou sinais genéticos de seleção."],[1130,"Como você interpretaria fluxo gênico entre populações?","emd",2,"Diga como estimou o fluxo, por dados genéticos ou marcação, e o que ele indica sobre a conectividade."],[1131,"Como você distinguiria plasticidade fenotípica de variação hereditária?","te",2,"Plasticidade é o mesmo genótipo produzir fenótipos diferentes em ambientes diferentes. Variação hereditária passa para a prole. Diga como separou as duas."],[1132,"Como você justificaria marcadores moleculares?","emd",2,"Justifique pela taxa de variação do marcador, pela pergunta e pelo custo."],[1133,"Como você identificaria vieses em reconstruções filogenéticas?","md",3,"Cite vieses como atração de ramos longos e amostragem incompleta, e como testou a robustez da árvore."],[1134,"Como você distinguiria ortologia de paralogia?","md",3,"Ortólogos se separaram por especiação. Parálogos, por duplicação do gene. Diga como os identificou."],[1135,"Como você interpretaria sinais de seleção em sequências?","md",3,"Cite o teste usado, como a razão dN/dS, e o que o resultado indica."],[1136,"Como você avaliaria a influência de endogamia?","emd",2,"Diga como mediu a endogamia e se há sinais de depressão endogâmica."],[1137,"Como você estimaria a contribuição ambiental para um fenótipo?","emd",3,"Explique como separou componente genético e ambiental, por exemplo com herdabilidade em ambiente comum."],[1138,"Como você distinguiria convergência evolutiva de ancestralidade compartilhada?","md",3,"Mostre na filogenia que as linhagens com a característica não são próximas, o que indica origem independente."],[1139,"Como você avaliaria a qualidade de sequências genéticas?","temd",2,"Cite as métricas de qualidade, como escore de Phred e cobertura, e os filtros usados."],[1140,"Como você interpretaria discordâncias entre árvores gênicas e de espécies?","md",3,"Explique causas como separação incompleta de linhagens e hibridização, e como as tratou."],[1141,"Como você investigaria a interação entre genótipo e ambiente?","md",3,"Mostre se genótipos diferentes respondem de modo diferente aos ambientes, num desenho que cruza os dois fatores."],[1142,"Como você avaliaria limites de inferências sobre ancestralidade?","md",3,"Diga o que os dados permitem afirmar sobre ancestralidade e o que depende de suposições do modelo."]],"Biologia celular e molecular":[[1143,"Como você avaliaria a especificidade de um anticorpo?","emd",2,"Cite os controles, como knockout, bloqueio do peptídeo ou outro anticorpo, que mostram que ele reconhece só o alvo."],[1144,"Como você justificaria controles positivos e negativos em ensaios moleculares?","te",1,"O controle positivo mostra que o ensaio funciona. O negativo mostra que não há sinal falso. Diga quais usou."],[1145,"Como você distinguiria expressão gênica de abundância proteica?","tem",2,"A quantidade de RNA não garante a mesma quantidade de proteína, por regulação pós-transcricional. Diga o que você mediu."],[1146,"Como você avaliaria a integridade de RNA?","temd",2,"Diga o índice de integridade, como o RIN, e o limite aceito."],[1147,"Como você interpretaria diferenças entre transcrição e tradução?","te",2,"Transcrição produz RNA a partir do DNA. Tradução produz proteína a partir do RNA. Diga em que etapa o seu efeito ocorre."],[1148,"Como você avaliaria a eficiência de amplificação em PCR?","temd",2,"Diga a eficiência obtida pela curva padrão e se ficou na faixa aceita, perto de 90 a 110%."],[1149,"Como você identificaria contaminação cruzada?","te",1,"Cite controles sem amostra, separação de áreas e de etapas, e boas práticas de pipetagem."],[1150,"Como você distinguiria morte celular programada de necrose?","tem",2,"Morte programada é ordenada, como a apoptose. Necrose é descontrolada e inflamatória. Diga os marcadores usados."],[1151,"Como você interpretaria alterações na sinalização celular?","emd",3,"Mostre que via foi alterada e a evidência, como fosforilação ou expressão de alvos."],[1152,"Como você avaliaria a viabilidade de células em cultura?","te",2,"Diga o método, como azul de tripano ou MTT, e o valor de corte usado."],[1153,"Como você investigaria a localização subcelular de uma proteína?","emd",2,"Cite o método, como imunofluorescência ou fracionamento, e os marcadores de cada compartimento."],[1154,"Como você avaliaria a especificidade de uma intervenção genética?","emd",3,"Diga como verificou efeitos fora do alvo, por sequenciamento ou controles."],[1155,"Como você distinguiria alterações epigenéticas de mutações?","md",3,"Mutação altera a sequência do DNA. Alteração epigenética muda a expressão sem mudar a sequência. Diga como distinguiu as duas."],[1156,"Como você interpretaria efeitos dependentes da dose?","temd",2,"Mostre a curva dose resposta e se o efeito aumenta de forma consistente com a dose."],[1157,"Como você avaliaria o efeito do ciclo celular sobre medições?","md",3,"Diga se as células estavam sincronizadas e como a fase do ciclo pode alterar as medidas."],[1158,"Como você distinguiria interação molecular direta de associação indireta?","md",3,"Cite o ensaio que mostra contato físico direto, como pull-down com proteínas purificadas, e não apenas coocorrência."],[1159,"Como você avaliaria a reprodutibilidade entre linhagens celulares?","emd",2,"Diga se testou em mais de uma linhagem e se o efeito se repetiu."],[1160,"Como você relacionaria alterações moleculares a fenótipos observáveis?","emd",3,"Mostre a cadeia de evidências da alteração molecular até o fenótipo, idealmente com resgate do efeito."]],"Microbiologia e imunologia":[[1161,"Como você distinguiria colonização de infecção?","te",2,"Colonização é presença sem dano. Infecção envolve invasão e resposta do hospedeiro. Diga o critério usado."],[1162,"Como você avaliaria a viabilidade de microrganismos não cultiváveis?","emd",3,"Cite métodos como coloração vivo e morto, PCR com marcadores de viabilidade ou atividade metabólica."],[1163,"Como você justificaria a escolha de um meio de cultura?","te",1,"Justifique pelo microrganismo alvo, pela seletividade e pelo objetivo do cultivo."],[1164,"Como você identificaria contaminação em controles?","te",1,"Diga os controles negativos usados e como interpretaria um crescimento neles."],[1165,"Como você interpretaria a concentração inibitória mínima?","te",2,"É a menor concentração que impede o crescimento visível. Compare com os pontos de corte de referência."],[1166,"Como você distinguiria resistência microbiana de tolerância?","emd",3,"Resistência é crescer em concentrações maiores. Tolerância é sobreviver à exposição sem crescer. Diga como testou."],[1167,"Como você avaliaria a influência de biofilmes?","emd",2,"Diga se considerou a formação de biofilme e como ela muda a resistência e a persistência."],[1168,"Como você avaliaria vieses de amplificação de marcadores?","md",3,"Diga o marcador e os iniciadores usados e como os vieses podem distorcer a composição observada."],[1169,"Como você distinguiria imunidade inata de adaptativa?","te",1,"A imunidade inata é rápida e inespecífica. A adaptativa é específica e tem memória. Diga qual o seu trabalho avalia."],[1170,"Como você interpretaria especificidade e afinidade de anticorpos?","emd",2,"Especificidade é reconhecer só o alvo. Afinidade é a força dessa ligação. Diga como cada uma foi avaliada."],[1171,"Como você avaliaria reatividade cruzada em ensaios imunológicos?","emd",2,"Diga como testou se o ensaio reage com antígenos parecidos e o efeito disso nos resultados."],[1172,"Como você distinguiria resposta inflamatória protetora de patológica?","md",3,"Mostre os marcadores que indicam controle da infecção e os que indicam dano ao tecido."],[1173,"Como você avaliaria efeitos de condições de incubação?","temd",2,"Diga temperatura, tempo e atmosfera, e se a variação deles afeta o resultado."],[1174,"Como você interpretaria diferenças entre abundância relativa e absoluta?","md",3,"Explique que proporções podem mudar sem a quantidade absoluta mudar. Diga se teve medida absoluta."],[1175,"Como você avaliaria a influência de condições de armazenamento?","temd",2,"Diga temperatura, tempo e ciclos de congelamento a que as amostras foram submetidas."],[1176,"Como você distinguiria resposta imune celular de humoral?","te",2,"A resposta celular é mediada por linfócitos T. A humoral, por anticorpos. Diga qual foi medida."],[1177,"Como você avaliaria limitações de modelos in vitro de infecção?","emd",3,"Diga o que falta no modelo em relação ao organismo, como microambiente e sistema imune, e como isso limita as conclusões."],[1178,"Como você investigaria mecanismos de escape imune?","md",3,"Cite o mecanismo investigado e a evidência experimental de que ele reduz a resposta do hospedeiro."]],"Botânica e fisiologia vegetal":[[1179,"Como você distinguiria limitação estomática de bioquímica da fotossíntese?","md",3,"Mostre se a queda da fotossíntese acompanha o fechamento dos estômatos ou a capacidade bioquímica, por curvas A/Ci."],[1180,"Como você avaliaria o efeito do déficit hídrico na condutância estomática?","temd",2,"Mostre como a condutância cai com o déficit hídrico e a partir de que ponto."],[1181,"Como você interpretaria potencial hídrico vegetal?","te",2,"Explique o que o potencial hídrico indica sobre o estado de água da planta e como foi medido."],[1182,"Como você justificaria a escolha de um estágio fenológico?","te",1,"Justifique pela fase em que o processo que você estuda acontece e pela padronização entre plantas."],[1183,"Como você distinguiria aclimatação de adaptação?","tem",2,"Aclimatação é ajuste do indivíduo durante a vida. Adaptação é mudança hereditária ao longo de gerações."],[1184,"Como você avaliaria a influência da intensidade luminosa?","te",1,"Mostre a resposta das variáveis à luz e se houve saturação."],[1185,"Como você interpretaria relações fonte-dreno?","emd",2,"Explique quem produz e quem consome os carboidratos e como isso muda com a fase da planta."],[1186,"Como você investigaria alocação de biomassa entre órgãos?","temd",2,"Diga como mediu a biomassa de cada órgão e o que a partição indica sobre a estratégia da planta."],[1187,"Como você distinguiria deficiência nutricional de toxicidade?","te",2,"Mostre os sintomas, a análise foliar e o teor no solo que indicam falta ou excesso do nutriente."],[1188,"Como você avaliaria diferenças entre germinação e estabelecimento?","te",1,"Germinação é emissão da radícula. Estabelecimento é a plântula sobreviver e crescer de forma independente."],[1189,"Como você avaliaria plasticidade de características foliares?","emd",2,"Mostre a variação das folhas entre ambientes no mesmo genótipo ou espécie."],[1190,"Como você distinguiria crescimento primário de secundário?","te",1,"O crescimento primário aumenta o comprimento. O secundário aumenta a espessura."],[1191,"Como você justificaria a identificação taxonômica de plantas?","te",1,"Cite chave usada, material testemunho em herbário e confirmação por especialista."],[1192,"Como você interpretaria sinais de estresse oxidativo?","emd",2,"Cite marcadores como enzimas antioxidantes e peroxidação de lipídios."],[1193,"Como você avaliaria a influência da temperatura na transpiração?","te",2,"Explique como a temperatura altera o déficit de pressão de vapor e a transpiração."],[1194,"Como você investigaria estratégias reprodutivas vegetais?","temd",2,"Descreva o sistema reprodutivo, a polinização e a dispersão, e como foram observados."],[1195,"Como você distinguiria efeitos de competição aérea e subterrânea?","md",3,"Mostre um desenho que separa raízes e parte aérea, com divisórias ou tratamentos."],[1196,"Como você relacionaria arquitetura radicular à aquisição de recursos?","emd",2,"Ligue profundidade e densidade de raízes à captação de água e nutrientes."]],"Zoologia e comportamento animal":[[1197,"Como você avaliaria vieses de observação de animais?","temd",2,"Cite vieses como horário, observador e visibilidade, e como os reduziu."],[1198,"Como você justificaria a construção de um etograma?","te",2,"Explique como definiu as categorias de comportamento, de forma clara e sem sobreposição."],[1199,"Como você distinguiria seleção sexual de seleção por sobrevivência?","emd",3,"Mostre se a característica aumenta o sucesso reprodutivo ou a sobrevivência."],[1200,"Como você avaliaria a influência de hierarquia social?","temd",2,"Diga como mediu a hierarquia e se ela afetou acesso a recursos ou reprodução."],[1201,"Como você interpretaria estratégias de forrageamento?","emd",2,"Compare a estratégia com previsões de modelos de forrageamento ótimo."],[1202,"Como você investigaria compromissos entre reprodução e sobrevivência?","md",3,"Mostre que investir em reprodução reduz a sobrevivência ou o crescimento, com dados."],[1203,"Como você avaliaria a influência da presença do observador?","te",1,"Diga se houve habituação e como o observador poderia ter alterado o comportamento."],[1204,"Como você distinguiria atividade de ocorrência de uma espécie?","emd",2,"Ocorrência é estar no local. Atividade é o que o animal faz ali. Diga o que os seus dados medem."],[1205,"Como você justificaria métodos de identificação individual?","te",1,"Justifique pelo método, como marcas, anilhas ou padrões naturais, e pelo bem-estar do animal."],[1206,"Como você interpretaria diferenças entre sexos e estágios de vida?","temd",2,"Mostre se separou os dados por sexo e idade e se as diferenças foram relevantes."],[1207,"Como você avaliaria a influência de ritmos circadianos?","te",1,"Mostre se o horário da observação pode ter influenciado o resultado."],[1208,"Como você distinguiria preferência de disponibilidade de habitat?","emd",3,"Compare o uso com a disponibilidade de cada habitat. Usar mais não significa preferir."],[1209,"Como você avaliaria efeitos de habituação a estímulos?","temd",2,"Diga se os animais deixaram de responder ao estímulo com a repetição e como isso foi controlado."],[1210,"Como você interpretaria padrões de cuidado parental?","temd",2,"Descreva quem cuida, quanto investe e como isso varia com o contexto."],[1211,"Como você justificaria critérios de bem-estar animal?","te",1,"Cite as normas seguidas, a aprovação da comissão de ética e os indicadores de bem-estar."],[1212,"Como você avaliaria limites de extrapolação de cativeiro para vida livre?","emd",3,"Diga o que difere entre cativeiro e natureza e como isso limita a generalização."],[1213,"Como você distinguiria plasticidade comportamental de diferenças individuais?","md",3,"Mostre se o mesmo indivíduo muda de comportamento conforme o contexto ou se as diferenças entre indivíduos são consistentes."],[1214,"Como você investigaria efeitos de fragmentação sobre deslocamentos?","emd",3,"Mostre como a fragmentação mudou distâncias, rotas ou frequência de deslocamento."]]},"Engenharias":{"Engenharia civil":[[1215,"Como você justificaria a escolha de um sistema estrutural?","temd",2,"Justifique pelos vãos, pelas cargas, pelos materiais disponíveis, pelo custo e pelo método construtivo."],[1216,"Como você distinguiria estados limites últimos de serviço?","te",1,"O estado limite último trata de ruptura e colapso. O de serviço trata de uso, como deformações, fissuras e vibrações."],[1217,"Como você avaliaria a influência das condições de fundação?","temd",2,"Mostre como o tipo de solo e o recalque esperado definiram a fundação."],[1218,"Como você avaliaria a durabilidade de materiais em ambientes agressivos?","temd",2,"Cite a classe de agressividade, o cobrimento, o tipo de cimento e os ensaios de durabilidade."],[1219,"Como você justificaria coeficientes de segurança?","te",2,"Explique que os coeficientes cobrem incertezas de carga e material, e de que norma eles vêm."],[1220,"Como você identificaria mecanismos de fissuração?","temd",2,"Relacione o padrão das fissuras à causa provável, como flexão, retração ou recalque."],[1221,"Como você avaliaria a influência da cura no desempenho do concreto?","te",2,"Mostre como a cura afeta hidratação, resistência e porosidade do concreto." xa, pela precisão, pelo tempo de resposta e pelo custo."],[1235,"Como você distinguiria potência ativa de reativa?","te",1,"A potência ativa realiza trabalho. A reativa circula entre fonte e carga sem realizar trabalho útil."],[1236,"Como você avaliaria a influência de harmônicas?","temd",2,"Diga a distorção harmônica medida e os efeitos, como aquecimento e interferência."],[1237,"Como você identificaria fontes de ruído eletromagnético?","emd",2,"Cite as fontes e as medidas de blindagem, aterramento ou filtragem."],[1238,"Como você avaliaria perdas em conversão de energia?","temd",2,"Diga as perdas, como no cobre, no ferro e por chaveamento, e a eficiência."],[1239,"Como você interpretaria margens de ganho e fase?","emd",3,"Explique quanto o ganho e a fase podem variar antes de o sistema ficar instável."],[1240,"Como você avaliaria a resolução de um conversor analógico-digital?","te",2,"Diga o número de bits, a faixa e o menor passo medido, comparado com o necessário."],[1241,"Como você distinguiria falhas transitórias de permanentes?","te",2,"Falha transitória some sozinha. Falha permanente exige intervenção."],[1242,"Como você justificaria critérios de proteção elétrica?","temd",2,"Explique a seletividade, a coordenação e a norma usada."],[1243,"Como você avaliaria efeitos de aquecimento em componentes?","temd",2,"Diga as temperaturas medidas ou estimadas e o efeito na vida útil."],[1244,"Como você investigaria saturação de elementos magnéticos?","emd",3,"Mostre a corrente a partir da qual o núcleo satura e o efeito no desempenho."],[1245,"Como você avaliaria a eficiência de um acionamento elétrico?","temd",2,"Diga as perdas e a eficiência em diferentes cargas."],[1246,"Como você interpretaria a influência da impedância de carga?","emd",2,"Mostre como a carga altera tensão, corrente e transferência de potência."],[1247,"Como você justificaria a frequência de amostragem de sinais?","te",2,"Explique o critério de Nyquist e a frequência máxima do sinal."],[1248,"Como você avaliaria a confiabilidade de uma fonte de alimentação?","emd",3,"Cite tempo médio entre falhas, redundância e testes de estresse."],[1249,"Como você investigaria a influência de atrasos em malhas de controle?","md",3,"Mostre como o atraso reduz as margens e o que fez para compensar."]],"Engenharia mecânica":[[1250,"Como você distinguiria tensão de deformação?","te",1,"Tensão é força por área. Deformação é a mudança relativa de dimensão."],[1251,"Como você avaliaria critérios de falha de materiais?","temd",2,"Cite o critério usado, como von Mises ou Tresca, e por que se aplica ao material."],[1252,"Como você avaliaria a influência da fadiga?","temd",2,"Diga o número de ciclos, a curva S-N e o fator de segurança."],[1253,"Como você interpretaria concentrações de tensão?","temd",2,"Mostre onde a tensão se concentra, como em furos e cantos, e como reduziu."],[1254,"Como você distinguiria deformação elástica de plástica?","te",1,"A deformação elástica volta ao normal. A plástica é permanente."],[1255,"Como você avaliaria perdas por atrito?","te",2,"Diga o coeficiente de atrito e a perda de energia estimada."],[1256,"Como você justificaria a seleção de lubrificantes?","temd",2,"Justifique pela viscosidade, pela temperatura e pela carga."],[1257,"Como você interpretaria curvas de desempenho de máquinas?","temd",2,"Explique o ponto ótimo e as faixas de operação da máquina."],[1258,"Como você distinguiria escoamento laminar de turbulento?","te",1,"O regime laminar tem escoamento em camadas. O turbulento é caótico. O número de Reynolds indica o regime."],[1259,"Como você investigaria vibrações e frequências naturais?","emd",2,"Diga as frequências naturais e se ficam longe das frequências de excitação."],[1260,"Como você avaliaria a sensibilidade de resultados à malha numérica?","emd",3,"Mostre que refinar a malha não muda os resultados de forma relevante."],[1261,"Como você justificaria tolerâncias dimensionais?","te",2,"Justifique pela função da peça, pela montagem e function checar(tipo, txt){
  const t = txt.trim().toLowerCase();
  if(t.length < 8) return "";
  if(tipo==="simnao"){
    if(/^(existe|existem|há|ha|é|será|sera|seria|pode|podem|tem|houve|ocorre|ocorrem|são|sao|está|esta|estão|estao)\b/.test(t))
      return "Do jeito que está, a pergunta parece caber em sim ou não. Reescreva começando com Como, Quanto, Em que medida ou Quais fatores.";
    if(t.length > 25 && !/(como|qual|quais|quanto|quanta|quantos|por que|porque|em que medida|de que forma|de que maneira|que fatores|onde|quando)/.test(t))
      return "Não encontrei uma palavra de pergunta aberta. Confira se a resposta não seria apenas sim ou não.";
  }
  if(tipo==="local"){
    if(/(moro|morar|vivo l|vivo a|nasci|mais f[aá]cil|facilidade|perto de casa|pr[oó]xim[oa] de casa|conveni|comodidade|j[aá] conhe[cç]o|trabalho l[aá]|minha cidade)/.test(t))
      return "Isso soa como motivo pessoal ou de conveniência. A banca quer saber o que o local tem de especial para responder a sua pergunta.";
  }
  if(tipo==="data"){
    if(/(redondo|porque sim|mais f[aá]cil|era o que tinha|deu tempo|[uú]ltimos (dez|vinte|10|20|cinco|5) anos)/.test(t))
      return "Um intervalo redondo não se justifica sozinho. Prenda o início e o fim a um evento, a uma norma ou ao começo de uma série de dados.";
    if(/dispon[ií]ve/.test(t) && t.length < 120)
      return "Disponibilidade de dado explica o limite do recorte, mas a banca vai querer também o motivo científico do período.";
  }
  return "";
}

function prepDoc(nome, t){
  /* tira as referencias do fim, que nao ajudam e encarecem a leitura */
  const m = [...t.matchAll(/\n\s*(REFER[ÊE]NCIAS[^\n.]{0,25}|BIBLIOGRAFIA)\s*\n/g)].pop();
  let semRef = false;
  let refs = "";
  if(m && m.index > t.length*0.6){ refs = t.slice(m.index, m.index+80000); t = t.slice(0, m.index); semRef = true; }
  return {nome, texto:t.slice(0,DOC_MAX), cortado:t.length>DOC_MAX, semRef, refs};
}
$("fileDoc").onchange = async e=>{
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  aviso = {txt:"Lendo o arquivo...", err:false}; render();
  try{
    const t = (await lerArquivo(f)).replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
    if(t.length < (cur().plano==="completo"?2000:500)){ aviso = {txt:"Não encontrei texto suficiente no arquivo. PDF escaneado como imagem não pode ser lido. Envie o Word ou um PDF com texto.", err:true}; render(); return; }
    const a = cur(); a.doc = prepDoc(f.name, t); a.formato = {secoes:estrutura(t)};
    if(f.name.toLowerCase().endsWith(".docx")){ try{ a.formato.word = await checaDocx(await f.arrayBuffer()); }catch(e2){ console.error(e2); } }
    aviso = {txt:"",err:false}; persist(); render();
  }catch(err){ console.error(err); aviso = {txt:"Não foi possível ler o arquivo. "+(err.message||""), err:true}; render(); }
};

let relBusy = false;
function norm(x){ return String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function nasRefs(w){
  const a = cur(), refs = a.doc && a.doc.refs; if(!refs) return null;
  const doi = (w.doi||"").toLowerCase(), r = refs.toLowerCase();
  if(doi && r.includes(doi)) return true;
  const t = norm(w.titulo).slice(0,60); return t.length > 20 && norm(refs).includes(t);
}
async function oa(path){ const r = await fetch("https://api.openalex.org/"+path); if(!r.ok) throw new Error("OpenAlex respondeu "+r.status); return r.json(); }
async function montaRelatorio(busca){
  const a = cur(), q = (busca||"").trim();
  if(q.length < 3){ aviso = {txt:"Escreva algumas palavras-chave do tema, de preferência em inglês.", err:true}; render(); return; }
  a.busca = q; relBusy = true; aviso = {txt:"",err:false}; render();
  const ano = new Date().getFullYear(), s = encodeURIComponent(q), argId = a.id;
  try{
    const [w, t, j] = await Promise.all([
      oa("works?search="+s+"&filter=from_publication_date:"+(ano-5)+"-01-01,type:article&sort=cited_by_count:desc&per-page=10&select=id,doi,title,publication_year,cited_by_count,primary_location,authorships"),
      oa("works?search="+s+"&filter=from_publication_date:"+(ano-15)+"-01-01,to_publication_date:"+(ano-1)+"-12-31,type:article&group_by=publication_year"),
      oa("works?search="+s+"&filter=from_publication_date:"+(ano-5)+"-01-01,type:article,primary_location.source.type:journal&group_by=primary_location.source.id")
    ]);
    const alvo = S.arg[argId]; if(!alvo) return;
    alvo.rel = {busca:q, data:new Date().toISOString().slice(0,10),
      artigos:(w.results||[]).map(x=>({titulo:x.title||"", ano:x.publication_year, cit:x.cited_by_count, doi:(x.doi||"").replace("https://doi.org/",""), id:x.id,
        revista:(x.primary_location && x.primary_location.source) ? x.primary_location.source.display_name : "",

function tendencia(anos){

const SECOES = [["Introdução",/INTRODU[CÇ][AÃ]O/],["Objetivos",/\bOBJETIVOS?\b/],
  ["Métodos",/(MATERIA(L|IS) E M[EÉ]TODOS|METODOLOGIA|M[EÉ]TODOS|PROCEDIMENTOS METODOL|PERCURSO METODOL)/],["Resultados",/RESULTADOS/],
  ["Discussão",/DISCUSS/],["Conclusão",/(CONCLUS|CONSIDERA[CÇ][OÕ]ES FINAIS)/],["Referências",/^[\d.\s]*(REFER[EÊ]NCIAS|BIBLIOGRAFIA)/]];
function estrutura(texto){
  /* so titulos principais: linhas curtas, em maiusculas, fora do sumario */
  const linhas = texto.split(/\n+/).map(l=>l.trim()).filter(l=>{
    if(!l || l.length > 90 || /\.{4,}/.test(l) || /\s\d+\s*$/.test(l)) return false;
    const letras = l.replace(/[^A-Za-zÀ-ÿ]/g,""); return letras.length >= 5 && letras === letras.toUpperCase();
  });
  return SECOES.map(([nome, re])=>({nome, pos:linhas.findIndex(l=>re.test(l))}));
}
async function checaDocx(buf){

    const nor = [...st.getElementsByTagName("w:style")].find(s=>at(s,"w:type")==="paragraph" && (at(s,"w:default")==="1" || at(s,"w:styleId")==="Normal"));
    if(nor){ const f = g(nor,"w:rFonts"); if(at(f,"w:ascii")) dFont = at(f,"w:ascii"); const s = g(nor,"w:sz"); if(s) dSz = +at(s,"w:val"); const sp = g(nor,"w:spacing"); if(at(sp,"w:line")) dLine = +at(sp,"w:line"); const jc = g(nor,"w:jc"); if(jc) dJc = at(jc,"w:val"); }
  }
  const fontes = {}, tams = {}, esp = {}, al = {}, add = (o,k,v)=>{ o[k] = (o[k]||0)+v; };

  /* margens da secao que cobre a maior parte do documento (capa e anexos costumam ter outras) */

    tam:tt[0]?+tt[0][0]:0, esp:te[0]?+te[0][0]/240:0, just:Math.round(100*((al.both||0)+(al.distribute||0))/tot(al)),
    marg:pm?{sup:cm(at(pm,"w:top")), inf:cm(at(pm,"w:bottom")), esq:cm(at(pm,"w:left")), dir:cm(at(pm,"w:right"))}:null,

}
function vg(n){ return String(n).replace(".",","); }
function formatoHtml(){

document.addEventListener("change", e=>{
  const a = cur(), t = e.target;
  if(t.id==="ckEst"){ a.temEst = t.checked; persist(); render(); }
  else if(t.dataset.analise){ const v = t.dataset.analise, l = (a.analises = a.analises || []); if(t.checked){ if(!l.includes(v)) l.push(v); } else a.analises = l.filter(x=>x!==v); persist(); }
  else if(t.id==="selArea"){ a.area = t.value; a.sub = ""; persist(); render(); }
  else if(t.id==="selSub"){ a.sub = t.value; persist(); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("button, .drop"); if(!t) return;
  const a = cur(), d = t.dataset;
  if(d.tip){ const el = $("tip_"+d.tip), on = !el.classList.contains("on"); el.innerHTML = on ? tipHtml(qid(d.tip)) : ""; el.classList.toggle("on", on); }
  else if(d.plano){ a.plano = d.plano; ir("preparo"); }
  else if(d.ir){ ir(d.ir); }
  else if(d.fase){ a.fase = d.fase; persist(); render(); }
  else if(d.nivel){ a.nivel = d.nivel; aviso = {txt:"",err:false}; persist(); render(); }
  else if(d.voltar){ a.rodada.pos = a.rodada.ids.length-1; ir("responder"); }
  else if(t.id==="drop"){ $("fileDoc").click(); }
  else if(t.id==="btnCola"){ const b = $("colaBox"); b.style.display = b.style.display==="none" ? "" : "none"; }
  else if(t.id==="btnColaOk"){
    const v = $("colaTxt").value.replace(/[ \t]+/g," ").trim();
    if(v.length < (a.plano==="completo"?2000:500)){ aviso = {txt: a.plano==="completo" ? "Cole o texto completo do trabalho, não só o resumo." : "Cole pelo menos o resumo.", err:true}; render(); return; }
    a.doc = prepDoc("Texto colado", v); a.formato = {secoes:estrutura(v)}; aviso = {txt:"",err:false}; persist(); render();
  }
  else if(t.id==="btnDocDel"){ delete a.doc; delete a.formato; persist(); render(); }
  else if(t.id==="btnCompra"){ const b = $("compraBox"); b.innerHTML = b.innerHTML ? "" : compraHtml(a.plano); }
  else if(t.id==="btnIniciar"){ if(!a.nivel){ aviso = {txt:"Escolha o seu nível: TCC, especialização, mestrado ou doutorado.", err:true}; render(); return; } rodadaBanco(); ir("responder"); }
  else if(t.id==="btnSortear"){ if(confirm("Sortear outras 15 perguntas? As respostas que você já escreveu continuam salvas.")){ rodadaBanco(); ir("responder"); } }
  else if(t.id==="btnGerar"){ gerar(); }
  else if(t.id==="btnRel"){ montaRelatorio($("inBusca").value); }
  else if(t.id==="btnAnt"){ if(a.rodada.pos>0){ a.rodada.pos--; persist(); render(); } else ir("preparo"); }
  else if(t.id==="btnProx"){ if(a.rodada.pos < a.rodada.ids.length-1){ a.rodada.pos++; persist(); render(); topo(); } else ir("correcao"); }
  else if(t.id==="btnGratis"){ corrigir(true); }
  else if(t.id==="btnCorrigir"){ corrigir(false); }
  else if(t.id==="btnNovaRod"){ if(confirm("Começar uma nova rodada de 15 perguntas? As respostas desta rodada continuam salvas.")){ rodadaBanco(); ir("responder"); } }
  else if(t.id==="btnPrint"){ window.print(); }
  else if(t.id==="btnTxt"){ baixar(montaTxt(), "text/plain;charset=utf-8", ".txt"); }
  else if(t.id==="btnDoc"){ baixar(montaDoc(), "application/msword", ".doc"); }
});
$("selArg").onchange = e=>{ S.atual = e.target.value; migra(cur()); ocupado = false; aviso = {txt:"",err:false}; saveLocal(); renderAll(); };
$("btnNova").onclick = ()=>{ const t = prompt("Nome da nova arguição (por exemplo, o título curto do trabalho):"); if(t && t.trim()) nova(t.trim()); };
$("btnRen").onclick = ()=>{ const t = prompt("Novo nome:", cur().titulo); if(t && t.trim()){ cur().titulo = t.trim(); persist(); renderAll(); } };
$("btnDel").onclick = ()=>{
  if(!confirm('Excluir a arguição "'+cur().titulo+'" e todas as respostas dela?')) return;
  const id = S.atual; delete S.arg[id]; S.del.push(id);
  const ids = Object.keys(S.arg); if(ids.length) S.atual = ids[0]; else nova("Meu trabalho", true);
  saveLocal(); flushDel(); renderAll();
};

async function lerArquivo(f){
  const buf = await f.arrayBuffer(), nome = f.name.toLowerCase();
  if(nome.endsWith(".docx")){
    await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js");
    return (await mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  if(nome.endsWith(".pdf")){
    const base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
    await loadScript(base+"pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({data:buf}).promise; let t = "";
    for(let i=1;i<=pdf.numPages;i++){ const c = await (await pdf.getPage(i)).getTextContent(); t += c.items.map(x=>x.str).join(" ")+"\n"; }
    return t;
  }
  throw new Error("Formato não aceito. Envie um arquivo .docx ou .pdf.");
}

/* ============ FIREBASE (login Google e sincronizacao) ============ */
function loadScript(src){return new Promise((ok,er)=>{const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ()=>er(new Error("Falha ao carregar "+src)); document.head.appendChild(s);});}
async function initFirebase(){
  if(!firebaseConfig.apiKey) return;
  try{
    const base = "https://www.gstatic.com/firebasejs/"+FB_VER+"/";
    await loadScript(base+"firebase-app-compat.js");
    await loadScript(base+"firebase-auth-compat.js");
    await loadScript(base+"firebase-firestore-compat.js");
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(async u=>{
      user = u; renderNotice();
      if(u){ setStatus("Carregando da sua conta..."); await syncCloud(); }
      else setStatus("Salvo só neste aparelho");
    });
  }catch(e){ console.error(e); setStatus("Não foi possível conectar ao login. Verifique a internet."); }
}
function colRef(){return db.collection("pb_users").doc(user.uid).collection("arguicoes")}
async function flushDel(){
  if(!user || !db || !S.del.length) return;
  const ids = S.del.slice();
  try{ await Promise.all(ids.map(id=>colRef().doc(id).delete())); S.del = S.del.filter(x=>!ids.includes(x)); saveLocal(); }
  catch(e){ console.error(e); }
}
async function syncCloud(){
  try{
    await flushDel();
    const snap = await colRef().get(), remotos = {};
    snap.forEach(d=>{remotos[d.id] = d.data()});
    Object.values(remotos).forEach(r=>{ const l = S.arg[r.id]; if(!l || (r.updatedAt||0) > (l.updatedAt||0)){ if(l && l.doc && l.doc.texto) r.doc = l.doc; else if(r.doc && !r.doc.texto) delete r.doc; S.arg[r.id] = r; } });
    const vazia = a=>!Object.values(a.r||{}).some(v=>(v||"").trim());
    const subir = Object.values(S.arg).filter(l=>{ const r = remotos[l.id]; return (!r && !vazia(l)) || (r && (l.updatedAt||0) > (r.updatedAt||0)); });
    await Promise.all(subir.map(l=>colRef().doc(l.id).set(semTexto(l))));
    /* descarta rascunho vazio criado antes do login, se a conta ja tem arguicoes */
    Object.values(S.arg).forEach(l=>{ if(!remotos[l.id] && vazia(l) && Object.keys(S.arg).length > 1) delete S.arg[l.id]; });
    if(!cur()) S.atual = Object.values(S.arg).sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;
    Object.values(S.arg).forEach(migra); saveLocal(); renderAll(); setStatus("Salvo na sua conta");
  }catch(e){ console.error(e); setStatus("Erro ao carregar da conta. Mostrando o que está neste dispositivo."); }
}
$("btnLogin").onclick = ()=>{
  if(!auth){ alert(firebaseConfig.apiKey ? "O login ainda está carregando ou falhou. Verifique a internet e recarregue a página." : "O login com Google ainda não foi configurado neste arquivo."); return; }
  if(user){ auth.signOut(); return; }
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{ console.error(e); setStatus("Login não concluído"); });
};


/* ============ INICIO ============ */
loadLocal(); renderAll(); setStatus("Salvo só neste aparelho"); initFirebase();
</script>
